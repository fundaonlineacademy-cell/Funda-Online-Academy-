name: FOA Change Control Guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scope-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate FOA scope and protected changes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail

          git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/foa-changed-files.txt
          echo "Changed files:"
          cat /tmp/foa-changed-files.txt

          body="${PR_BODY:-}"

          for heading in "## Owner request" "## In scope" "## Out of scope" "## Behaviour deliberately preserved" "## Regression checks performed"; do
            if ! grep -Fqi "$heading" <<< "$body"; then
              echo "::error::Missing required FOA PR section: $heading"
              exit 1
            fi
          done

          protected_regex='^(index\.html|academy-map\.html|supabase-config\.js|ambassador-referral-tracking\.js|login\.html|ambassador-login\.html|reset-password\.html|staff-access-code-login\.js|login-layout-order-restore\.js|auth\.html|create-account\.html|onboarding\.html|dashboard\.html|admin-v2\.html|staff-portal\.html|ambassador-portal-v2\.html|ambassadors\.html|courses-public\.html|course-view\.html|.*\.sql)$'

          if grep -Eq "$protected_regex" /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'OWNER-APPROVED-PROTECTED-CHANGE:[[:space:]]*yes' <<< "$body"; then
              echo "::error::This PR changes a protected FOA surface. The PR must explicitly record OWNER-APPROVED-PROTECTED-CHANGE: yes when the owner request actually requires it."
              exit 1
            fi
          fi

          if grep -Fxq 'index.html' /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'OWNER-APPROVED-HOMEPAGE-CHANGE:[[:space:]]*yes' <<< "$body"; then
              echo "::error::The Home page is owner-approved as final. A direct index.html change requires explicit OWNER-APPROVED-HOMEPAGE-CHANGE: yes."
              exit 1
            fi
          fi

          if grep -Fxq 'courses-public.html' /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'OWNER-APPROVED-BROWSE-COURSES-CHANGE:[[:space:]]*yes' <<< "$body"; then
              echo "::error::Browse Courses is owner-approved as final. A direct courses-public.html change requires explicit OWNER-APPROVED-BROWSE-COURSES-CHANGE: yes."
              exit 1
            fi
          fi

          login_surface_regex='^(login\.html|ambassador-login\.html|reset-password\.html|staff-access-code-login\.js|login-layout-order-restore\.js|auth\.html)$'

          if grep -Eq "$login_surface_regex" /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'OWNER-APPROVED-LOGIN-CHANGE:[[:space:]]*yes' <<< "$body"; then
              echo "::error::The Login section is owner-approved as final. A direct Login/authentication-surface change requires explicit OWNER-APPROVED-LOGIN-CHANGE: yes."
              exit 1
            fi
          fi

          ambassador_surface_regex='(^|/)(ambassadors\.html|ambassador-application\.html|ambassador-login\.html|ambassador-portal-v2\.html|.*ambassador.*\.(js|sql))$'

          if grep -Eq "$ambassador_surface_regex" /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'OWNER-APPROVED-AMBASSADOR-CHANGE:[[:space:]]*yes' <<< "$body"; then
              echo "::error::The Ambassador system is owner-approved as final. A direct Ambassador programme/application/login/portal/admin/database change requires explicit OWNER-APPROVED-AMBASSADOR-CHANGE: yes."
              exit 1
            fi
          fi

          create_account_surface_regex='^(create-account\.html|auth\.html|funda-transparent-logo-master\.js)$'

          if grep -Eq "$create_account_surface_regex" /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'OWNER-APPROVED-CREATE-ACCOUNT-CHANGE:[[:space:]]*yes' <<< "$body"; then
              echo "::error::Create Student Account is owner-approved as final. A direct registration-surface change requires explicit OWNER-APPROVED-CREATE-ACCOUNT-CHANGE: yes."
              exit 1
            fi
          fi

          homepage_runtime_regex='^(index\.html|supabase-config\.js|academy-identity\.js|marketing-public-tracking\.js|create-account-route-fix\.js|ambassador-referral-tracking\.js|funda-typography\.js|funda-text-contrast\.js|public-academy-map-link\.js|public-employer-link\.js|public-ambassador-link\.js|public-learner-testimonial-name\.js|public-course-enroll-cta\.js)$'

          if grep -Eq "$homepage_runtime_regex" /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'HOMEPAGE-REGRESSION-CHECKED:[[:space:]]*yes' <<< "$body"; then
              echo "::error::This PR touches a file that can affect the approved Home page. Record HOMEPAGE-REGRESSION-CHECKED: yes only after confirming the final Home-page design and behaviour remain unchanged."
              exit 1
            fi
          fi

          browse_courses_runtime_regex='^(courses-public\.html|supabase-config\.js|courses-public-faq-loader\.js|courses-public-enrollment-faq\.js|course-career-skill-areas\.js|course-search-mobile-polish\.js|ambassador-referral-tracking\.js|academy-identity\.js|create-account-route-fix\.js|public-course-enroll-cta\.js|courses-public-controls-restore\.js|courses-public-brand-theme\.js|public-course-value\.js|funda-typography\.js|funda-text-contrast\.js|public-academy-map-link\.js|public-employer-link\.js|public-ambassador-link\.js|public-learner-testimonial-name\.js)$'

          if grep -Eq "$browse_courses_runtime_regex" /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'BROWSE-COURSES-REGRESSION-CHECKED:[[:space:]]*yes' <<< "$body"; then
              echo "::error::This PR touches a file that can affect the final approved Browse Courses page. Record BROWSE-COURSES-REGRESSION-CHECKED: yes only after confirming its final design, FAQ/contact content, navigation and responsive behaviour remain unchanged."
              exit 1
            fi
          fi

          login_runtime_regex='^(login\.html|ambassador-login\.html|reset-password\.html|supabase-config\.js|staff-access-code-login\.js|login-layout-order-restore\.js|create-account-route-fix\.js|ambassador-referral-tracking\.js|academy-map\.html|auth\.html)$'

          if grep -Eq "$login_runtime_regex" /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'LOGIN-REGRESSION-CHECKED:[[:space:]]*yes' <<< "$body"; then
              echo "::error::This PR touches a file that can affect the final approved Login section. Record LOGIN-REGRESSION-CHECKED: yes only after confirming Student, Staff/Admin, Ambassador, recovery and approved destinations remain correct."
              exit 1
            fi
          fi

          ambassador_runtime_regex='(^|/)(ambassadors\.html|ambassador-application\.html|ambassador-login\.html|ambassador-portal-v2\.html|.*ambassador.*\.(js|sql)|supabase-config\.js|create-account\.html|create-account-route-fix\.js|courses-public\.html|public-course-enroll-cta\.js|reset-password\.html|admin-v2\.html)$'

          if grep -Eq "$ambassador_runtime_regex" /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'AMBASSADOR-REGRESSION-CHECKED:[[:space:]]*yes' <<< "$body"; then
              echo "::error::This PR touches a file that can affect the final approved Ambassador system. Record AMBASSADOR-REGRESSION-CHECKED: yes only after checking programme/application/status, login/recovery/logout, referral attribution/privacy, earnings/ranks/banking/support and portal boundaries."
              exit 1
            fi
          fi

          create_account_runtime_regex='^(create-account\.html|auth\.html|funda-transparent-logo-master\.js|supabase-config\.js|create-account-route-fix\.js|ambassador-referral-tracking\.js|onboarding\.html)$'

          if grep -Eq "$create_account_runtime_regex" /tmp/foa-changed-files.txt; then
            if ! grep -Eqi 'CREATE-ACCOUNT-REGRESSION-CHECKED:[[:space:]]*yes' <<< "$body"; then
              echo "::error::This PR touches a file that can affect the final approved Create Student Account journey. Record CREATE-ACCOUNT-REGRESSION-CHECKED: yes only after checking required fields, Terms/Privacy, strong password, registration, referral attribution and onboarding/course-selection handoff."
              exit 1
            fi
          fi

          runtime_count=$(awk '!/^(AGENTS\.md|FOA_APPROVED_STATE\.md|FOA_CHANGE_CONTROL\.md|\.github\/)/ && NF {count++} END {print count+0}' /tmp/foa-changed-files.txt)

          if [ "$runtime_count" -gt 12 ]; then
            if ! grep -Eqi 'OWNER-APPROVED-BROAD-CHANGE:[[:space:]]*yes' <<< "$body"; then
              echo "::error::This PR changes more than 12 runtime/data files. Split the work or explicitly record owner approval for a broad change."
              exit 1
            fi
          fi

          echo "FOA change-control scope checks passed."
