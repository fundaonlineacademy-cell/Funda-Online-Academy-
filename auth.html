<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Funda Online Academy - Student Portal</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#071e35,#0b4773);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:#222;
}

.auth-container{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:18px;
  padding:28px 22px;
  box-shadow:0 12px 35px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  margin-bottom:22px;
}

.logo h1{
  color:#0b4773;
  font-size:27px;
  line-height:1.2;
}

.logo p{
  color:#666;
  margin-top:6px;
  font-size:18px;
}

form h2{
  text-align:center;
  margin-bottom:20px;
  color:#071e35;
  font-size:27px;
}

label{
  display:block;
  margin:13px 0 6px;
  font-weight:bold;
  font-size:16px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#0b4773;
  box-shadow:0 0 0 2px rgba(11,71,115,.1);
}

button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:9px;
  background:#0b4773;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#071e35;
}

.switch{
  text-align:center;
  margin-top:18px;
  font-size:16px;
  line-height:1.6;
}

.switch a,
.link-button{
  color:#0b4773;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}

.link-button{
  background:none;
  border:0;
  padding:0;
  margin:0;
  width:auto;
  font-size:inherit;
}

.forgot{
  display:block;
  text-align:center;
  margin-top:14px;
  color:#0b4773;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}

.message{
  padding:10px;
  margin-bottom:15px;
  border-radius:8px;
  background:#f1f5f9;
  text-align:center;
  font-size:15px;
}

.hidden{
  display:none !important;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#0b4773;
  text-decoration:none;
  font-size:16px;
}

.password-note{
  font-size:13px;
  color:#666;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="auth-container">

  <div class="logo">
    <h1>Funda Online Academy</h1>
    <p>Student Portal</p>
  </div>

  <div id="message" class="message hidden"></div>


  <!-- LOGIN FORM -->
  <form id="login-form">

    <h2>Student Login</h2>

    <label for="login-email">Email Address</label>
    <input
      type="email"
      id="login-email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label for="login-password">Password</label>
    <input
      type="password"
      id="login-password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button type="submit">
      Login
    </button>

    <a
      href="#"
      id="forgot"
      class="forgot"
    >
      Forgot Password?
    </a>

    <div class="switch">
      Don't have an account?
      <a
        href="#"
        id="signup-tab"
      >
        Create Account
      </a>
    </div>

  </form>


  <!-- REGISTRATION FORM -->
  <form id="signup-form" class="hidden">

    <h2>Create Student Account</h2>

    <label for="signup-name">
      Full Name
    </label>

    <input
      type="text"
      id="signup-name"
      placeholder="Enter your full name"
      autocomplete="name"
      required
    >


    <label for="signup-email">
      Email Address
    </label>

    <input
      type="email"
      id="signup-email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >


    <label for="signup-password">
      Password
    </label>

    <input
      type="password"
      id="signup-password"
      placeholder="Create a password"
      minlength="6"
      autocomplete="new-password"
      required
    >

    <div class="password-note">
      Password must contain at least 6 characters.
    </div>


    <label for="signup-confirm-password">
      Confirm Password
    </label>

    <input
      type="password"
      id="signup-confirm-password"
      placeholder="Confirm your password"
      minlength="6"
      autocomplete="new-password"
      required
    >


    <button type="submit">
      Create Account
    </button>


    <div class="switch">
      Already have an account?
      <a
        href="#"
        id="login-tab"
      >
        Login
      </a>
    </div>

  </form>


  <a
    class="back"
    href="index.html"
  >
    ← Back to Funda Online Academy
  </a>

</div>


<!-- Supabase must load FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase configuration -->
<script src="supabase-config.js"></script>

<!-- Authentication code -->
<script src="auth.js"></script>

</body>
</html>
