<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - Funda</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script></head>
<body class="min-h-screen bg-[#EEF3FF] flex items-center justify-center p-6"><div class="bg-white rounded-[24px] shadow-xl max-w-[520px] w-full p-8">
<h2 class="text-3xl font-extrabold text-center">Create Account</h2>
<input id="full_name" placeholder="Full Name - Thabo Nkosi" class="w-full border rounded-xl px-4 py-3 mt-6">
<input id="email" placeholder="Email - you@email.com" class="w-full border rounded-xl px-4 py-3 mt-3">
<input id="phone" placeholder="Phone - 082 123 4567" class="w-full border rounded-xl px-4 py-3 mt-3">
<input id="password" type="password" placeholder="Password - Min 6 chars" class="w-full border rounded-xl px-4 py-3 mt-3">
<label class="flex gap-2 mt-4 text-xs"><input type="checkbox" id="terms"> I agree to Terms & POPIA</label>
<button onclick="handleRegister()" id="btn" class="w-full bg-[#2563EB] text-white font-bold rounded-xl py-4 mt-6">Create Account →</button>
<a href="login.html" class="block text-center mt-4 text-sm underline">Already have account? Login</a>
<a href="courses-public.html" class="block text-center mt-2 bg-gray-100 py-3 rounded-xl">📖 Browse Courses No Login Needed</a>
</div>
<script>
const supabaseClient=supabase.createClient("https://nzwfowwoazmpnwfrednh.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56d2Zvd3dvYXptcG53ZnJlZG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NzcwMzIsImV4cCI6MjEwMjE1MzAzMn0.7bY4V_KCPsJMz4Kf7QsErRSKGbKbxwxTY8R4YbVj7rU");
async function handleRegister(){const full_name=document.getElementById('full_name').value;const email=document.getElementById('email').value;const phone=document.getElementById('phone').value;const password=document.getElementById('password').value;
if(!full_name||!email||!password)return alert('Fill all');if(!document.getElementById('terms').checked)return alert('Accept terms');
const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name,phone}}});if(error)return alert(error.message);
if(data.user)await supabaseClient.from('profiles').update({full_name,email}).eq('id',data.user.id);
alert('Account created! Complete enrollment now');location.href='onboarding.html';}
</script></body></html>
