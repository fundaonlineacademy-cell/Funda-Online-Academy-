<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statement of Results | Funda Online Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="funda-transparent-logo-master.js?v=20260922"></script>
<script src="results-approved-signature.js?v=20260903-locked"></script>
<script src="results-approved-seal.js?v=20260903-locked"></script>
<script src="results-qrcode.min.js?v=20260922"></script>
<style>
@page{size:A4;margin:0}
:root{--ink:#07172f;--navy:#0a315c;--gold:#c49a46;--rule:#d7e1eb;--muted:#546780}
*{box-sizing:border-box}
html,body{margin:0;background:#e8edf3;color:var(--ink);font-family:"Source Sans 3",Arial,sans-serif}
.result-page{width:210mm;height:297mm;margin:0 auto 10mm;background:#fff;position:relative;overflow:hidden;padding:10mm 10mm 13mm;page-break-after:always}
.result-page:last-child{page-break-after:auto}
.result-page:before{content:"";position:absolute;top:0;left:0;right:0;height:2.2mm;background:var(--ink)}
.result-page:after{content:"";position:absolute;top:2.2mm;left:0;right:0;height:.5mm;background:var(--gold)}
.inner{position:relative;z-index:2}
.masthead{display:grid;grid-template-columns:53mm 1fr;gap:7mm;align-items:center;min-height:34mm}
.brand{display:flex;align-items:center;justify-content:flex-start}
.brand img{width:47mm;height:32mm;object-fit:contain;object-position:center}
.brand .missing{font-size:9pt;font-weight:800;color:var(--ink)}
.titles{text-align:right}
.eyebrow{font-size:8pt;font-weight:800;color:#8a691f;letter-spacing:.13em}
.titles h1{font-size:21pt;line-height:1.07;margin:1mm 0;color:var(--ink);font-weight:800;letter-spacing:.015em}
.subtitle{font-size:8pt;color:var(--muted);font-weight:700;letter-spacing:.04em}
.mast-rule{height:.35mm;background:var(--gold);margin:3mm 0 2.5mm}
.metadata{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:4mm}
.meta{border-top:.35mm solid var(--navy);padding:1.4mm 0 1mm;min-width:0}
.meta b{display:block;color:var(--muted);font-size:7pt;text-transform:uppercase;letter-spacing:.08em}
.meta span{display:block;font-size:8.6pt;font-weight:800;overflow-wrap:anywhere;line-height:1.15;margin-top:.6mm}
.meta.status span{color:var(--navy)}
.identity{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:2.8mm}
.panel{border:.3mm solid var(--rule);border-radius:1.7mm;overflow:hidden}
.panel h2,.section-head{margin:0;background:var(--ink);color:#fff;font-size:8.2pt;font-weight:800;letter-spacing:.07em;padding:1.7mm 3mm}
.detail-list{padding:1.5mm 3mm 1.8mm}
.detail{display:grid;grid-template-columns:26mm 1fr;gap:1mm;padding:.8mm 0;line-height:1.16;min-height:4.8mm;border-bottom:.2mm solid #e8edf2}
.detail:last-child{border-bottom:0}
.detail .label{font-size:7.3pt;font-weight:700;color:var(--muted)}
.detail .value{font-size:8.1pt;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.academic{margin-top:2.7mm}
.section-row{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:1.7mm 3mm}
.section-row h2{font-size:8.2pt;letter-spacing:.07em;margin:0}
.pattern{font-size:7pt;font-weight:700;letter-spacing:.03em}
.atable{border-collapse:collapse;table-layout:fixed;width:100%;font-size:8pt}
.atable col:nth-child(1){width:37%}
.atable col:nth-child(2){width:18%}
.atable col:nth-child(3){width:13%}
.atable col:nth-child(4){width:12%}
.atable col:nth-child(5){width:20%}
.atable th{background:#f1f5f9;color:var(--ink);font-size:7pt;letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:1.7mm 2mm;border-bottom:.4mm solid var(--gold)}
.atable th:nth-child(3),.atable th:nth-child(4),.atable td:nth-child(3),.atable td:nth-child(4){text-align:center}
.atable td{border-bottom:.2mm solid var(--rule);padding:1.1mm 2mm;line-height:1.17;vertical-align:middle;min-height:5.6mm}
.atable tr.module-start td{border-top:.25mm solid #b5c4d6}
.atable .module{font-weight:800;font-size:7.8pt}
.atable td small{display:block;font-size:7.5pt;font-weight:600;color:#2e4059;line-height:1.12}
.atable .numeric{font-weight:800;white-space:nowrap}
.atable .outcome{font-weight:700}
.academic-note{color:var(--muted);font-size:7pt;margin:1.7mm 1mm 0}
.continue{margin-top:4mm;border-top:.3mm solid var(--gold);padding-top:2mm;font-size:8pt;color:var(--muted);font-weight:700;text-align:right}
.final{margin-top:2.6mm;border:.3mm solid var(--rule);border-radius:1.7mm;overflow:hidden}
.final-body{display:grid;grid-template-columns:36mm 1fr}
.cpd-panel{border-right:.25mm solid var(--rule);padding:2mm 1mm;text-align:center;display:flex;align-items:center;flex-direction:column;justify-content:center}
.cpd-art{width:32mm;height:32mm;overflow:hidden;position:relative;border-radius:50%;background:#f6f1e5}
.cpd-art img{position:absolute;width:352mm;height:235mm;max-width:none;left:-259mm;top:-13mm}
.cpd-art .fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#80601d;font-size:16pt;font-weight:900}
.cpd-art.failed .fallback{display:flex}
.cpd-panel p{font-size:6.6pt;line-height:1.2;margin:1.2mm 0 0;color:var(--muted);font-weight:700}
.final-list{padding:1.3mm 3mm}
.final-row{display:grid;grid-template-columns:33mm 1fr;gap:2mm;border-bottom:.2mm solid #e8edf2;min-height:5.3mm;align-items:center}
.final-row:last-child{border-bottom:0}
.final-row b{color:var(--muted);font-size:7.1pt}
.final-row strong{font-size:8.1pt;color:var(--ink)}
.final-row .main-result{font-size:10pt;color:var(--navy)}
.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3.2mm;align-items:stretch;margin-top:2.3mm}
.bottom .panel h2{text-align:center;font-size:7.5pt;padding:1.45mm}
.auth-body{padding:1.5mm 2mm;text-align:center;min-height:24mm}
.sig{height:15mm;border-bottom:.3mm solid var(--gold);position:relative}
.sig img{height:15mm;width:34mm;object-fit:contain;object-position:bottom;position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.auth-body b{display:block;font-size:7.8pt;margin-top:1.3mm}
.auth-body small{display:block;color:var(--muted);font-size:6.7pt}
.seal-body{padding:1.5mm 2mm;text-align:center;font-size:6.7pt;line-height:1.25;color:var(--muted);font-weight:700}
.official-seal{width:22mm;height:22mm;margin:1mm auto;border:.6mm double var(--gold);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8b6824;font-size:6pt;line-height:1.08;transform:rotate(-6deg)}
.official-seal b{color:var(--ink);font-size:7.2pt}
.verify-body{padding:1.5mm 2mm;text-align:center;min-height:24mm}
.qr-target{width:27mm;height:27mm;padding:1.3mm;margin:0 auto;border:.25mm solid var(--rule);display:flex;align-items:center;justify-content:center}
.qr-target img,.qr-target canvas{width:24mm!important;height:24mm!important}
.verify-body p{font-size:6.9pt;line-height:1.2;margin:1.1mm 0;overflow-wrap:anywhere}
.verify-body b{color:var(--navy)}
.test-note{font-size:8.1pt;line-height:1.35;color:var(--ink);font-weight:700;margin:3.5mm 1mm}
.test-page .watermark{position:absolute;z-index:1;top:48%;left:50%;white-space:nowrap;transform:translate(-50%,-50%) rotate(-24deg);font-size:31pt;letter-spacing:.04em;font-weight:900;color:rgba(7,23,47,.11);pointer-events:none}
.test-page .test-flag{background:#eaf0f6;color:var(--ink);border:.25mm solid var(--gold);padding:.8mm 2mm;border-radius:1mm;font-size:7pt;font-weight:900;letter-spacing:.07em;display:inline-block}
.foot{position:absolute;bottom:4mm;left:10mm;right:10mm;border-top:.35mm solid var(--gold);display:flex;justify-content:space-between;align-items:flex-end;gap:4mm;padding-top:1.6mm;color:var(--muted);font-size:6.7pt;line-height:1.25}
.foot strong{color:var(--ink)}
.foot .page-no{white-space:nowrap;font-weight:800}
@media print{html,body{background:#fff}.result-page{margin:0}}
</style>
</head>
<body>
<div id="statement"></div>
<script>
(function(){
"use strict";
var VERIFY_BASE="https://fundaonlineacademy.co.za/verify.html";
var CERT_ART="https://nzwfowwoazmpnwfrednh.supabase.co/storage/v1/object/public/certificate-assets/approved-master.png";
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function text(v,fallback){return v===null||v===undefined||String(v).trim()===""?fallback:esc(v)}
function finite(v){return v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v))?Number(v):null}
function num(v){var n=finite(v);return n===null?"":(Number.isInteger(n)?String(n):String(Number(n.toFixed(1))))}
function pct(v){var n=finite(v);return n===null?"—":n.toFixed(1)+"%"}
function courseType(d){if(d.course_type)return d.course_type;var c=String(d.course||"");var match=c.match(/(Professional Short Course|Practical Skills Short Course|Short Course)$/i);return match?match[1]:"—"}
function detail(label,value){return '<div class="detail"><span class="label">'+esc(label)+'</span><span class="value">'+text(value,"—")+'</span></div>'}
function finalRow(label,value,highlight){return '<div class="final-row"><b>'+esc(label)+'</b><strong'+(highlight?' class="main-result"':'')+'>'+text(value,"—")+'</strong></div>'}
function groupRows(a){var groups=[],map=new Map();a.forEach(function(x,i){var key=String(x.module_id||x.module_number||x.module||x.module_name||i);if(!map.has(key)){var g={number:x.module_number||"",name:x.module_name||x.module||"",items:[]};map.set(key,g);groups.push(g)}map.get(key).items.push(x)});return groups}
function splitGroups(groups){var count=groups.reduce(function(n,g){return n+g.items.length},0);var pages=Math.max(1,Math.ceil(count/10));var target=Math.ceil(count/pages),chunks=[],chunk=[],used=0;groups.forEach(function(g){if(chunk.length&&used+g.items.length>target&&chunks.length<pages-1){chunks.push(chunk);chunk=[];used=0}chunk.push(g);used+=g.items.length});if(chunk.length||!chunks.length)chunks.push(chunk);return chunks}
function pattern(a){var types=new Set(a.map(function(x){return String(x.type||x.assessment_type||"").toLowerCase()}));if(types.size===1&&types.has("summative"))return "SUMMATIVE ONLY";if(types.has("summative")&&types.has("formative"))return "FORMATIVE + SUMMATIVE";return "REQUIRED ASSESSMENTS"}
function tableRows(groups){var html="";groups.forEach(function(g){g.items.forEach(function(x,j){var raw=x.percentage??x.mark??x.score_percentage;var score=finite(x.score??x.points_awarded),total=finite(x.total_marks??x.max_score);var mark=score!==null&&total!==null&&total>0?num(score)+"/"+num(total):"—";var outcome=x.outcome||x.result||(x.passed===true?"Competent":x.passed===false?"Not Yet Competent":"—");html+='<tr'+(j===0?' class="module-start"':'')+'>'+(j===0?'<td rowspan="'+g.items.length+'"><span class="module">'+(g.number?"Module "+esc(g.number):"Module")+'</span><small>'+text(g.name,"")+'</small></td>':"")+'<td>'+text(x.type||x.assessment_type||x.title,"—")+'</td><td class="numeric">'+esc(mark)+'</td><td class="numeric">'+pct(raw)+'</td><td class="outcome">'+esc(outcome)+'</td></tr>'})});return html||'<tr><td colspan="5">Assessment results will appear here after the academic record is prepared.</td></tr>'}
function renderPage(d,groups,pageNo,totalPages,allItems){var test=d.test===true,last=pageNo===totalPages,assets=window.RESULTS_APPROVED_ASSETS||{},logo=window.FUNDA_TRANSPARENT_LOGO_MASTER||"",mark=test?"TEST / NON-OFFICIAL":text(d.status,"ACADEMICALLY APPROVED"),cpd=finite(d.cpd),hours=finite(d.hours),number=text(d.result,test?"TEST REFERENCE PENDING":"PENDING"),certificate=d.certificate_issued&&d.certificate_number?d.certificate_number:(test?"Not issued - test":"Not issued");var title=test?"SIMULATED ACADEMIC RESULTS":"ACADEMIC RESULTS";var assessmentHead='<div class="section-row"><h2>ACADEMIC RESULTS'+(pageNo>1?" - CONTINUED":"")+'</h2><span class="pattern">'+pattern(allItems)+'</span></div>';var html='<section class="result-page'+(test?' test-page':'')+'">'+(test?'<div class="watermark" aria-hidden="true">TEST / NON-OFFICIAL</div>':'')+'<div class="inner"><header class="masthead"><div class="brand">'+(logo?'<img src="'+logo+'" alt="Funda Online Academy">':'<span class="missing">Funda Online Academy</span>')+'</div><div class="titles"><div class="eyebrow">FUNDA ONLINE ACADEMY</div><h1>STATEMENT OF RESULTS</h1><div class="subtitle">'+title+'</div></div></header><div class="mast-rule"></div><div class="metadata"><div class="meta"><b>'+(test?"Test reference":"Results number")+'</b><span>'+number+'</span></div><div class="meta"><b>Issue date</b><span>'+text(d.issued,"Pending issue")+'</span></div><div class="meta status"><b>Record status</b><span>'+(test?'<em class="test-flag">TEST / NON-OFFICIAL</em>':mark)+'</span></div></div>';
if(pageNo===1){html+='<div class="identity"><section class="panel"><h2>LEARNER DETAILS</h2><div class="detail-list">'+detail("Learner name",d.name)+detail("Learner number",d.learner)+detail("ID / Passport no.",d.id_number)+'</div></section><section class="panel"><h2>COURSE DETAILS</h2><div class="detail-list">'+detail("Course title",d.course)+detail("Course type",courseType(d))+detail("Duration",d.duration)+detail("Completion date",d.completion)+detail("Mode of delivery",d.delivery||"Fully online")+'</div></section></div>'}
html+='<section class="academic">'+assessmentHead+'<table class="atable"><colgroup><col><col><col><col><col></colgroup><thead><tr><th>Module</th><th>Assessment type</th><th>Mark</th><th>Mark (%)</th><th>Outcome</th></tr></thead><tbody>'+tableRows(groups)+'</tbody></table><p class="academic-note">Mark shows points earned out of total points. The percentage and outcome are recorded for each required assessment.'+(test?' All marks shown here are simulated.':'')+'</p></section>';
if(last){html+='<section class="final"><div class="section-head">FINAL ACADEMIC OUTCOME</div><div class="final-body"><div class="cpd-panel"><div class="cpd-art"><img src="'+(window.FUNDA_CPD_ART_URL||CERT_ART)+'" crossorigin="anonymous" alt="Academy CPD accreditation emblem" onerror="this.parentNode.classList.add(\'failed\');this.style.display=\'none\'"><span class="fallback">CPD</span></div><p>CPD No. #405201</p></div><div class="final-list">'+finalRow("Overall result",d.overall!==null&&d.overall!==undefined&&d.overall!==""?pct(d.overall):"—",true)+finalRow("Academic outcome",d.outcome)+finalRow("Course status",d.course_status)+finalRow("Learning hours",hours!==null?num(hours)+" hours":"Pending allocation")+finalRow("CPD points",cpd!==null?num(cpd)+" points":"Pending course allocation")+finalRow("Certificate number",certificate)+'</div></div></section>';
html+='<div class="bottom">'+(test?'<section class="panel"><h2>TEST RECORD</h2><div class="auth-body"><p class="test-note">Design review only.<br>No academic sign-off or certificate has been issued.</p></div></section>':'<section class="panel"><h2>ACADEMIC AUTHENTICATION</h2><div class="auth-body"><div class="sig">'+(assets.signature?'<img src="'+assets.signature+'" alt="Academic Director signature">':'')+'</div><b>Mr. A. Futhe</b><small>Academic Director</small></div></section>')+(test?'<section class="panel"><h2>SIMULATED OUTCOME</h2><div class="seal-body"><p class="test-note">These outcomes are simulated and do not certify assessment completion.</p></div></section>':'<section class="panel"><h2>ACADEMY RECORD</h2><div class="seal-body"><div class="official-seal"><b>FUNDA</b>ONLINE ACADEMY<br>OFFICIAL RECORD</div>Formal academic record of Funda Online Academy</div></section>')+(test?'<section class="panel"><h2>NOT VERIFIABLE</h2><div class="verify-body"><p class="test-note">This test reference does not verify a learner result.</p></div></section>':'<section class="panel"><h2>VERIFY THIS RESULT</h2><div class="verify-body">'+(d.result?'<div class="qr-target" aria-label="QR code for results verification"></div><p>Scan or visit <b>fundaonlineacademy.co.za/verify.html</b><br>Enter results number <b>'+esc(d.result)+'</b></p>':'<p class="test-note">A verification code appears after formal issue.</p>')+'</div></section>')+'</div>'}else{html+='<div class="continue">Academic results continue on the next page.</div>'}
html+='</div><footer class="foot"><span><strong>Funda Online Academy (Pty) Ltd</strong> is a registered company and an International CPD Accredited Trainer.<br>CPD No: #405201 | Registration No: 2023/830451/07'+(test?' | TEST / NON-OFFICIAL':'')+'</span><span class="page-no">PAGE '+pageNo+' OF '+totalPages+'</span></footer></section>';return html}
function render(d){d=d||{};var a=Array.isArray(d.assessments)?d.assessments:[],groups=groupRows(a),chunks=splitGroups(groups);document.getElementById("statement").innerHTML=chunks.map(function(g,i){return renderPage(d,g,i+1,chunks.length,a)}).join("");if(d.test!==true&&d.result){if(!window.QRCode)throw new Error("Results verification QR library did not load");var url=VERIFY_BASE+"?type=transcript&code="+encodeURIComponent(d.result),targets=document.querySelectorAll(".qr-target");if(!targets.length)throw new Error("Results verification QR target was not rendered");targets.forEach(function(el){new QRCode(el,{text:url,width:116,height:116,colorDark:"#07172f",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});if(!el.querySelector("canvas, img"))throw new Error("Results verification QR could not be created")})}}
window.renderFundaResult=render;render({test:true});
})();
</script>
</body>
</html>
