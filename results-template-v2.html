<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approved Statement of Results</title><script src="funda-official-brand-assets.js?v=20260903"></script><script src="funda-official-signature.js?v=20260903-approved"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><style>@page{size:A4;margin:0}*{box-sizing:border-box}html,body{margin:0;background:#eef2f7;font-family:Arial,Helvetica,sans-serif;color:#102747}.statement{padding:0}.result-page{width:210mm;height:297mm;margin:0 auto;background:#fff;position:relative;overflow:hidden;padding:10mm 8mm 12mm;box-shadow:0 10px 28px #0b274420}.curve{position:absolute;z-index:0;pointer-events:none}.tl{left:-24mm;top:-34mm;width:86mm;height:56mm;background:#082f5e;border-radius:0 0 74% 0;transform:rotate(-8deg);box-shadow:0 3mm 0 #c89b2f}.tr{right:-28mm;top:-38mm;width:88mm;height:55mm;background:#c89b2f;border-radius:0 0 0 74%;transform:rotate(8deg)}.bl{left:-29mm;bottom:-40mm;width:94mm;height:58mm;background:#c89b2f;border-radius:0 74% 0 0;transform:rotate(7deg)}.br{right:-29mm;bottom:-38mm;width:95mm;height:58mm;background:#082f5e;border-radius:74% 0 0 0;transform:rotate(-7deg);box-shadow:0 -3mm 0 #c89b2f}.inner{position:relative;z-index:2;height:100%}.head{display:grid;grid-template-columns:49mm 1fr 58mm;gap:4mm;align-items:start}.brand{display:flex;align-items:center;justify-content:center;height:39mm}.brand img{width:37mm;height:auto;display:block;object-fit:contain;filter:none}.title{text-align:center;color:#0a2f5f;padding-top:1mm}.title h1{font-family:Georgia,'Times New Roman',serif;font-size:20pt;line-height:1.05;margin:0;font-weight:800;letter-spacing:.01em}.rule{width:56mm;height:.35mm;background:#c89b2f;margin:3mm auto 2.4mm;position:relative}.rule:after{content:"";position:absolute;width:2.1mm;height:2.1mm;border-radius:50%;background:#c89b2f;left:27mm;top:-.85mm}.title p{font-weight:800;font-size:8.3pt;letter-spacing:.025em;margin:0}.meta{border:.35mm solid #d5b25d;border-radius:2mm;background:#fffdf8;padding:2mm 3mm;font-size:7pt;min-height:39mm}.mrow{display:grid;grid-template-columns:5mm 22mm 3mm 1fr;gap:1mm;align-items:center;padding:1.4mm 0;border-bottom:.2mm solid #eadfbd}.mrow:last-child{border-bottom:0}.ico{color:#bd8d1e;font-size:9.5pt}.mrow b{color:#19365b}.pair{display:grid;grid-template-columns:1fr 1.08fr;gap:7mm;margin-top:4.2mm}.card,.final,.auth,.verify{border:.3mm solid #d6be78;border-radius:1.6mm;overflow:hidden;background:#fff}.bar{background:#082f5e;color:#fff;font-weight:800;text-align:center;padding:1.65mm;font-size:8.5pt;letter-spacing:.02em}.rows{padding:1mm 3mm}.drow{display:grid;grid-template-columns:6mm 31mm 4mm 1fr;align-items:center;min-height:7.6mm;border-bottom:.2mm solid #eee4c8;font-size:7.7pt}.drow:last-child{border-bottom:0}.di{color:#c08e1d;text-align:center}.dl{font-weight:700}.dv{font-weight:700;line-height:1.25}.academic{margin-top:3.2mm}.atable{width:100%;border-collapse:collapse;table-layout:fixed;font-size:6.45pt}.atable th{border:.2mm solid #d8c78e;padding:1.45mm 1.5mm;color:#16345a;font-size:6.8pt}.atable td{border:.2mm solid #d8c78e;padding:1.15mm 1.6mm;line-height:1.12;vertical-align:middle}.atable td:nth-child(3),.atable td:nth-child(4){text-align:center}.module{font-weight:800}.module small{display:block;font-weight:600;margin-top:.3mm}.final{margin-top:2.8mm}.finalgrid{display:grid;grid-template-columns:58mm 1fr;min-height:35mm}.award{border-right:.2mm solid #eadfbd;display:flex;align-items:center;justify-content:center}.award svg{width:46mm;height:33mm}.frows{padding:1mm 4mm}.frow{display:grid;grid-template-columns:7mm 48mm 4mm 1fr;align-items:center;min-height:6.4mm;border-bottom:.2mm solid #eee4c8;font-size:7.5pt}.frow:last-child{border-bottom:0}.ficon{color:#c08e1d;text-align:center}.frow strong{font-size:9.4pt;color:#082f5e}.bottom{display:grid;grid-template-columns:62mm 1fr 64mm;gap:7mm;margin-top:2.8mm;align-items:stretch}.authbody{padding:2mm 5mm 2.5mm}.sigline{height:23mm;border-bottom:.35mm solid #c89b2f;position:relative;overflow:visible}.sigline img{position:absolute;left:5mm;bottom:.5mm;width:45mm;height:20mm;object-fit:contain;object-position:left bottom;filter:none;opacity:1;mix-blend-mode:normal}.authbody b{display:block;margin-top:1.6mm;font-size:8.7pt;color:#15365f}.authbody div{font-size:7.3pt;line-height:1.35}.official{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:7.8pt;font-weight:700;line-height:1.42;color:#19395f;padding:1.5mm}.seal{margin-top:2mm;width:29mm;height:29mm;border:1mm double #c89b2f;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;color:#b8861b}.seal img{width:12mm;height:12mm;object-fit:contain}.seal:before{content:"FUNDA ONLINE ACADEMY";position:absolute;top:2.1mm;font-size:4.3pt;font-weight:900;letter-spacing:.08em}.seal:after{content:"OFFICIAL RECORD";position:absolute;bottom:2mm;font-size:4.4pt;font-weight:900;letter-spacing:.08em}.verifybody{text-align:center;padding:2mm 3mm}.qr{width:24mm;height:24mm;border:.35mm solid #c89b2f;border-radius:1.5mm;padding:1mm;margin:0 auto;background:#fff}.qr canvas{width:100%!important;height:100%!important}.verifybody p{font-size:6.5pt;line-height:1.18;margin:.8mm 0}.url{font-size:6.2pt;color:#b57f13;font-weight:800}.numberbox{background:#082f5e;color:#fff;border-radius:1.5mm;padding:1.7mm 1mm;font-size:6.9pt;font-weight:800}.footer{position:absolute;left:11mm;right:11mm;bottom:4mm;background:#082f5e;color:#fff;text-align:center;border-radius:8mm 8mm 0 0;padding:1.7mm 6mm;font-size:6.1pt;line-height:1.2}@media print{body{background:#fff}.result-page{box-shadow:none;margin:0;page-break-after:always}.result-page:last-child{page-break-after:auto}}</style></head><body><main id="statement" class="statement"></main><script>const VERIFY_URL='https://fundaonlineacademy.co.za/verify/';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const logo=()=>window.FUNDA_OFFICIAL_LOGO||'';const sig=()=>window.FUNDA_ACADEMIC_DIRECTOR_SIGNATURE||'';function group(a){const m=new Map();(Array.isArray(a)?a:[]).forEach((x,i)=>{const k=x.module_id||x.module_number||x.module||i;let g=m.get(k);if(!g){g={number:x.module_number||'',name:x.module||x.module_name||'Assessment',items:[]};m.set(k,g)}g.items.push(x)});return [...m.values()]}function detail(i,l,v){return `<div class="drow"><span class="di">${i}</span><span class="dl">${l}</span><span>:</span><span class="dv">${esc(v||'—')}</span></div>`}function award(){return `<svg viewBox="0 0 220 160" aria-hidden="true"><g fill="#c89b2f">${[0,1,2,3,4,5,6].map((_,i)=>`<ellipse cx="${56-i*4}" cy="${127-i*16}" rx="7" ry="14" transform="rotate(${-34+i*5} ${56-i*4} ${127-i*16})"/>`).join('')}${[0,1,2,3,4,5,6].map((_,i)=>`<ellipse cx="${164+i*4}" cy="${127-i*16}" rx="7" ry="14" transform="rotate(${34-i*5} ${164+i*4} ${127-i*16})"/>`).join('')}<polygon points="110,120 116,132 130,134 120,144 122,158 110,151 98,158 100,144 90,134 104,132"/></g><g fill="#082f5e"><polygon points="68,64 110,43 152,64 110,85"/><path d="M84 72v24c16 11 36 11 52 0V72l-26 13z"/><rect x="151" y="64" width="3" height="29"/><circle cx="152.5" cy="95" r="4"/></g></svg>`}function tableRows(groups){return groups.map(g=>{const items=g.items||[];const span=Math.max(items.length,1);return items.map((x,j)=>`<tr>${j===0?`<td rowspan="${span}"><div class="module">Module ${esc(g.number||'')}<small>${esc(g.name)}</small></div></td>`:''}<td>${esc(x.type||x.assessment_type||x.title||'Assessment')}</td><td><b>${esc(Number(x.percentage??x.mark??80).toFixed(1))}%</b></td><td>${esc((x.outcome||'Competent').replace(/^./,c=>c.toUpperCase()))}</td></tr>`).join('')}).join('')}function page(d,groups,p,total,final){return `<section class="result-page"><div class="curve tl"></div><div class="curve tr"></div><div class="curve bl"></div><div class="curve br"></div><div class="inner"><div class="head"><div class="brand"><img src="${logo()}" alt="Funda Online Academy"></div><div class="title"><h1>OFFICIAL<br>STATEMENT OF<br>RESULTS</h1><div class="rule"></div><p>ACADEMIC RECORD OF ACHIEVEMENT</p></div><div class="meta"><div class="mrow"><span class="ico">▤</span><b>Results No.</b><span>:</span><span>${esc(d.result||'—')}</span></div><div class="mrow"><span class="ico">▦</span><b>Issue Date</b><span>:</span><span>${esc(d.issued||'—')}</span></div><div class="mrow"><span class="ico">◎</span><b>Status</b><span>:</span><span>${d.test?'TEST':'FINAL'}</span></div><div class="mrow"><span class="ico">▤</span><b>Page</b><span>:</span><span>${p} of ${total}</span></div></div></div>${p===1?`<div class="pair"><div class="card"><div class="bar">LEARNER DETAILS</div><div class="rows">${detail('●','Learner Name',d.name)}${detail('▣','Learner Number',d.learner)}${detail('★','ID / Passport No.',d.id_number)}</div></div><div class="card"><div class="bar">COURSE DETAILS</div><div class="rows">${detail('▣','Course Title',d.course)}${detail('◷','Course Duration',d.duration)}${detail('▧','Completion Date',d.completion)}${detail('▰','Mode of Delivery','Fully Online')}</div></div></div>`:''}<div class="academic"><div class="bar">ACADEMIC RESULTS</div><table class="atable"><thead><tr><th style="width:31%">MODULE</th><th style="width:29%">ASSESSMENT TYPE</th><th style="width:20%">MARK (%)</th><th style="width:20%">OUTCOME</th></tr></thead><tbody>${tableRows(groups)}</tbody></table></div>${final?`<div class="final"><div class="bar">FINAL ACADEMIC OUTCOME</div><div class="finalgrid"><div class="award">${award()}</div><div class="frows"><div class="frow"><span class="ficon">▥</span><b>Overall Result</b><span>:</span><strong>${esc(d.overall)}%</strong></div><div class="frow"><span class="ficon">◎</span><b>Outcome</b><span>:</span><strong>${esc(d.outcome||'COMPETENT')}</strong></div><div class="frow"><span class="ficon">✓</span><b>Course Status</b><span>:</span><strong>${esc(d.course_status||'COMPLETED')}</strong></div><div class="frow"><span class="ficon">◷</span><b>CPD Hours / Points</b><span>:</span><span><b>${esc(d.cpd||d.hours||'—')} Hours</b></span></div><div class="frow"><span class="ficon">▤</span><b>Certificate No. (Issued)</b><span>:</span><span><b>${d.test?'Not Applicable (Test Only)':esc(d.certificate_number||'Not Applicable')}</b></span></div></div></div></div><div class="bottom"><div class="auth"><div class="bar">AUTHENTICATION</div><div class="authbody"><div class="sigline"><img src="${sig()}" alt="Academic Director signature"></div><b>Mr. A. Futhe</b><div>Academic Director</div><div>Funda Online Academy</div><div>${esc(d.issued||'')}</div></div></div><div class="official"><div>This Statement of Results is<br>generated from the official academic<br>records of Funda Online Academy.</div><div class="seal"><img src="${logo()}" alt=""><span></span></div></div><div class="verify"><div class="bar">VERIFY THIS RESULT</div><div class="verifybody"><div class="qr" id="qr-${p}"></div><p>Scan QR Code<br>or visit</p><div class="url">${VERIFY_URL}</div><p><b>Enter Results Number</b><br>(as shown on this Statement)</p><div class="numberbox">Enter your Results Number</div></div></div></div>`:''}</div><div class="footer">This document is confidential and issued without alteration.<br>Any tampering or alteration will invalidate this Statement of Results.</div></section>`}window.renderFundaResult=function(d){const all=group(d.assessments);const chunks=[];for(let i=0;i<all.length;i+=10)chunks.push(all.slice(i,i+10));if(!chunks.length)chunks.push([]);document.getElementById('statement').innerHTML=chunks.map((g,i)=>page(d,g,i+1,chunks.length,i===chunks.length-1)).join('');setTimeout(()=>{const el=document.getElementById('qr-'+chunks.length);if(el&&window.QRCode)QRCode.toCanvas(VERIFY_URL,{errorCorrectionLevel:'M',margin:1,width:180,color:{dark:'#07172f',light:'#ffffff'}},(e,c)=>{if(!e){el.innerHTML='';el.appendChild(c)}})},40)};</script></body></html>
