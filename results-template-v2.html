@page{size:A4;margin:0}*{box-sizing:border-box}html,body{margin:0;background:#eef2f7;font-family:Arial,Helvetica,sans-serif;color:#102747}.result-page{width:210mm;min-height:297mm;margin:0 auto;background:#fff;position:relative;overflow:hidden;padding:10mm 8mm 12mm}.curve{position:absolute;z-index:0;pointer-events:none}.tl{left:-24mm;top:-34mm;width:86mm;height:56mm;background:#082f5e;border-radius:0 0 74% 0;transform:rotate(-8deg);box-shadow:0 3mm 0 #c89b2f}.tr{right:-28mm;top:-38mm;width:88mm;height:55mm;background:#c89b2f;border-radius:0 0 0 74%;transform:rotate(8deg)}.bl{left:-29mm;bottom:-40mm;width:94mm;height:58mm;background:#c89b2f;border-radius:0 74% 0 0;transform:rotate(7deg)}.br{right:-29mm;bottom:-38mm;width:95mm;height:58mm;background:#082f5e;border-radius:74% 0 0 0;transform:rotate(-7deg);box-shadow:0 -3mm 0 #c89b2f}.inner{position:relative;z-index:2}.head{display:grid;grid-template-columns:49mm 1fr 58mm;gap:4mm;align-items:start}.brand{display:flex;align-items:center;justify-content:center;height:39mm}.brand img{width:32mm;height:29mm;object-fit:contain}.title{text-align:center;color:#0a2f5f;padding-top:1mm}.title h1{font-family:Georgia,serif;font-size:20pt;line-height:1.05;margin:0;font-weight:800}.rule{width:56mm;height:.35mm;background:#c89b2f;margin:3mm auto 2.4mm}.title p{font-weight:800;font-size:8.3pt;margin:0}.meta,.card,.final,.auth,.verify{border:.3mm solid #d6be78;border-radius:1.6mm;overflow:hidden;background:#fff}.meta{padding:2mm 3mm;font-size:7pt;min-height:39mm}.mrow{display:grid;grid-template-columns:5mm 22mm 3mm 1fr;gap:1mm;align-items:center;padding:1.4mm 0;border-bottom:.2mm solid #eadfbd}.mrow:last-child{border-bottom:0}.ico,.di,.ficon{color:#bd8d1e}.mrow b{color:#19365b}.pair{display:grid;grid-template-columns:1fr 1.08fr;gap:7mm;margin-top:4.2mm}.bar{background:#082f5e;color:#fff;font-weight:800;text-align:center;padding:1.65mm;font-size:8.5pt}.rows{padding:1mm 3mm}.drow{display:grid;grid-template-columns:6mm 31mm 4mm 1fr;align-items:center;min-height:7.6mm;border-bottom:.2mm solid #eee4c8;font-size:7.7pt}.drow:last-child{border-bottom:0}.dl,.dv{font-weight:700}.academic{margin-top:3.2mm}.atable{width:100%;border-collapse:collapse;table-layout:fixed;font-size:6.45pt}.atable th{border:.2mm solid #d8c78e;padding:1.45mm;color:#16345a;font-size:6.8pt}.atable td{border:.2mm solid #d8c78e;padding:1.15mm 1.6mm;height:5.4mm}.emptyresults{height:55mm;border:.2mm solid #d8c78e;border-top:0}.module{font-weight:800}.module small{display:block}.final{margin-top:2.8mm}.finalgrid{display:grid;grid-template-columns:58mm 1fr;min-height:35mm}.award{border-right:.2mm solid #eadfbd;display:flex;align-items:center;justify-content:center}.award img{width:46mm;height:33mm;object-fit:contain}.frows{padding:1mm 4mm}.frow{display:grid;grid-template-columns:7mm 48mm 4mm 1fr;align-items:center;min-height:6.4mm;border-bottom:.2mm solid #eee4c8;font-size:7.5pt}.frow:last-child{border-bottom:0}.frow strong{font-size:9.4pt;color:#082f5e}.bottom{display:grid;grid-template-columns:62mm 1fr 64mm;gap:7mm;margin-top:2.8mm;align-items:stretch}.authbody{padding:2mm 5mm 2.5mm}.sigline{height:23mm;border-bottom:.35mm solid #c89b2f;position:relative}.sigline img{position:absolute;left:4mm;bottom:.5mm;width:46mm;height:20mm;object-fit:contain}.authbody b{display:block;margin-top:1.6mm;font-size:8.7pt;color:#15365f}.authbody div{font-size:7.3pt;line-height:1.35}.official{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:7.6pt;font-weight:700;line-height:1.38;color:#19395f;padding:1.5mm}.official-seal{margin-top:2mm;width:28mm;height:28mm;border:1.1mm double #c89b2f;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#b8871c;background:#fff;font-family:Georgia,serif;font-weight:800;box-shadow:inset 0 0 0 .7mm #fff,inset 0 0 0 1mm #c89b2f}.official-seal .sealtext{text-align:center;font-size:5.6pt;line-height:1.05;letter-spacing:.25px}.official-seal .book{font-size:14pt;line-height:1;margin:1mm 0;color:#082f5e}.verifybody{text-align:center;padding:2mm 3mm}.qr{width:24mm;height:24mm;border:.35mm solid #c89b2f;border-radius:1.5mm;padding:1mm;margin:0 auto}.qr img{width:100%;height:100%;object-fit:contain}.verifybody p{font-size:6.5pt;line-height:1.18;margin:.8mm 0}.url{font-size:6.2pt;color:#b57f13;font-weight:800}.numberbox{background:#082f5e;color:#fff;border-radius:1.5mm;padding:1.7mm;font-size:6.9pt;font-weight:800}.footer{position:absolute;left:11mm;right:11mm;bottom:4mm;background:#082f5e;color:#fff;text-align:center;border-radius:8mm 8mm 0 0;padding:1.7mm 6mm;font-size:6.1pt}@media print{body{background:#fff}.result-page{margin:0}}
</style></head><body><main id="statement"></main><script>
const A=()=>window.RESULTS_APPROVED_ASSETS||{},VERIFY_URL='https://fundaonlineacademy.co.za/verify/';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function detail(i,l,v){return `<div class="drow"><span class="di">${i}</span><span class="dl">${l}</span><span>:</span><span class="dv">${esc(v||'')}</span></div>`}function groups(a){const out=[],m=new Map();(Array.isArray(a)?a:[]).forEach((x,i)=>{const k=x.module_id??x.module_number??x.module??x.module_name??i;if(!m.has(k)){const g={number:x.module_number||'',name:x.module_name||x.module||'',items:[]};m.set(k,g);out.push(g)}m.get(k).items.push(x)});return out}function rows(a){let h='';for(const g of groups(a)){g.items.forEach((x,j)=>{const raw=x.percentage??x.mark??x.score_percentage,mark=raw==null?'':Number(raw).toFixed(1)+'%';h+=`<tr>${j===0?`<td rowspan="${g.items.length}"><div class="module">${g.number?`Module ${esc(g.number)}:`:''}<small>${esc(g.name)}</small></div></td>`:''}<td>${esc(x.type||x.assessment_type||x.title||'')}</td><td><b>${esc(mark)}</b></td><td>${esc(x.outcome||x.result||'')}</td></tr>`})}return h}function page(d={}){const a=A(),has=Array.isArray(d.assessments)&&d.assessments.length,cpd=d.cpd_display||(d.hours!==''&&d.hours!=null?d.hours+' Hours':(d.cpd!==''&&d.cpd!=null?d.cpd+' Points':''));return `<section class="result-page"><div class="curve tl"></div><div class="curve tr"></div><div class="curve bl"></div><div class="curve br"></div><div class="inner"><div class="head"><div class="brand"><img src="${a.logo||''}"></div><div class="title"><h1>OFFICIAL<br>STATEMENT OF<br>RESULTS</h1><div class="rule"></div><p>ACADEMIC RECORD OF ACHIEVEMENT</p></div><div class="meta"><div class="mrow"><span class="ico">▤</span><b>Results No.</b><span>:</span><span>${esc(d.result||'')}</span></div><div class="mrow"><span class="ico">▦</span><b>Issue Date</b><span>:</span><span>${esc(d.issued||'')}</span></div><div class="mrow"><span class="ico">◎</span><b>Status</b><span>:</span><span>${esc(d.status||(d.result?'FINAL':''))}</span></div><div class="mrow"><span class="ico">▤</span><b>Page</b><span>:</span><span>1 of 1</span></div></div></div><div class="pair"><div class="card"><div class="bar">LEARNER DETAILS</div><div class="rows">${detail('●','Learner Name',d.name)}${detail('▣','Learner Number',d.learner)}${detail('★','ID / Passport No.',d.id_number)}</div></div><div class="card"><div class="bar">COURSE DETAILS</div><div class="rows">${detail('▣','Course Title',d.course)}${detail('◷','Course Duration',d.duration)}${detail('▧','Completion Date',d.completion)}${detail('▰','Mode of Delivery',d.delivery)}</div></div></div><div class="academic"><div class="bar">ACADEMIC RESULTS</div><table class="atable"><thead><tr><th>MODULE</th><th>ASSESSMENT TYPE</th><th>MARK (%)</th><th>OUTCOME</th></tr></thead>${has?`<tbody>${rows(d.assessments)}</tbody>`:''}</table>${has?'':'<div class="emptyresults"></div>'}</div><div class="final"><div class="bar">FINAL ACADEMIC OUTCOME</div><div class="finalgrid"><div class="award"><img src="${a.award||''}"></div><div class="frows"><div class="frow"><span class="ficon">▥</span><b>Overall Result</b><span>:</span><strong>${d.overall!==''&&d.overall!=null?esc(d.overall)+'%':''}</strong></div><div class="frow"><span>◎</span><b>Outcome</b><span>:</span><strong>${esc(d.outcome||'')}</strong></div><div class="frow"><span>✓</span><b>Course Status</b><span>:</span><strong>${esc(d.course_status||'')}</strong></div><div class="frow"><span>◷</span><b>CPD Hours / Points</b><span>:</span><b>${esc(cpd)}</b></div><div class="frow"><span>▤</span><b>Certificate No. (Issued)</b><span>:</span><b>${esc(d.certificate_number||'')}</b></div></div></div></div><div class="bottom"><div class="auth"><div class="bar">AUTHENTICATION</div><div class="authbody"><div class="sigline"><img src="${a.signature||''}"></div><b>Mr. A. Futhe</b><div>Academic Director</div><div>Funda Online Academy</div></div></div><div class="official"><div>This Statement of Results is<br>generated from the official academic<br>records of Funda Online Academy.</div><div class="official-seal" aria-label="Official Record seal"><div class="sealtext">FUNDA ONLINE<br>ACADEMY<div class="book">◫</div>OFFICIAL RECORD</div></div></div><div class="verify"><div class="bar">VERIFY THIS RESULT</div><div class="verifybody"><div class="qr"><img src="${a.qr||''}"></div><p>Scan QR Code<br>or visit</p><div class="url">${VERIFY_URL}</div><p><b>Enter Results Number</b><br>(as shown on this Statement)</p><div class="numberbox">Enter your Results Number</div></div></div></div></div><div class="footer">This document is confidential and issued without alteration.<br>Any tampering or alteration will invalidate this Statement of Results.</div></section>`}window.renderFundaResult=d=>document.getElementById('statement').innerHTML=page(d||{});window.renderFundaResult({});
</script></body></html>
