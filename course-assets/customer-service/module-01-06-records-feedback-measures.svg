<svg xmlns="http://www.w3.org/2000/svg" width="780" height="790" viewBox="0 0 780 790" role="img" aria-labelledby="t d"><title id="t">Records to Service Improvement</title><desc id="d">Capture facts, review signals, correct the process. Capture minimum facts: Record purpose, status and authorised owner; Protect the record: Control access and follow retention rules; Check completeness: Verify timestamps, decisions and next step; Review measures: Compare response, resolution and rework; Improve and retest: Change one cause and measure its effect</desc><rect width="780" height="790" rx="22" fill="#e8f0fa"/><rect x="15" y="15" width="750" height="760" rx="20" fill="white"/><path d="M15 37 Q15 15 37 15 H743 Q765 15 765 37 V135 H15Z" fill="#071d49"/><text x="35" y="62" font-size="34" font-weight="bold" fill="white">Records to Service Improvement</text><text x="35" y="104" font-size="21" fill="#f3d48c">Capture facts, review signals, correct the process</text><rect x="15" y="132" width="750" height="5" fill="#e6b950"/><g font-family="Arial,Helvetica,sans-serif"><g><rect x="32" y="143" width="716" height="103" rx="16" fill="#f1f5fb" stroke="#cfdded"/><circle cx="86" cy="194" r="29" fill="#e6b950"/><text x="86" y="204" text-anchor="middle" font-size="29" font-weight="bold" fill="#071d49">1</text><text x="135" y="184" font-size="27" font-weight="bold" fill="#071d49">Capture minimum facts</text><text x="135" y="218" font-size="19" fill="#294865">Record purpose, status and authorised owner</text></g><g><rect x="32" y="258" width="716" height="103" rx="16" fill="#fff" stroke="#cfdded"/><circle cx="86" cy="309" r="29" fill="#e6b950"/><text x="86" y="319" text-anchor="middle" font-size="29" font-weight="bold" fill="#071d49">2</text><text x="135" y="299" font-size="27" font-weight="bold" fill="#071d49">Protect the record</text><text x="135" y="333" font-size="19" fill="#294865">Control access and follow retention rules</text></g><g><rect x="32" y="373" width="716" height="103" rx="1