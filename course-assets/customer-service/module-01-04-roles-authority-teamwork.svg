<svg xmlns="http://www.w3.org/2000/svg" width="780" height="790" viewBox="0 0 780 790" role="img" aria-labelledby="t d"><title id="t">Roles and Responsible Decisions</title><desc id="d">How to choose the right owner for a service task. Recognise the task: Identify what the customer actually needs; Check authority: Read the relevant role and delegation rules; Assign ownership: Name who will act and who will follow up; Coordinate support: Share the minimum useful details internally; Close the loop: Confirm the owner, outcome and next step</desc><rect width="780" height="790" rx="22" fill="#e8f0fa"/><rect x="15" y="15" width="750" height="760" rx="20" fill="white"/><path d="M15 37 Q15 15 37 15 H743 Q765 15 765 37 V135 H15Z" fill="#071d49"/><text x="35" y="62" font-size="34" font-weight="bold" fill="white">Roles and Responsible Decisions</text><text x="35" y="104" font-size="21" fill="#f3d48c">How to choose the right owner for a service task</text><rect x="15" y="132" width="750" height="5" fill="#e6b950"/><g font-family="Arial,Helvetica,sans-serif"><g><rect x="32" y="143" width="716" height="103" rx="16" fill="#f1f5fb" stroke="#cfdded"/><circle cx="86" cy="194" r="29" fill="#e6b950"/><text x="86" y="204" text-anchor="middle" font-size="29" font-weight="bold" fill="#071d49">1</text><text x="135" y="184" font-size="27" font-weight="bold" fill="#071d49">Recognise the task</text><text x="135" y="218" font-size="19" fill="#294865">Identify what the customer actually needs</text></g><g><rect x="32" y="258" width="716" height="103" rx="16" fill="#fff" stroke="#cfdded"/><circle cx="86" cy="309" r="29" fill="#e6b950"/><text x="86" y="319" text-anchor="middle" font-size="29" font-weight="bold" fill="#071d49">2</text><text x="135" y="299" font-size="27" font-weight="bold" fill="#071d49">Check authority</text><text x="135" y="333" font-size="19" fill="#294865">Read the relevant role and delegation rules</text></g><g><rect x="32" y="373" width="716" height="103" rx="16" fill="#f1f5fb" stroke="#cfdded"/><circle cx="86" cy="424" r="29" fill="#e6b950"/><text x="86" y="434" text-anchor="middle" font-size="29" font-weight="bold" fill="#071d49">3</text><text x="135" y="414" font-size="27" font-weight="bold" fill="#071d49">Assign ownership</text><text x="135" y="448" font-size="19" fill="#294865">Name who will act and who will follow up</text></g><g><rect x="32" y="488" width="716" height="103" rx="16" fill="#fff" stroke="#cfdded"/><circle cx="86" cy="539" r="29" fill="#e6b950"/><text x="86" y="549" text-anchor="middle" font-size="29" font-weight="bold" fill="#071d49">4</text><text x="135" y="529" font-size="27" font-weight="bold" fill="#071d49">Coordinate support</text><text x="135" y="563" font-size="19" fill="#294865">Share the minimum useful details internally</text></g><g><rect x="32" y="603" width="716" height="103" rx="16" fill="#f1f5fb" stroke="#cfdded"/><circle cx="86" cy="654" r="29" fill="#e6b950"/><text x="86" y="664" text-anchor="middle" font-size="29" font-weight="bold" fill="#071d49">5</text><text x="135" y="644" font-size="27" font-weight="bold" fill="#071d49">Close the loop</text><text x="135" y="678" font-size="19" fill="#294865">Confirm the owner, outcome and next step</text></g></g><text x="36" y="762" font-size="16" fill="#506780">Funda Online Academy | Original instructional diagram | Module 1</text></svg>