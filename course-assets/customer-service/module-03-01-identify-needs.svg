<svg xmlns="http://www.w3.org/2000/svg" width="840" height="750" viewBox="0 0 840 750" role="img" aria-labelledby="title desc"><title id="title">Need, Want or Expectation?</title><desc id="desc">Distinguish three kinds of customer statements: Notice request: Record the customer's actual words; Classify: Need, preference or expected standard?; Clarify: Ask which result matters most; Verify: Check what service can legitimately offer; Agree: Name the realistic next step.</desc><rect width="840" height="750" rx="22" fill="#e8eff8"/><rect x="11" y="11" width="818" height="728" rx="18" fill="white"/><path d="M11 36Q11 11 36 11H804Q829 11 829 36V121H11Z" fill="#091e48"/><text x="28" y="65" fill="white" font-size="32" font-weight="bold" font-family="Arial,Helvetica,sans-serif">Need, Want or Expectation?</text><text x="28" y="101" fill="#eed48f" font-size="21" font-family="Arial,Helvetica,sans-serif">Distinguish three kinds of customer statements</text><line x1="12" x2="829" y1="121" y2="121" stroke="#e3b84e" stroke-width="4"/><g font-family="Arial,Helvetica,sans-serif"><rect x="26" y="136" width="787" height="96" rx="16" fill="#f1f5fc" stroke="#d2dfed"/><circle cx="77" cy="184" r="28" fill="#e6bb56"/><text x="77" y="194" text-anchor="middle" font-size="29" font-weight="bold" fill="#091e48">1</text><text x="130" y="176" fill="#091e48" font-size="26" font-weight="bold">Notice request</text><text x="130" y="208" fill="#31516b" font-size="19">Record the customer's actual words</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="26" y="248" width="787" height="96" rx="16" fill="white" stroke="#d2dfed"/><circle cx="77" cy="296" r="28" fill="#e6bb56"/><text x="77" y="306" text-anchor="middle" font-size="29" font-weight="bold" fill="#091e48">2</text><text x="130" y="288" fill="#091e48" font-size="26" font-weight="bold">Classify</text><text x="130" y="320" fill="#31516b" font-size="19">Need, preference or expected standard?</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="26" y="360" width="787" height="96" rx="16" fill="#f1f5fc" stroke="#d2dfed"/><circle cx="77" cy="408" r="28" fill="#e6bb56"/><text x="77" y="418" text-anchor="middle" font-size="29" font-weight="bold" fill="#091e48">3</text><text x="130" y="400" fill="#091e48" font-size="26" font-weight="bold">Clarify</text><text x="130" y="432" fill="#31516b" font-size="19">Ask which result matters most</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="26" y="472" width="787" height="96" rx="16" fill="white" stroke="#d2dfed"/><circle cx="77" cy="520" r="28" fill="#e6bb56"/><text x="77" y="530" text-anchor="middle" font-size="29" font-weight="bold" fill="#091e48">4</text><text x="130" y="512" fill="#091e48" font-size="26" font-weight="bold">Verify</text><text x="130" y="544" fill="#31516b" font-size="19">Check what service can legitimately offer</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="26" y="584" width="787" height="96" rx="16" fill="#f1f5fc" stroke="#d2dfed"/><circle cx="77" cy="632" r="28" fill="#e6bb56"/><text x="77" y="642" text-anchor="middle" font-size="29" font-weight="bold" fill="#091e48">5</text><text x="130" y="624" fill="#091e48" font-size="26" font-weight="bold">Agree</text><text x="130" y="656" fill="#31516b" font-size="19">Name the realistic next step</text></g><text x="28" y="725" fill="#506d89" font-size="16" font-family="Arial">Funda Online Academy | Customer Service | Module 3 | Lesson 3.1</text></svg>