<svg xmlns="http://www.w3.org/2000/svg" width="880" height="770" viewBox="0 0 880 770" role="img" aria-labelledby="title desc"><title id="title">Loyalty Through Earned Value</title><desc id="desc">Repeat choice is not proof of satisfaction; five stages: Identify benefit, Reduce friction, Offer choice, Respect exit, Learn.</desc><rect width="880" height="770" rx="20" fill="#ebf2f9"/><rect x="14" y="14" width="852" height="742" rx="18" fill="white"/><rect x="14" y="14" width="852" height="122" rx="18" fill="#102a52"/><rect x="14" y="110" width="852" height="26" fill="#102a52"/><text x="32" y="63" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Loyalty Through Earned Value</text><text x="32" y="107" fill="#f0d58d" font-size="21" font-family="Arial,sans-serif">Repeat choice is not proof of satisfaction</text><line x1="22" x2="858" y1="140" y2="140" stroke="#dfb556" stroke-width="4"/><g font-family="Arial,sans-serif"><rect x="29" y="157" width="825" height="101" rx="14" stroke="#ceddec" fill="#eef4fb"/><circle cx="78" cy="207" r="28" fill="#e4ba57"/><text x="78" y="218" text-anchor="middle" fill="#102a52" font-size="29" font-weight="bold">1</text><text x="132" y="197" fill="#102a52" font-size="25" font-weight="bold">Identify benefit</text><text x="132" y="232" fill="#365778" font-size="21">Find useful reasons to return</text></g><g font-family="Arial,sans-serif"><rect x="29" y="271" width="825" height="101" rx="14" stroke="#ceddec" fill="#ffffff"/><circle cx="78" cy="321" r="28" fill="#e4ba57"/><text x="78" y="332" text-anchor="middle" fill="#102a52" font-size="29" font-weight="bold">2</text><text x="132" y="311" fill="#102a52" font-size="25" font-weight="bold">Reduce friction</text><text x="132" y="346" fill="#365778" font-size="21">Correct avoidable effort</text></g><g font-family="Arial,sans-serif"><rect x="29" y="385" width="825" height="101" rx="14" stroke="#ceddec" fill="#eef4fb"/><circle cx="78" cy="435" r="28" fill="#e4ba57"/><text x="78" y="446" text-anchor="middle" fill="#102a52" font-size="29" font-weight="bold">3</text><text x="132" y="425" fill="#102a52" font-size="25" font-weight="bold">Offer choice</text><text x="132" y="460" fill="#365778" font-size="21">Give truthful available options</text></g><g font-family="Arial,sans-serif"><rect x="29" y="499" width="825" height="101" rx="14" stroke="#ceddec" fill="#ffffff"/><circle cx="78" cy="549" r="28" fill="#e4ba57"/><text x="78" y="560" text-anchor="middle" fill="#102a52" font-size="29" font-weight="bold">4</text><text x="132" y="539" fill="#102a52" font-size="25" font-weight="bold">Respect exit</text><text x="132" y="574" fill="#365778" font-size="21">Never obstruct cancellation</text></g><g font-family="Arial,sans-serif"><rect x="29" y="613" width="825" height="101" rx="14" stroke="#ceddec" fill="#eef4fb"/><circle cx="78" cy="663" r="28" fill="#e4ba57"/><text x="78" y="674" text-anchor="middle" fill="#102a52" font-size="29" font-weight="bold">5</text><text x="132" y="653" fill="#102a52" font-size="25" font-weight="bold">Learn</text><text x="132" y="688" fill="#365778" font-size="21">Use real outcomes and feedback</text></g><text x="32" y="744" font-family="Arial,sans-serif" font-size="16" fill="#536d88">Funda Online Academy · Customer Service · Module 4 · Lesson 4.5</text></svg>