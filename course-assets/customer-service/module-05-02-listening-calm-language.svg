<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title description"><title id="title">Listen and Clarify Effectively</title><desc id="description">Calm language without false agreement. Five learning phases: Attend, Reflect, Clarify, Check, Respond.</desc><rect width="900" height="760" rx="22" fill="#eaf1fa"/><rect x="12" y="12" width="876" height="736" rx="18" fill="#fff"/><path d="M12 34 Q12 12 34 12 H866 Q888 12 888 34 V137 H12 Z" fill="#132e55"/><text x="35" y="64" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Listen and Clarify Effectively</text><text x="35" y="108" fill="#f6db9a" font-family="Arial,sans-serif" font-size="20">Calm language without false agreement</text><path d="M44 143 H856" stroke="#e5c06e" stroke-width="4"/><g font-family="Arial,sans-serif"><rect x="34" y="155" width="832" height="100" rx="14" fill="#edf3fa" stroke="#bed1e6"/><circle cx="82" cy="205" r="28" fill="#d4aa52"/><text x="82" y="216" text-anchor="middle" font-size="29" font-weight="bold" fill="#142e55">1</text><text x="131" y="194" fill="#102f53" font-size="25" font-weight="bold">Attend</text><text x="131" y="231" fill="#355575" font-size="21">Give respectful space</text></g><g font-family="Arial,sans-serif"><rect x="34" y="265" width="832" height="100" rx="14" fill="#ffffff" stroke="#bed1e6"/><circle cx="82" cy="315" r="28" fill="#d4aa52"/><text x="82" y="326" text-anchor="middle" font-size="29" font-weight="bold" fill="#142e55">2</text><text x="131" y="304" fill="#102f53" font-size="25" font-weight="bold">Reflect</text><text x="131" y="341" fill="#355575" font-size="21">Name the practical issue</text></g><g font-family="Arial,sans-serif"><rect x="34" y="375" width="832" height="100" rx="14" fill="#edf3fa" stroke="#bed1e6"/><circle cx="82" cy="425" r="28" fill="#d4aa52"/><text x="82" y="436" text-anchor="middle" font-size="29" font-weight="bold" fill="#142e55">3</text><text x="131" y="