<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400" role="img" aria-label="Funda Online Academy Commercial Cleaning Module 2 study maps">
<defs><style>.bg{fill:#f7f9fc}.head{fill:#13233f}.box{fill:#fff;stroke:#5d6b82;stroke-width:2}.accent{fill:#e8f1ff}.title{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:700 22px Arial,sans-serif;fill:#13233f}.body{font:18px Arial,sans-serif;fill:#24334d}.small{font:16px Arial,sans-serif;fill:#44536a}.arrow{stroke:#5d6b82;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5d6b82"/></marker><view id="lesson-01" viewBox="0 0 1200 675"/><view id="lesson-02" viewBox="0 675 1200 675"/><view id="lesson-03" viewBox="0 1350 1200 675"/><view id="lesson-04" viewBox="0 2025 1200 675"/><view id="lesson-05" viewBox="0 2700 1200 675"/><view id="lesson-06" viewBox="0 3375 1200 675"/><view id="lesson-07" viewBox="0 4050 1200 675"/><view id="lesson-08" viewBox="0 4725 1200 675"/></defs>
<g transform="translate(0,0)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">2.1 Dry, Damp, Wet and Spray Methods</text><text class="small" x="55" y="142">Select the least disruptive effective method for the soil and surface.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Assess soil</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Assess surface</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Select method</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Dry + verify</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Method rule</text><text class="body" x="85" y="488">Control moisture and overspray, recover loosened soil and restore safe access before handover.</text></g>
<g transform="translate(0,675)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">2.2 Systematic Cleaning Sequence</text><text class="small" x="55" y="142">Use sequence to reduce misses, rework and cross-contamination.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">High to low</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Clean to dirty</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Planned direction</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Final check</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Sequence rule</text><text class="body" x="85" y="488">Colour coding supports a site system but never replaces labels, training or tool-change points.</text></g>
<g transform="translate(0,1350)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">2.3 High-Touch and Cross-Contamination Control</text><text class="small" x="55" y="142">Map touchpoints and control the movement of tools, gloves and contamination.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Map touchpoints</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Clean</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Change tools</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Verify</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Contamination rule</text><text class="body" x="85" y="488">Disinfection is additional where required; gloves do not replace hand hygiene or controlled tool changes.</text></g>
<g transform="translate(0,2025)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">2.4 Dust Control and Hard-Floor Care</text><text class="small" x="55" y="142">Remove loose soil before wet work and manage solution, access and drying.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Remove dry soil</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Wet clean</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Recover</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Dry + inspect</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Floor rule</text><text class="body" x="85" y="488">Dirty solution and contaminated mop heads are changed; residue is investigated rather than hidden with more product.</text></g>
<g transform="translate(0,2700)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">2.5 Dwell and Contact Time</text><text class="small" x="55" y="142">Let chemistry work for the specified time without exceeding product limits.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Correct dilution</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Apply</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Allow time</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Recover / rinse</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Timing rule</text><text class="body" x="85" y="488">Dwell time supports soil removal; disinfectant contact time is a product-specific antimicrobial condition.</text></g>
<g transform="translate(0,3375)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">2.6 Frequencies and Workloading</text><text class="small" x="55" y="142">Build a schedule that reflects risk, use, task time and real operational capacity.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Frequency</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Task time</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Travel + setup</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Review actuals</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Planning rule</text><text class="body" x="85" y="488">A realistic schedule includes movement, setup, interruptions, breaks and reactive work—not only visible cleaning minutes.</text></g>
<g transform="translate(0,4050)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">2.7 Self-Inspection and Handover</text><text class="small" x="55" y="142">Check, correct, record exceptions and hand over the real status.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Inspect</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Correct</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Verify</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Handover</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Sign-off rule</text><text class="body" x="85" y="488">Do not mark inaccessible or incomplete work as complete; critical defects override a good overall appearance.</text></g>
<g transform="translate(0,4725)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">2.8 Integrated Office Cleaning Simulation</text><text class="small" x="55" y="142">Combine route, methods, timing, quality and exceptions in one practice workflow.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Plan</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Deliver</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Inspect</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Improve</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Simulation rule</text><text class="body" x="85" y="488">Safe first-pass quality and truthful exceptions matter more than a fast stopwatch result.</text></g>
</svg>