<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="4800" viewBox="0 0 1200 4800" role="img" aria-label="Funda Online Academy Commercial Cleaning Module 6 restroom and hygiene study maps">
<defs><style>.bg{fill:#f7f9fc}.head{fill:#13233f}.box{fill:#fff;stroke:#5d6b82;stroke-width:2}.accent{fill:#e8f1ff}.title{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:700 21px Arial,sans-serif;fill:#13233f}.body{font:18px Arial,sans-serif;fill:#24334d}.small{font:16px Arial,sans-serif;fill:#44536a}.arrow{stroke:#5d6b82;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5d6b82"/></marker><view id="lesson-01" viewBox="0 0 1200 600"/><view id="lesson-02" viewBox="0 600 1200 600"/><view id="lesson-03" viewBox="0 1200 1200 600"/><view id="lesson-04" viewBox="0 1800 1200 600"/><view id="lesson-05" viewBox="0 2400 1200 600"/><view id="lesson-06" viewBox="0 3000 1200 600"/><view id="lesson-07" viewBox="0 3600 1200 600"/><view id="lesson-08" viewBox="0 4200 1200 600"/></defs>
<g transform="translate(0,0)"><rect class="bg" width="1200" height="600"/><rect class="head" width="1200" height="105"/><text class="title" x="55" y="66">6.1 Restroom Hygiene Science</text><text class="small" x="55" y="140">Map contamination routes before choosing cleaning and disinfection controls.</text><g transform="translate(55,190)"><rect class="box" width="200" height="130" rx="18"/><text class="sub" x="20" y="42">High-touch</text><text class="body" x="20" y="78">Latches, taps,</text><text class="body" x="20" y="104">flush controls</text></g><g transform="translate(305,190)"><rect class="box" width="200" height="130" rx="18"/><text class="sub" x="20" y="42">High-soil</text><text class="body" x="20" y="78">Bowls, urinals,</text><text class="body" x="20" y="104">floors, bins</text></g><g transform="translate(555,190)"><rect class="box" width="200" height="130" rx="18"/><text class="sub" x="20" y="42">Break transfer</text><text class="body" x="20" y="78">Tool/glove change,</text><text class="body" x="20" y="104">hand hygiene</text></g><g transform="translate(805,190)"><rect class="box" width="200" height="130" rx="18"/><text class="sub" x="20" y="42">Verify</text><text class="body" x="20" y="78">Clean, functional,</text><text class="body" x="20" y="104">safe to reopen</text></g><path class="arrow" d="M255 255 H298"/><path class="arrow" d="M505 255 H548"/><path class="arrow" d="M755 255 H798"/><rect class="accent" x="55" y="370" width="1090" height="145" rx="18"/><text class="sub" x="85" y="414">Key rule</text><text class="body" x="85" y="452">Cleaning removes soil; disinfection is an additional validated step where required.</text><text class="body" x="85" y="483">Gloves do not replace hand hygiene and routine restroom cleaning is not sterilisation.</text></g>
<g transform="translate(0,600)"><rect class="bg" width="1200" height="600"/><rect class="head" width="1200" height="105"/><text class="title" x="55" y="66">6.2 Systematic Fixture Cleaning</text><text class="small" x="55" y="140">Prepare, control access, separate clean and dirty tools, then finish with floors.</text><g transform="translate(55,190)"><rect class="box" width="190" height="130" rx="18"/><text class="sub" x="18" y="42">Prepare</text><text class="body" x="18" y="78">PPE, signs, tools,</text><text class="body" x="18" y="104">approved chemicals</text></g><g transform="translate(285,190)"><rect class="box" width="190" height="130" rx="18"/><text class="sub" x="18" y="42">Cleaner tasks</text><text class="body" x="18" y="78">Mirrors, basins,</text><text class="body" x="18" y="104">dispensers</text></g><g transform="translate(515,190)"><rect class="box" width="190" height="130" rx="18"/><text class="sub" x="18" y="42">Dirtier tasks</text><text class="body" x="18" y="78">Toilets, urinals,</text><text class="body" x="18" y="104">waste</text></g><g transform="translate(745,190)"><rect class="box" width="190" height="130" rx="18"/><text class="sub" x="18" y="42">Floor</text><text class="body" x="18" y="78">Work toward exit,</text><text class="body" x="18" y="104">control until dry</text></g><g transform="translate(975,190)"><rect class="box" width="170" height="130" rx="18"/><text class="sub" x="16" y="42">Inspect</text><text class="body" x="16" y="78">Replenish, report,</text><text class="body" x="16" y="104">reopen safely</text></g><path class="arrow" d="M245 255 H278"/><path class="arrow" d="M475 255 H508"/><path class="arrow" d="M705 255 H738"/><path class="arrow" d="M935 255 H968"/></g>
<g transform="translate(0,1200)"><rect class="bg" width="1200" height="600"/><rect class="head" width="1200" height="105"/><text class="title" x="55" y="66">6.3 Consumables and Dispenser Control</text><text class="small" x="55" y="140">Availability plus hygienic refilling and stock planning keep the washroom functional.</text><g transform="translate(55,190)"><rect class="box" width="210" height="130" rx="18"/><text class="sub" x="20" y="42">Inspect</text><text class="body" x="20" y="78">Soap, tissue, towels,</text><text class="body" x="20" y="104">dryer function</text></g><g transform="translate(315,190)"><rect class="box" width="210" height="130" rx="18"/><text class="sub" x="20" y="42">Refill safely</text><text class="body" x="20" y="78">Clean-hand break,</text><text class="body" x="20" y="104">no product mixing</text></g><g transform="translate(575,190)"><rect class="box" width="210" height="130" rx="18"/><text class="sub" x="20" y="42">Track use</text><text class="body" x="20" y="78">Daily usage, faults,</text><text class="body" x="20" y="104">lead time</text></g><g transform="translate(835,190)"><rect class="box" width="210" height="130" rx="18"/><text class="sub" x="20" y="42">Reorder</text><text class="body" x="20" y="78">Lead-time demand +</text><text class="body" x="20" y="104">safety stock</text></g><path class="arrow" d="M265 255 H308"/><path class="arrow" d="M525 255 H568"/><path class="arrow" d="M785 255 H828"/><rect class="accent" x="55" y="370" width="1090" height="145" rx="18"/><text class="sub" x="85" y="414">Example</text><text class="body" x="85" y="452">3 cartridges/day × 4-day lead time + 6 safety stock = 18-cartridge reorder point.</text></g>
<g transform="translate(0,1800)"><rect class="bg" width="1200" height="600"/><rect class="head" width="1200" height="105"/><text class="title" x="55" y="66">6.4 Odour Control and Ventilation</text><text class="small" x="55" y="140">Find and remove the source; fragrance is not a substitute for cleaning or repair.</text><g transform="translate(55,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Locate source</text><text class="body" x="20" y="78">Urinal, drain, bin,</text><text class="body" x="20" y="104">wall, vent</text></g><g transform="translate(300,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Clean</text><text class="body" x="20" y="78">Remove residue,</text><text class="body" x="20" y="104">waste, moisture</text></g><g transform="translate(545,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Check systems</text><text class="body" x="20" y="78">Drain/trap, leaks,</text><text class="body" x="20" y="104">ventilation</text></g><g transform="translate(790,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Record + escalate</text><text class="body" x="20" y="78">Pattern, location,</text><text class="body" x="20" y="104">maintenance ticket</text></g><path class="arrow" d="M260 255 H293"/><path class="arrow" d="M505 255 H538"/><path class="arrow" d="M750 255 H783"/></g>
<g transform="translate(0,2400)"><rect class="bg" width="1200" height="600"/><rect class="head" width="1200" height="105"/><text class="title" x="55" y="66">6.5 Sanitary Disposal and Hygiene Waste</text><text class="small" x="55" y="140">Service authorised units without direct contact; unusual hazards move to incident procedures.</text><g transform="translate(55,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Identify system</text><text class="body" x="20" y="78">Liner unit or sealed</text><text class="body" x="20" y="104">contractor exchange</text></g><g transform="translate(300,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Contain</text><text class="body" x="20" y="78">No compression,</text><text class="body" x="20" y="104">protect privacy</text></g><g transform="translate(545,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Clean + replace</text><text class="body" x="20" y="78">Approved liner/unit,</text><text class="body" x="20" y="104">hand hygiene</text></g><g transform="translate(790,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Escalate hazards</text><text class="body" x="20" y="78">Sharps, leaks,</text><text class="body" x="20" y="104">exposure</text></g><path class="arrow" d="M260 255 H293"/><path class="arrow" d="M505 255 H538"/><path class="arrow" d="M750 255 H783"/></g>
<g transform="translate(0,3000)"><rect class="bg" width="1200" height="600"/><rect class="head" width="1200" height="105"/><text class="title" x="55" y="66">6.6 Hand Hygiene Support</text><text class="small" x="55" y="140">A functional washroom needs water, soap, drying and clean touchpoints.</text><g transform="translate(55,190)"><rect class="box" width="200" height="130" rx="18"/><text class="sub" x="20" y="42">Water + basin</text><text class="body" x="20" y="78">Clean, draining,</text><text class="body" x="20" y="104">usable</text></g><g transform="translate(295,190)"><rect class="box" width="200" height="130" rx="18"/><text class="sub" x="20" y="42">Soap</text><text class="body" x="20" y="78">Available, working,</text><text class="body" x="20" y="104">refilled cleanly</text></g><g transform="translate(535,190)"><rect class="box" width="200" height="130" rx="18"/><text class="sub" x="20" y="42">Drying</text><text class="body" x="20" y="78">Towels or dryer</text><text class="body" x="20" y="104">functional</text></g><g transform="translate(775,190)"><rect class="box" width="200" height="130" rx="18"/><text class="sub" x="20" y="42">Exit touchpoints</text><text class="body" x="20" y="78">Clean handles,</text><text class="body" x="20" y="104">no recontamination</text></g><path class="arrow" d="M255 255 H288"/><path class="arrow" d="M495 255 H528"/><path class="arrow" d="M735 255 H768"/><rect class="accent" x="55" y="370" width="1090" height="145" rx="18"/><text class="body" x="85" y="430">Cleaner contamination breaks: toilet/waste work → glove change + hand hygiene → clean refill/touchpoint work.</text></g>
<g transform="translate(0,3600)"><rect class="bg" width="1200" height="600"/><rect class="head" width="1200" height="105"/><text class="title" x="55" y="66">6.7 Restroom Quality and Service Recovery</text><text class="small" x="55" y="140">Score defined criteria, then apply critical-defect rules before declaring a pass.</text><g transform="translate(55,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Inspect</text><text class="body" x="20" y="78">Hygiene, stock,</text><text class="body" x="20" y="104">function, safety</text></g><g transform="translate(300,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Score</text><text class="body" x="20" y="78">Pass items ÷ total</text><text class="body" x="20" y="104">× 100</text></g><g transform="translate(545,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Critical check</text><text class="body" x="20" y="78">Sewage, electrical,</text><text class="body" x="20" y="104">major slip risk</text></g><g transform="translate(790,190)"><rect class="box" width="205" height="130" rx="18"/><text class="sub" x="20" y="42">Recover + recheck</text><text class="body" x="20" y="78">Correct, assign owner,</text><text class="body" x="20" y="104">reinspect</text></g><path class="arrow" d="M260 255 H293"/><path class="arrow" d="M505 255 H538"/><path class="arrow" d="M750 255 H783"/></g>
<g transform="translate(0,4200)"><rect class="bg" width="1200" height="600"/><rect class="head" width="1200" height="105"/><text class="title" x="55" y="66">6.8 Restroom Incident Response</text><text class="small" x="55" y="140">Stop use early; cleaning staff control immediate risk but do not improvise plumbing or electrical repair.</text><g transform="translate(55,190)"><rect class="box" width="190" height="130" rx="18"/><text class="sub" x="18" y="42">Stop use</text><text class="body" x="18" y="78">Close fixture/area,</text><text class="body" x="18" y="104">warn users</text></g><g transform="translate(285,190)"><rect class="box" width="190" height="130" rx="18"/><text class="sub" x="18" y="42">Classify risk</text><text class="body" x="18" y="78">Leak, sewage,</text><text class="body" x="18" y="104">chemical, electrical</text></g><g transform="translate(515,190)"><rect class="box" width="190" height="130" rx="18"/><text class="sub" x="18" y="42">Act in scope</text><text class="body" x="18" y="78">Contain only if</text><text class="body" x="18" y="104">trained and safe</text></g><g transform="translate(745,190)"><rect class="box" width="190" height="130" rx="18"/><text class="sub" x="18" y="42">Escalate</text><text class="body" x="18" y="78">Plumber, electrical,</text><text class="body" x="18" y="104">facilities/medical</text></g><g transform="translate(975,190)"><rect class="box" width="170" height="130" rx="18"/><text class="sub" x="16" y="42">Reopen</text><text class="body" x="16" y="78">Source controlled,</text><text class="body" x="16" y="104">clean + safe</text></g><path class="arrow" d="M245 255 H278"/><path class="arrow" d="M475 255 H508"/><path class="arrow" d="M705 255 H738"/><path class="arrow" d="M935 255 H968"/></g>
</svg>