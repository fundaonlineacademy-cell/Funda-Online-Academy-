<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400" role="img" aria-label="Funda Online Academy Commercial Cleaning Module 1 study maps">
<defs><style>.bg{fill:#f7f9fc}.head{fill:#13233f}.box{fill:#fff;stroke:#5d6b82;stroke-width:2}.accent{fill:#e8f1ff}.title{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:700 22px Arial,sans-serif;fill:#13233f}.body{font:18px Arial,sans-serif;fill:#24334d}.small{font:16px Arial,sans-serif;fill:#44536a}.arrow{stroke:#5d6b82;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5d6b82"/></marker><view id="lesson-01" viewBox="0 0 1200 675"/><view id="lesson-02" viewBox="0 675 1200 675"/><view id="lesson-03" viewBox="0 1350 1200 675"/><view id="lesson-04" viewBox="0 2025 1200 675"/><view id="lesson-05" viewBox="0 2700 1200 675"/><view id="lesson-06" viewBox="0 3375 1200 675"/><view id="lesson-07" viewBox="0 4050 1200 675"/><view id="lesson-08" viewBox="0 4725 1200 675"/></defs>
<g transform="translate(0,0)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">1.1 Professional Commercial Cleaning</text><text class="small" x="55" y="142">See how scope, people, standards and evidence form one professional service.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Client need</text><text class="body" x="24" y="82">Required outcome</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Scope</text><text class="body" x="24" y="82">Tasks + limits</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Delivery</text><text class="body" x="24" y="82">People + methods</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Evidence</text><text class="body" x="24" y="82">Quality + records</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Professional rule</text><text class="body" x="85" y="488">Cleaning is a controlled service: agreed outcomes, safe methods, verification and traceable follow-up.</text></g>
<g transform="translate(0,675)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">1.2 Roles, Ethics and Client Relationships</text><text class="small" x="55" y="142">Keep responsibility, authority and ethical conduct clear.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Role</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Authority</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Conduct</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Escalate</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Trust rule</text><text class="body" x="85" y="488">Protect client property and information, report mistakes early and do not promise beyond your authority.</text></g>
<g transform="translate(0,1350)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">1.3 Cleaning Science</text><text class="small" x="55" y="142">Match soil, surface and controlled cleaning factors.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Identify soil</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Identify surface</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Choose factors</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Verify result</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Science rule</text><text class="body" x="85" y="488">More chemical, heat or force is not automatically better; compatibility and controlled removal come first.</text></g>
<g transform="translate(0,2025)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">1.4 Infection Prevention</text><text class="small" x="55" y="142">Interrupt contamination routes without overstating sterilisation.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Contamination</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Cleaning</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Disinfection</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Hand hygiene</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Control rule</text><text class="body" x="85" y="488">Clean first where required, use product-specific contact conditions and prevent tools or gloves spreading contamination.</text></g>
<g transform="translate(0,2700)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">1.5 Legal and Contractual Foundations</text><text class="small" x="55" y="142">Understand how law, SOPs and SLAs work together.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Law</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Site controls</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">SOP</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">SLA</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Boundary rule</text><text class="body" x="85" y="488">A client requirement never makes an unsafe or unlawful method acceptable.</text></g>
<g transform="translate(0,3375)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">1.6 Professional Conduct and Work Discipline</text><text class="small" x="55" y="142">Turn readiness and truthful records into dependable service.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Arrive ready</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Work safely</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Record truthfully</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Hand over</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Discipline rule</text><text class="body" x="85" y="488">Punctuality, hygiene, controlled access and honest completion records support both trust and safety.</text></g>
<g transform="translate(0,4050)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">1.7 Communication and Complaint Handling</text><text class="small" x="55" y="142">Move from message to confirmed action and service recovery.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Listen</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Confirm</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Act / escalate</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Close loop</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Communication rule</text><text class="body" x="85" y="488">Separate facts from assumptions and never promise a result outside your authority.</text></g>
<g transform="translate(0,4725)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">1.8 Quality, Inspection and KPIs</text><text class="small" x="55" y="142">Measure the service without letting percentages hide critical defects.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Define standard</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Inspect</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Correct</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Trend</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Quality rule</text><text class="body" x="85" y="488">Scores support decisions only when criteria, evidence and critical-defect rules are clear.</text></g>
</svg>