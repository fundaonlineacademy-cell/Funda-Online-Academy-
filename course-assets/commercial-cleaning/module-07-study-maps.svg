<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400" role="img" aria-label="Funda Online Academy Commercial Cleaning Module 7 study maps">
<defs>
<style>.bg{fill:#f7f9fc}.head{fill:#13233f}.box{fill:#fff;stroke:#5d6b82;stroke-width:2}.accent{fill:#e8f1ff}.title{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:700 22px Arial,sans-serif;fill:#13233f}.body{font:18px Arial,sans-serif;fill:#24334d}.small{font:16px Arial,sans-serif;fill:#44536a}.arrow{stroke:#5d6b82;stroke-width:4;fill:none;marker-end:url(#a)}</style>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5d6b82"/></marker>
<view id="lesson-01" viewBox="0 0 1200 675"/><view id="lesson-02" viewBox="0 675 1200 675"/><view id="lesson-03" viewBox="0 1350 1200 675"/><view id="lesson-04" viewBox="0 2025 1200 675"/><view id="lesson-05" viewBox="0 2700 1200 675"/><view id="lesson-06" viewBox="0 3375 1200 675"/><view id="lesson-07" viewBox="0 4050 1200 675"/><view id="lesson-08" viewBox="0 4725 1200 675"/>
</defs>
<g transform="translate(0,0)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">7.1 Waste Classification</text><text class="small" x="55" y="142">Classify before handling; isolate what does not fit the normal route.</text><g transform="translate(55,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Identify source</text><text class="body" x="22" y="82">Where did it come</text><text class="body" x="22" y="110">from?</text></g><g transform="translate(295,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Match stream</text><text class="body" x="22" y="82">General / recycle /</text><text class="body" x="22" y="110">controlled</text></g><g transform="translate(535,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Check exception</text><text class="body" x="22" y="82">Chemical, battery,</text><text class="body" x="22" y="110">sharps, unknown</text></g><g transform="translate(775,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Route + record</text><text class="body" x="22" y="82">Approved pathway,</text><text class="body" x="22" y="110">no guessing</text></g><path class="arrow" d="M255 265 H288"/><path class="arrow" d="M495 265 H528"/><path class="arrow" d="M735 265 H768"/><rect class="accent" x="55" y="395" width="1090" height="180" rx="18"/><text class="sub" x="85" y="438">Key boundary</text><text class="body" x="85" y="480">Unknown waste is isolated and escalated. SANS 10248 belongs to healthcare-risk waste,</text><text class="body" x="85" y="515">not every ordinary commercial bin system.</text></g>
<g transform="translate(0,675)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">7.2 Segregation and Bin Systems</text><text class="small" x="55" y="142">Preserve separation from the point of disposal through contractor handover.</text><g transform="translate(55,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Clear label</text><text class="body" x="22" y="82">Words + examples</text></g><g transform="translate(295,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Right container</text><text class="body" x="22" y="82">Liner, lid, fill limit</text></g><g transform="translate(535,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Check quality</text><text class="body" x="22" y="82">Overflow +</text><text class="body" x="22" y="110">contamination</text></g><g transform="translate(775,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Keep separate</text><text class="body" x="22" y="82">Front to back</text></g><path class="arrow" d="M255 265 H288"/><path class="arrow" d="M495 265 H528"/><path class="arrow" d="M735 265 H768"/><rect class="accent" x="55" y="395" width="1090" height="180" rx="18"/><text class="sub" x="85" y="438">Measure performance</text><text class="body" x="85" y="480">Contamination rate = incorrect items ÷ inspected items × 100.</text><text class="body" x="85" y="515">Colour supports the system; site labels define it.</text></g>
<g transform="translate(0,1350)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">7.3 Collection and Internal Transfer</text><text class="small" x="55" y="142">Move waste without compression, leakage, mixing or unsafe loads.</text><g transform="translate(55,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Inspect bag</text><text class="body" x="22" y="82">Leak, sharp, weight</text></g><g transform="translate(295,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Close safely</text><text class="body" x="22" y="82">No compression</text></g><g transform="translate(535,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Use trolley</text><text class="body" x="22" y="82">Stable, rated, clean</text></g><g transform="translate(775,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Store + handover</text><text class="body" x="22" y="82">Approved area</text></g><path class="arrow" d="M255 265 H288"/><path class="arrow" d="M495 265 H528"/><path class="arrow" d="M735 265 H768"/><rect class="accent" x="55" y="395" width="1090" height="180" rx="18"/><text class="sub" x="85" y="438">Route control</text><text class="body" x="85" y="480">Preserve segregation, avoid public/food routes where possible, and keep regulated road transport</text><text class="body" x="85" y="515">with authorised waste logistics.</text></g>
<g transform="translate(0,2025)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">7.4 Sharps and Biological Exposure</text><text class="small" x="55" y="142">Prevent puncture and splash exposure; do not hand-sort.</text><g transform="translate(55,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Stop + isolate</text><text class="body" x="22" y="82">Protect others</text></g><g transform="translate(295,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">No hand contact</text><text class="body" x="22" y="82">Use trained process</text></g><g transform="translate(535,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Contain correctly</text><text class="body" x="22" y="82">Sharps / spill route</text></g><g transform="translate(775,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Exposure response</text><text class="body" x="22" y="82">First aid + report</text></g><path class="arrow" d="M255 265 H288"/><path class="arrow" d="M495 265 H528"/><path class="arrow" d="M735 265 H768"/><rect class="accent" x="55" y="395" width="1090" height="180" rx="18"/><text class="sub" x="85" y="438">Key boundary</text><text class="body" x="85" y="480">Needlesticks and splash exposures require prompt occupational-health follow-up.</text><text class="body" x="85" y="515">Reading the lesson does not authorise specialist sharps or biohazard work.</text></g>
<g transform="translate(0,2700)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">7.5 Waste-Related OHS Hazards</text><text class="small" x="55" y="142">Control slips, trips, cuts, load handling and machinery risks at source.</text><g transform="translate(55,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Find hazard</text><text class="body" x="22" y="82">Leak, clutter, load</text></g><g transform="translate(295,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Higher control</text><text class="body" x="22" y="82">Repair, redesign,</text><text class="body" x="22" y="110">separate</text></g><g transform="translate(535,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Safe handling</text><text class="body" x="22" y="82">Trolley + route</text></g><g transform="translate(775,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Verify + report</text><text class="body" x="22" y="82">Near miss / defect</text></g><path class="arrow" d="M255 265 H288"/><path class="arrow" d="M495 265 H528"/><path class="arrow" d="M735 265 H768"/><rect class="accent" x="55" y="395" width="1090" height="180" rx="18"/><text class="sub" x="85" y="438">Do not enter machinery</text><text class="body" x="85" y="480">Compactors and balers require trained operation and authorised isolation for faults.</text><text class="body" x="85" y="515">Signs and PPE do not replace fixing leaks, obstructions or damaged equipment.</text></g>
<g transform="translate(0,3375)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">7.6 Emergency Response</text><text class="small" x="55" y="142">Life safety before cleanup.</text><g transform="translate(55,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Recognise</text><text class="body" x="22" y="82">Fire, fumes, injury</text></g><g transform="translate(295,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Alarm</text><text class="body" x="22" y="82">Protect people</text></g><g transform="translate(535,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Evacuate/isolate</text><text class="body" x="22" y="82">Stay in competence</text></g><g transform="translate(775,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Handover</text><text class="body" x="22" y="82">Facts to responders</text></g><path class="arrow" d="M255 265 H288"/><path class="arrow" d="M495 265 H528"/><path class="arrow" d="M735 265 H768"/><rect class="accent" x="55" y="395" width="1090" height="180" rx="18"/><text class="sub" x="85" y="438">No improvisation</text><text class="body" x="85" y="480">Unknown or fuming chemical spills are escalated. Never mix chemicals to neutralise a spill.</text><text class="body" x="85" y="515">Re-enter only after authorised clearance.</text></g>
<g transform="translate(0,4050)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">7.7 Incident and Near-Miss Reporting</text><text class="small" x="55" y="142">Turn events into prevention evidence.</text><g transform="translate(55,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Make safe</text><text class="body" x="22" y="82">First aid first</text></g><g transform="translate(295,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Report</text><text class="body" x="22" y="82">Promptly + factual</text></g><g transform="translate(535,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Investigate</text><text class="body" x="22" y="82">Immediate + root</text></g><g transform="translate(775,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Correct + verify</text><text class="body" x="22" y="82">Close the loop</text></g><path class="arrow" d="M255 265 H288"/><path class="arrow" d="M495 265 H528"/><path class="arrow" d="M735 265 H768"/><rect class="accent" x="55" y="395" width="1090" height="180" rx="18"/><text class="sub" x="85" y="438">COIDA boundary</text><text class="body" x="85" y="480">Workers report promptly; the employer manages statutory Compensation Fund reporting.</text><text class="body" x="85" y="515">Near misses matter even when nobody is injured.</text></g>
<g transform="translate(0,4725)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">7.8 Waste Reduction and Recycling Performance</text><text class="small" x="55" y="142">Prevent first, recover suitable material, measure honestly.</text><g transform="translate(55,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Prevent</text><text class="body" x="22" y="82">Avoid waste</text></g><g transform="translate(295,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Reuse</text><text class="body" x="22" y="82">Where safe</text></g><g transform="translate(535,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Recover</text><text class="body" x="22" y="82">Recycle / organics</text></g><g transform="translate(775,190)"><rect class="box" width="200" height="150" rx="18"/><text class="sub" x="22" y="45">Measure</text><text class="body" x="22" y="82">Diversion + quality</text></g><path class="arrow" d="M255 265 H288"/><path class="arrow" d="M495 265 H528"/><path class="arrow" d="M735 265 H768"/><rect class="accent" x="55" y="395" width="1090" height="180" rx="18"/><text class="sub" x="85" y="438">Evidence-based claims</text><text class="body" x="85" y="480">Diversion rate = verified diverted material ÷ total measured waste × 100.</text><text class="body" x="85" y="515">Do not sacrifice hygiene, controlled waste routes or safety for a headline percentage.</text></g>
</svg>