<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400" role="img" aria-label="Funda Online Academy Commercial Cleaning Module 4 study maps">
<defs><style>.bg{fill:#f7f9fc}.head{fill:#13233f}.box{fill:#fff;stroke:#5d6b82;stroke-width:2}.accent{fill:#e8f1ff}.title{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:700 22px Arial,sans-serif;fill:#13233f}.body{font:18px Arial,sans-serif;fill:#24334d}.small{font:16px Arial,sans-serif;fill:#44536a}.arrow{stroke:#5d6b82;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5d6b82"/></marker><view id="lesson-01" viewBox="0 0 1200 675"/><view id="lesson-02" viewBox="0 675 1200 675"/><view id="lesson-03" viewBox="0 1350 1200 675"/><view id="lesson-04" viewBox="0 2025 1200 675"/><view id="lesson-05" viewBox="0 2700 1200 675"/><view id="lesson-06" viewBox="0 3375 1200 675"/><view id="lesson-07" viewBox="0 4050 1200 675"/><view id="lesson-08" viewBox="0 4725 1200 675"/></defs>
<g transform="translate(0,0)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">4.1 Manual Cleaning Tools</text><text class="small" x="55" y="142">Match the tool to soil, surface, contamination risk and worker comfort.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Select</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Inspect</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Use + segregate</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Clean + store</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Tool rule</text><text class="body" x="85" y="488">A familiar tool can still spread contamination or cause strain if it is poorly selected, worn or used across incompatible zones.</text></g>
<g transform="translate(0,675)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">4.2 Mechanical Cleaning Equipment</text><text class="small" x="55" y="142">Choose the machine, accessory and operating controls as one system.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Task + surface</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Machine</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Pad / brush</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Recover + inspect</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Machine rule</text><text class="body" x="85" y="488">Training, manufacturer instructions, pre-start checks and compatible accessories control safe machine use.</text></g>
<g transform="translate(0,1350)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">4.3 Pre-Start Checks and Fault Reporting</text><text class="small" x="55" y="142">Detect unsafe defects before work and keep repair boundaries clear.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Inspect</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Classify defect</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Isolate / maintain</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Report + verify</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Fault rule</text><text class="body" x="85" y="488">Unsafe equipment is removed from service; operator maintenance never becomes unauthorised technical repair.</text></g>
<g transform="translate(0,2025)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">4.4 Personal Protective Equipment</text><text class="small" x="55" y="142">Select PPE from the hazard, exposure route, fit and task.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Assess hazard</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Control higher up</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Select + fit</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Remove safely</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">PPE rule</text><text class="body" x="85" y="488">PPE is important but it is not the first or only control; fit, compatibility and safe doffing matter.</text></g>
<g transform="translate(0,2700)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">4.5 Electrical Safety for Cleaning Equipment</text><text class="small" x="55" y="142">Control cables, plugs, wet areas and unexpected power restoration.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Inspect supply</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Route cable</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Control moisture</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Isolate faults</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Electrical rule</text><text class="body" x="85" y="488">Damaged leads, wet connections and unexplained trips are stop-use conditions for the cleaner, not repair opportunities.</text></g>
<g transform="translate(0,3375)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">4.6 Ergonomics and Musculoskeletal Risk</text><text class="small" x="55" y="142">Design the task to reduce force, repetition, awkward posture and fatigue.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Identify exposure</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Redesign task</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Use aids / adjust</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Monitor</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Ergonomics rule</text><text class="body" x="85" y="488">Task design and mechanical aids are stronger controls than relying only on lifting technique.</text></g>
<g transform="translate(0,4050)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">4.7 Equipment and Consumables Control</text><text class="small" x="55" y="142">Keep safe resources available through identity, condition and stock controls.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Count / register</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Issue / return</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Reorder</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Investigate variance</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Stock rule</text><text class="body" x="85" y="488">Shortages are reported early so workers are not pushed into unsafe or incompatible substitutions.</text></g>
<g transform="translate(0,4725)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">4.8 Troubleshooting and Safe Recovery</text><text class="small" x="55" y="142">Start with the symptom, perform only approved checks and verify before return to service.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Observe symptom</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Isolate safely</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Operator check</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Escalate / verify</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Troubleshooting rule</text><text class="body" x="85" y="488">Simple trained checks are acceptable; electrical, structural, overheating or recurring faults require competent repair and verification.</text></g>
</svg>