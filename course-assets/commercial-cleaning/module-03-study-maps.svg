<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400" role="img" aria-label="Funda Online Academy Commercial Cleaning Module 3 study maps">
<defs><style>.bg{fill:#f7f9fc}.head{fill:#13233f}.box{fill:#fff;stroke:#5d6b82;stroke-width:2}.accent{fill:#e8f1ff}.title{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:700 22px Arial,sans-serif;fill:#13233f}.body{font:18px Arial,sans-serif;fill:#24334d}.small{font:16px Arial,sans-serif;fill:#44536a}.arrow{stroke:#5d6b82;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5d6b82"/></marker><view id="lesson-01" viewBox="0 0 1200 675"/><view id="lesson-02" viewBox="0 675 1200 675"/><view id="lesson-03" viewBox="0 1350 1200 675"/><view id="lesson-04" viewBox="0 2025 1200 675"/><view id="lesson-05" viewBox="0 2700 1200 675"/><view id="lesson-06" viewBox="0 3375 1200 675"/><view id="lesson-07" viewBox="0 4050 1200 675"/><view id="lesson-08" viewBox="0 4725 1200 675"/></defs>
<g transform="translate(0,0)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">3.1 Cleaning Chemistry</text><text class="small" x="55" y="142">Choose chemistry by soil, surface, use conditions and compatibility.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Identify soil</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Check surface</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Select product</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Use correctly</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Chemistry rule</text><text class="body" x="85" y="488">pH is one property, not a universal strength score; product purpose and approved use conditions control the decision.</text></g>
<g transform="translate(0,675)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">3.2 GHS Labels and Product Standards</text><text class="small" x="55" y="142">Read the product identity and hazard communication before use.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Identify product</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Read hazards</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Check controls</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Use as approved</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Label rule</text><text class="body" x="85" y="488">Colour coding is local support; it never replaces the written product identifier, GHS label or current SDS.</text></g>
<g transform="translate(0,1350)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">3.3 Dilution and Dosing</text><text class="small" x="55" y="142">Prepare the specified working solution and control cost-in-use.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Read dose</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Measure / dispense</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Verify system</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Track use</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Dosing rule</text><text class="body" x="85" y="488">Overdosing increases exposure, residue and cost; underdosing can reduce performance. The target is the specified dose.</text></g>
<g transform="translate(0,2025)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">3.4 Safety Data Sheets</text><text class="small" x="55" y="142">Connect technical hazard information to the actual cleaning task.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Hazards</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">First aid</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Handling</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Exposure controls</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">SDS rule</text><text class="body" x="85" y="488">The SDS provides hazard information; the site SOP and training convert it into safe task-level behaviour.</text></g>
<g transform="translate(0,2700)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">3.5 Chemical Storage and Internal Transport</text><text class="small" x="55" y="142">Keep chemicals identified, compatible, contained and controlled.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Identify</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Segregate</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Contain</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Transport safely</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Storage rule</text><text class="body" x="85" y="488">Keep containers closed and labelled, separate incompatibles and inspect for leaks before movement.</text></g>
<g transform="translate(0,3375)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">3.6 Compatibility and Prohibited Mixing</text><text class="small" x="55" y="142">Prevent hazardous reactions by stopping experimentation.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Use separately</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Recognise reaction</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Withdraw / isolate</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Escalate</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Mixing rule</text><text class="body" x="85" y="488">Do not mix, neutralise or test unknown chemicals. Follow the label, SDS and emergency procedure.</text></g>
<g transform="translate(0,4050)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">3.7 Responsible Chemical Use</text><text class="small" x="55" y="142">Reduce environmental impact without weakening hygiene or safety.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Use correct dose</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Reduce waste</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Verify claims</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Dispose safely</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Sustainability rule</text><text class="body" x="85" y="488">“Green” or “natural” is not proof of safety or suitability; claims need evidence and required cleaning performance remains non-negotiable.</text></g>
<g transform="translate(0,4725)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">3.8 Spill Response and First Aid</text><text class="small" x="55" y="142">Protect people first, then control a known spill only within training.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Stop + assess</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Isolate</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">First aid / contain</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Report + dispose</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Emergency rule</text><text class="body" x="85" y="488">Unknown fumes, large spills, reactions or symptoms are escalation conditions—not routine mop-up tasks.</text></g>
</svg>