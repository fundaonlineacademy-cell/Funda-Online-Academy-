<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400" role="img" aria-label="Funda Online Academy Commercial Cleaning Module 8 study maps">
<defs><style>.bg{fill:#f7f9fc}.head{fill:#13233f}.box{fill:#fff;stroke:#5d6b82;stroke-width:2}.accent{fill:#e8f1ff}.title{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:700 22px Arial,sans-serif;fill:#13233f}.body{font:18px Arial,sans-serif;fill:#24334d}.small{font:16px Arial,sans-serif;fill:#44536a}.arrow{stroke:#5d6b82;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5d6b82"/></marker><view id="lesson-01" viewBox="0 0 1200 675"/><view id="lesson-02" viewBox="0 675 1200 675"/><view id="lesson-03" viewBox="0 1350 1200 675"/><view id="lesson-04" viewBox="0 2025 1200 675"/><view id="lesson-05" viewBox="0 2700 1200 675"/><view id="lesson-06" viewBox="0 3375 1200 675"/><view id="lesson-07" viewBox="0 4050 1200 675"/><view id="lesson-08" viewBox="0 4725 1200 675"/></defs>
<g transform="translate(0,0)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">8.1 Site-Specific Cleaning Plan</text><text class="small" x="55" y="142">Turn client scope into schedule, workload, SOPs and controlled change.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Survey</text><text class="body" x="24" y="82">Areas, risks, access</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Define scope</text><text class="body" x="24" y="82">Tasks + exclusions</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Workload</text><text class="body" x="24" y="82">Time + resources</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Issue controls</text><text class="body" x="24" y="82">SOPs + version</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Planning rule</text><text class="body" x="85" y="488">Every task should have a frequency, method, owner, quality standard and escalation boundary.</text></g>
<g transform="translate(0,675)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">8.2 Audit and Quality Inspection</text><text class="small" x="55" y="142">Measure agreed standards with evidence, scoring and corrective action.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Define standard</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Inspect</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Correct</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Reinspect</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Evidence rule</text><text class="body" x="85" y="488">Do not hide failed items; preserve the defect, corrective action and reinspection trail.</text></g>
<g transform="translate(0,1350)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">8.3 Cleaning Service Costing</text><text class="small" x="55" y="142">Build price from complete cost, then apply markup or target margin correctly.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Scope</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Complete cost</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Price</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Stress-test</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Math rule</text><text class="body" x="85" y="488">Markup uses cost as denominator; gross margin uses selling price as denominator.</text></g>
<g transform="translate(0,2025)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">8.4 SLA and Client Management</text><text class="small" x="55" y="142">Control service expectations, complaints, exceptions and authorised variations.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">SLA</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Evidence</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Recovery</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Variation</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Control rule</text><text class="body" x="85" y="488">Urgent requests may change priorities; they do not remove safety, competence or scope controls.</text></g>
<g transform="translate(0,2700)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">8.5 Professional Portfolio</text><text class="small" x="55" y="142">Present verified competence without exaggerating credentials or client evidence.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Target role</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Verified evidence</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Privacy check</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Development</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Ethics rule</text><text class="body" x="85" y="488">List only credentials actually earned; academy learning does not automatically create external certification.</text></g>
<g transform="translate(0,3375)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">8.6 Contract Cleaning Business</text><text class="small" x="55" y="142">Connect company setup, employer duties, pricing, safety and procurement readiness.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">CIPC + finance</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Employer duties</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">OHS + contracts</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Tender readiness</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Business rule</text><text class="body" x="85" y="488">Company registration is only the start; employer, tax, UIF, compensation, safety and cash controls remain.</text></g>
<g transform="translate(0,4050)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">8.7 Integrated Cleaning Simulation</text><text class="small" x="55" y="142">Plan, deliver, adapt, inspect and hand over one complete simulated shift.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Brief + pre-start</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Deliver by zone</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Manage change</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Inspect + handover</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Simulation rule</text><text class="body" x="85" y="488">Unsafe instructions are stopped and escalated; completion includes accurate exceptions and open actions.</text></g>
<g transform="translate(0,4725)"><rect class="bg" width="1200" height="675"/><rect class="head" width="1200" height="110"/><text class="title" x="55" y="68">8.8 Project Close-Out and Readiness</text><text class="small" x="55" y="142">Reconcile evidence, identify gaps and keep formal assessment/external credentials separate.</text><g transform="translate(55,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Reconcile</text></g><g transform="translate(305,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Verify evidence</text></g><g transform="translate(555,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Readiness gaps</text></g><g transform="translate(805,195)"><rect class="box" width="210" height="145" rx="18"/><text class="sub" x="24" y="44">Next steps</text></g><path class="arrow" d="M265 267 H298"/><path class="arrow" d="M515 267 H548"/><path class="arrow" d="M765 267 H798"/><rect class="accent" x="55" y="405" width="1090" height="165" rx="18"/><text class="sub" x="85" y="448">Boundary rule</text><text class="body" x="85" y="488">Informal lesson practice is not the formal academy assessment and does not automatically award BICSc credentials.</text></g>
</svg>