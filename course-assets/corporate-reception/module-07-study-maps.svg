<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f5f8fb;stroke:#657789;stroke-width:3;rx:18}.accent{fill:#e4edf5;stroke:#657789;stroke-width:3;rx:18}.arrow{stroke:#657789;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657789"/></marker></defs><g id="lesson-01"><rect width="1200" height="675" fill="#f3f7fb"/><text x="60" y="70" class="t">7.1 Conflict & De-escalation</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Listen</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Clarify</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Boundary</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Escalate</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">De-escalation aims for safe progress while preserving facts, dignity and role boundaries.</text></g><g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f7f6f2"/><text x="60" y="70" class="t">7.2 Aggression & Access Security</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Recognise</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Distance</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Alert</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Record</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Safety comes before service when behaviour becomes threatening or access controls are challenged.</text></g><g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#f2f7f5"/><text x="60" y="70" class="t">7.3 Crisis Communication</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Verify</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Route</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Inform</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Log</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Emergency communication must be factual, brief and aligned with the workplace response plan.</text></g><g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f6f3f7"/><text x="60" y="70" class="t">7.4 Ethics & Professional Boundaries</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Facts</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Policy</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Authority</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Escalate</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Ethical decisions protect truth, confidentiality, fairness and authorised decision rights.</text></g><g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#f7f5ef"/><text x="60" y="70" class="t">7.5 Stress & Composure</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Pause</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Prioritise</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Support</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Recover</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Composure is supported by workload control, clear escalation and appropriate recovery after incidents.</text></g><g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f3f7f8"/><text x="60" y="70" class="t">7.6 Incident Reporting & Evidence</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Stabilise</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Preserve</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Record</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Follow up</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Incident records should preserve observable facts, relevant evidence and a clear handover.</text></g><g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f4f6ef"/><text x="60" y="70" class="t">7.7 Evacuation & Medical Incidents</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Alarm</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Direct</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Account</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Continue</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Emergency duties come from the site plan; untrained receptionists call trained help rather than improvise care.</text></g><g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f3f2"/><text x="60" y="70" class="t">7.8 Harassment, Threats & Safeguarding</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Protect</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Listen</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Refer</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Restrict</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Sensitive reports require safety, privacy, formal referral and careful information handling.</text></g></svg>