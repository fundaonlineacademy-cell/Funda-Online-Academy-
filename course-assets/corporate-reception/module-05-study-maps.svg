<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f5f8fb;stroke:#657789;stroke-width:3;rx:18}.accent{fill:#e4edf5;stroke:#657789;stroke-width:3;rx:18}.arrow{stroke:#657789;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657789"/></marker></defs><g id="lesson-01"><rect width="1200" height="675" fill="#f3f7fb"/><text x="60" y="70" class="t">5.1 Service Recovery Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Acknowledge</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Clarify</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Act</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Confirm</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Recovery closes the loop: acknowledge, clarify facts, act within authority and confirm outcome.</text></g><g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f7f6f2"/><text x="60" y="70" class="t">5.2 Emotional Intelligence in Practice</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Notice</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Listen</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Respond</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Boundary</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Professional empathy recognises emotion without surrendering accuracy, safety or role boundaries.</text></g><g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#f2f7f5"/><text x="60" y="70" class="t">5.3 Inclusive Front-Office Practice</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Respect</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Clarify</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Adapt</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Include</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Inclusion removes avoidable barriers while protecting dignity, privacy and consistent service.</text></g><g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f6f3f7"/><text x="60" y="70" class="t">5.4 Non-Verbal Professional Presence</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Acknowledge</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Attend</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Align</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Verify</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Body language supports service, but interpretation must remain cautious and context-aware.</text></g><g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#f7f5ef"/><text x="60" y="70" class="t">5.5 Rapport Without Favouritism</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Listen</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Deliver</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Follow up</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Stay fair</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Trust grows through reliability and follow-through, not exceptions to access or privacy rules.</text></g><g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f3f7f8"/><text x="60" y="70" class="t">5.6 Fair Queue & Priority Decisions</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Assess</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Prioritise</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Update</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Escalate</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Priority follows safety, deadlines and business impact—not status, familiarity or pressure.</text></g><g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f4f6ef"/><text x="60" y="70" class="t">5.7 Complaint Logging & Follow-Up</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Record</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Assign</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Track</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Close</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A complaint is controlled when facts, ownership, deadlines, escalation and closure remain visible.</text></g><g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f3f2"/><text x="60" y="70" class="t">5.8 Reputation & Digital Conduct</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Protect</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Check</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Route</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Pause</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Professional reputation depends on discretion, accurate representation and careful social-media choices.</text></g></svg>