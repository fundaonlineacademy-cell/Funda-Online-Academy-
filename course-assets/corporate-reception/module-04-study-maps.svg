<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f5f8fb;stroke:#657789;stroke-width:3;rx:18}.accent{fill:#e4edf5;stroke:#657789;stroke-width:3;rx:18}.arrow{stroke:#657789;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657789"/></marker></defs><g id="lesson-01"><rect width="1200" height="675" fill="#f3f7fb"/><text x="60" y="70" class="t">4.1 Executive Diary Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Protect</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Sequence</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Buffer</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Confirm</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A workable diary protects priorities, preparation, travel and decision authority.</text></g><g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f7f6f2"/><text x="60" y="70" class="t">4.2 Meeting Room Readiness</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Match</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Prepare</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Test</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Reset</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Room control matches capacity, accessibility, technology and confidentiality to the meeting.</text></g><g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#f2f7f5"/><text x="60" y="70" class="t">4.3 Cross-Time-Zone Scheduling</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Date</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Convert</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Compare</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Confirm</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Time-zone conversion must use the actual meeting date because offsets can change.</text></g><g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f6f3f7"/><text x="60" y="70" class="t">4.4 Calendar Permissions & Collaboration</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">View</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Edit</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Delegate</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Protect</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Use the least calendar permission that supports the task and verify before editing recurring events.</text></g><g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#f7f5ef"/><text x="60" y="70" class="t">4.5 Diary Disruption & Re-Prioritisation</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Assess</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Authorise</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Update</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Notify</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Disruption is controlled by consequence, authority, one source of truth and complete notification.</text></g><g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f3f7f8"/><text x="60" y="70" class="t">4.6 Appointment Confirmation</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Check</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Remind</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Record</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Rebook</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Confirmation keeps date, location, preparation, privacy and attendance status aligned.</text></g><g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f4f6ef"/><text x="60" y="70" class="t">4.7 Travel & Visitor Logistics</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Collect</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Book</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Monitor</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Close</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Logistics coordination uses approved suppliers, current timing and controlled cost authority.</text></g><g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f3f2"/><text x="60" y="70" class="t">4.8 Diary Handover & Quality Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Audit</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Correct</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Handover</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Review</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Reliable calendars need one source of truth, controlled recurring events and clear handovers.</text></g></svg>