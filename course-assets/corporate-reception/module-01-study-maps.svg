<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f5f8fb;stroke:#657789;stroke-width:3;rx:18}.accent{fill:#e4edf5;stroke:#657789;stroke-width:3;rx:18}.arrow{stroke:#657789;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657789"/></marker></defs><g id="lesson-01"><rect width="1200" height="675" fill="#f3f7fb"/><text x="60" y="70" class="t">1.1 First Impression Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Ready</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Acknowledge</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Inform</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Close loop</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Brand image is built by consistent service, accurate information and visible control.</text></g><g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f7f6f2"/><text x="60" y="70" class="t">1.2 Protocol & Professional Conduct</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Context</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Courtesy</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Respect</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Consistency</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Professional etiquette adapts to context without stereotyping people or status.</text></g><g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#f2f7f5"/><text x="60" y="70" class="t">1.3 Routing & Confidentiality</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Identify</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Verify</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Route</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Protect info</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Reception should route accurately while sharing only information the role is authorised to disclose.</text></g><g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f6f3f7"/><text x="60" y="70" class="t">1.4 POPIA & Access Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Purpose</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Minimum data</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="660" y="195" class="b">Verify</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Escalate</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Collect only what is needed, protect records and never bypass access controls for convenience.</text></g><g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#f7f5ef"/><text x="60" y="70" class="t">1.5 Front-Desk Safety & Ergonomics</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Observe</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="390" y="195" class="b">Control</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Report</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Follow up</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Fit the work to the worker, remove simple hazards and refer faults outside reception competence.</text></g><g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f3f7f8"/><text x="60" y="70" class="t">1.6 Opening → Operating → Closing → Handover</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Open</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Record</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Secure</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Handover</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A reliable shift is traceable from opening checks to secure closure and clear pending actions.</text></g><g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f4f6ef"/><text x="60" y="70" class="t">1.7 Service Standards & KPIs</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Standard</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Measure</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Review</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Improve</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Useful KPIs balance speed with accuracy, privacy, security and the actual visitor experience.</text></g><g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f3f2"/><text x="60" y="70" class="t">1.8 Decision Rights & Escalation</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Decide</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Boundary</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Escalate</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Document</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Professional confidence means acting within authority and escalating risk without delay.</text></g></svg>