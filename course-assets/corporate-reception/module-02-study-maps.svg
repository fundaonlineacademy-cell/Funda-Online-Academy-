<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f5f8fb;stroke:#657789;stroke-width:3;rx:18}.accent{fill:#e4edf5;stroke:#657789;stroke-width:3;rx:18}.arrow{stroke:#657789;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657789"/></marker></defs><g id="lesson-01"><rect width="1200" height="675" fill="#f3f7fb"/><text x="60" y="70" class="t">2.1 Visitor Journey Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Arrive</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Verify</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Handover</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Depart</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A visitor journey is controlled from first contact to checked departure.</text></g><g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f7f6f2"/><text x="60" y="70" class="t">2.2 Visitor Records & System Integrity</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Capture</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Protect</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Correct</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Reconcile</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Reliable visitor records are accurate, minimal, protected and traceable through downtime.</text></g><g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#f2f7f5"/><text x="60" y="70" class="t">2.3 Badge & Contractor Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Identify</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Authorise</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Track</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Recover</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Badges support control only when identity, sponsor and return are traceable.</text></g><g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f6f3f7"/><text x="60" y="70" class="t">2.4 Lobby & Waiting Management</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Observe</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Prioritise</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Update</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Recover</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Good hospitality combines clear updates, fairness, privacy and safe waiting conditions.</text></g><g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#f7f5ef"/><text x="60" y="70" class="t">2.5 VIP Reception Readiness</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Brief</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Coordinate</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Protect</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Adjust</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">VIP service improves coordination without removing verification or privacy controls.</text></g><g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f3f7f8"/><text x="60" y="70" class="t">2.6 Pre-Registration & Host Notification</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Expect</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Verify</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Notify</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Escalate</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Pre-registration speeds service only when it remains connected to verification.</text></g><g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f4f6ef"/><text x="60" y="70" class="t">2.7 Delivery & Collection Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Classify</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Receive</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Secure</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Release</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Parcels, couriers and technicians require traceable custody and separate access rules.</text></g><g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f3f2"/><text x="60" y="70" class="t">2.8 Inclusive Visitor Support</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Ask</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Adapt</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Coordinate</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Review</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Inclusive reception removes barriers while respecting dignity, choice and safety.</text></g></svg>