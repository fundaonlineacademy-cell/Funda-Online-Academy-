<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f5f8fb;stroke:#657789;stroke-width:3;rx:18}.accent{fill:#e4edf5;stroke:#657789;stroke-width:3;rx:18}.arrow{stroke:#657789;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657789"/></marker></defs><g id="lesson-01"><rect width="1200" height="675" fill="#f3f7fb"/><text x="60" y="70" class="t">8.1 Reception SOP Manual</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Scope</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Control</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Test</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Approve</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A useful SOP converts policy into clear steps, roles, records, escalation and quality checks.</text></g><g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f7f6f2"/><text x="60" y="70" class="t">8.2 Full-Day Reception Simulation</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Prepare</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Prioritise</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Respond</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Handover</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Capstone performance is judged by control, judgement, service, records and safe escalation.</text></g><g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#f2f7f5"/><text x="60" y="70" class="t">8.3 Visitor Experience Audit</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Observe</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Measure</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Prioritise</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Improve</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A visitor audit converts observable evidence into realistic, risk-aware improvement actions.</text></g><g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f6f3f7"/><text x="60" y="70" class="t">8.4 Professional Career Portfolio</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Evidence</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Target</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Tailor</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Verify</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Strong applications make truthful evidence easy for an employer to verify against the role.</text></g><g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#f7f5ef"/><text x="60" y="70" class="t">8.5 Final Competence Review</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Map</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Test</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Close gaps</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Confirm</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Competence review uses evidence and repeatable performance, not confidence or memory alone.</text></g><g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f3f7f8"/><text x="60" y="70" class="t">8.6 Digital Reception Workflow</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Receive</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Route</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Track</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Close</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Digital reception is controlled when every channel has ownership, status, privacy and closure.</text></g><g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f4f6ef"/><text x="60" y="70" class="t">8.7 Quality Audit & Corrective Action</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Measure</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Analyse</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Correct</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Verify</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Quality improvement closes the loop from evidence to root cause, action, owner and verification.</text></g><g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f3f2"/><text x="60" y="70" class="t">8.8 Final Practical Demonstration</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Perform</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Evidence</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Reflect</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Handover</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Final evidence should show safe, accurate and professional performance across realistic reception work.</text></g></svg>