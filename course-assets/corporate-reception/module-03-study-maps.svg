<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#243447}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f5f8fb;stroke:#657789;stroke-width:3;rx:18}.accent{fill:#e4edf5;stroke:#657789;stroke-width:3;rx:18}.arrow{stroke:#657789;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657789"/></marker></defs><g id="lesson-01"><rect width="1200" height="675" fill="#f3f7fb"/><text x="60" y="70" class="t">3.1 Multi-Line Call Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Identify</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Prioritise</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Route</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Close</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Busy switchboards require visible queues, accurate routing and controlled follow-up.</text></g><g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f7f6f2"/><text x="60" y="70" class="t">3.2 Screening, Transfers & Messages</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Screen</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Confirm</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Transfer</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Record</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Professional telephone handling balances useful screening with privacy and accuracy.</text></g><g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#f2f7f5"/><text x="60" y="70" class="t">3.3 Business Email Quality Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Purpose</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Draft</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Check</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Send</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Recipient, authority, attachment and next action must be checked before sending.</text></g><g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f6f3f7"/><text x="60" y="70" class="t">3.4 Difficult Caller De-escalation</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Listen</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Clarify</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Boundary</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Escalate</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">De-escalation aims for safe, factual progress without accepting abuse or false promises.</text></g><g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#f7f5ef"/><text x="60" y="70" class="t">3.5 Virtual Reception & Collaboration</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Prepare</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Verify</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Coordinate</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Handover</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Digital reception applies the same verification, privacy and ownership standards as physical reception.</text></g><g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f3f7f8"/><text x="60" y="70" class="t">3.6 Message Accuracy & Follow-Up</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Capture</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Read back</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Assign</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Close</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A message is complete only when the details, owner and follow-up status are clear.</text></g><g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f4f6ef"/><text x="60" y="70" class="t">3.7 Shared Inbox Triage</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Classify</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Assign</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Respond</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Escalate</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A shared inbox is a controlled work queue, not simply a collection of unread messages.</text></g><g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f3f2"/><text x="60" y="70" class="t">3.8 Templates, Handover & Response Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Template</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Commit</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Handover</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Review</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Cross-channel communication stays reliable when commitments, ownership and closure are visible.</text></g></svg>