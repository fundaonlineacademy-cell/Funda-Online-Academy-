<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#24452f}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f4faf5;stroke:#628069;stroke-width:3;rx:18}.accent{fill:#dfeee2;stroke:#628069;stroke-width:3;rx:18}.arrow{stroke:#58715e;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58715e"/></marker></defs>
<g id="lesson-01" transform="translate(0 0)"><rect width="1200" height="675" fill="#eef7f0"/><text x="60" y="70" class="t">3.1 Plant Function: Root → Shoot → Leaf → Growth</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="115" y="195" class="b">Roots</text><text x="90" y="230" class="s">Water • anchorage</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Shoots</text><text x="360" y="230" class="s">Support • transport</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="660" y="195" class="b">Leaves</text><text x="630" y="230" class="s">Light • gas exchange</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Care decision</text><text x="900" y="230" class="s">Water • light • season</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Visible symptoms are clues, not diagnoses. Connect growth patterns to roots, light, moisture, temperature and season before treating.</text></g>
<g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">3.2 Plant Selection Filter</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Site climate</text><text x="95" y="230" class="s">Sun • frost • wind</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Plant fit</text><text x="365" y="230" class="s">Size • roots • water</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Legal check</text><text x="630" y="230" class="s">Invasive status</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Maintenance fit</text><text x="900" y="230" class="s">Skill • budget • access</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Indigenous does not mean suitable everywhere, and exotic does not automatically mean invasive. Select from verified site evidence.</text></g>
<g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#eef6f2"/><text x="60" y="70" class="t">3.3 Planting Sequence: Prepare → Place → Backfill → Water</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Prepare hole</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="380" y="195" class="b">Check roots</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Set depth</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Settle root zone</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Depth, root handling, spacing and immediate watering determine establishment quality more than a neat surface finish.</text></g>
<g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f5f3ee"/><text x="60" y="70" class="t">3.4 Transplanting: Prepare → Lift → Protect → Re-establish</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Pre-water</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Protect roots</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Replant</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Monitor recovery</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Transplant shock is managed through timing, root protection, gradual acclimatisation and measured aftercare—not excessive watering.</text></g>
<g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#edf6fa"/><text x="60" y="70" class="t">3.5 Irrigation Decision Loop</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Check soil</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Check plant</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Apply water</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Verify depth</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Watering frequency changes with soil, weather, root depth and establishment stage. A fixed calendar is only a starting plan.</text></g>
<g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f7f4eb"/><text x="60" y="70" class="t">3.6 Fertiliser Control: Need → Label → Measure → Record</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="115" y="195" class="b">Need</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="390" y="195" class="b">Label</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Measure</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Record</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Fertiliser is a controlled input, not a cure-all. Use registered products as labelled and verify area, dose, timing and plant need.</text></g>
<g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f3f7ed"/><text x="60" y="70" class="t">3.7 Mulch Placement: Choose → Measure → Place → Inspect</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Material</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="390" y="195" class="b">Depth</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Stem gap</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Check water</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Mulch should protect soil without burying stems, blocking irrigation or introducing contaminated material.</text></g>
<g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f2ef"/><text x="60" y="70" class="t">3.8 Plant Health: Observe → Compare Causes → Correct → Monitor</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Symptoms</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Environment</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Likely causes</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Recovery plan</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Wilting, chlorosis and scorch are symptoms with several possible causes. Diagnose before fertilising, pruning or applying remedies.</text></g></svg>