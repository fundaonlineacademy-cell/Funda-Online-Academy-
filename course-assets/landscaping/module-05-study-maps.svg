<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#24452f}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f5faf5;stroke:#66836d;stroke-width:3;rx:18}.accent{fill:#e1efe4;stroke:#66836d;stroke-width:3;rx:18}.arrow{stroke:#58715e;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58715e"/></marker></defs>
<g id="lesson-01" transform="translate(0 0)"><rect width="1200" height="675" fill="#eef7f0"/><text x="60" y="70" class="t">5.1 Pruning Decision: Purpose → Plant Response → Cut → Review</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="112" y="195" class="b">Purpose</text><text x="95" y="230" class="s">Health • form • safety</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Growth habit</text><text x="365" y="230" class="s">Buds • leaders • shoots</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="652" y="195" class="b">Select cut</text><text x="630" y="230" class="s">Position • amount</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Review response</text><text x="900" y="230" class="s">Regrowth • wounds</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Prune for a defined horticultural purpose. Every cut changes future growth, structure and maintenance.</text></g>
<g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f6f5ef"/><text x="60" y="70" class="t">5.2 Match Technique to Objective</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="112" y="195" class="b">Thinning</text><text x="90" y="230" class="s">Remove selected stems</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="390" y="195" class="b">Heading</text><text x="365" y="230" class="s">Shorten a shoot</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="665" y="195" class="b">Shearing</text><text x="630" y="230" class="s">Formal surface</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Formative pruning</text><text x="900" y="230" class="s">Build future structure</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">The correct technique depends on the intended plant response—not on which tool is fastest.</text></g>
<g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#eef5f8"/><text x="60" y="70" class="t">5.3 Seasonal Timing Filter</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Plant identity</text><text x="90" y="230" class="s">Species • cultivar</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Flower/fruit cycle</text><text x="365" y="230" class="s">Old wood • new wood</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="657" y="195" class="b">Climate</text><text x="630" y="230" class="s">Heat • frost • rain</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Recovery window</text><text x="900" y="230" class="s">Growth • aftercare</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A calendar is a planning aid only. Timing must be checked against the actual plant and local conditions.</text></g>
<g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f4f1ed"/><text x="60" y="70" class="t">5.4 Hedge & Topiary Control Loop</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="112" y="195" class="b">Inspect</text><text x="90" y="230" class="s">Species • nests • access</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="390" y="195" class="b">Set lines</text><text x="365" y="230" class="s">Height • taper • width</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="652" y="195" class="b">Trim gradually</text><text x="630" y="230" class="s">Small controlled cuts</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Inspect finish</text><text x="900" y="230" class="s">Line • plant health</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Formal appearance must not override plant health, wildlife protection or safe equipment use.</text></g>
<g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#eef7f4"/><text x="60" y="70" class="t">5.5 Propagation: Source → Method → Hygiene → Aftercare</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="112" y="195" class="b">Select stock</text><text x="90" y="230" class="s">Healthy • true-to-type</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Choose method</text><text x="355" y="230" class="s">Seed • cut • divide • layer</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Control hygiene</text><text x="630" y="230" class="s">Tools • labels • medium</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Monitor</text><text x="900" y="230" class="s">Moisture • roots • shoots</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Propagation succeeds when the method matches the plant and aftercare capacity, with clean material and traceable labels.</text></g>
<g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f7f3ec"/><text x="60" y="70" class="t">5.6 IPM: Observe → Identify → Prevent → Intervene → Review</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="112" y="195" class="b">Observe</text><text x="90" y="230" class="s">Pattern • history</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="388" y="195" class="b">Identify</text><text x="360" y="230" class="s">Pest • disease • stress</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="648" y="195" class="b">Prevent/control</text><text x="630" y="230" class="s">Lowest-risk first</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Verify response</text><text x="900" y="230" class="s">Record • refer if unsure</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Chemical control is not the starting point. Diagnose, use integrated controls, and meet Act 36 requirements for commercial remedy use.</text></g>
<g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f6f1f4"/><text x="60" y="70" class="t">5.7 Flowering Display: Site → Palette → Sequence → Maintenance</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="112" y="195" class="b">Site fit</text><text x="90" y="230" class="s">Light • soil • water</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Plant palette</text><text x="355" y="230" class="s">Annuals • perennials</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Colour sequence</text><text x="630" y="230" class="s">Repeat • contrast • season</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Care plan</text><text x="900" y="230" class="s">Deadhead • replace • feed</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Colour succeeds only when plant needs, mature size, flowering sequence and maintenance capacity are compatible.</text></g>
<g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f1f5f0"/><text x="60" y="70" class="t">5.8 Practical: Assess → Plan → Prune/Care → Handover</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="112" y="195" class="b">Assess</text><text x="90" y="230" class="s">Plant • risk • purpose</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="390" y="195" class="b">Prepare</text><text x="360" y="230" class="s">Tools • hygiene • zone</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Perform</text><text x="630" y="230" class="s">Controlled technique</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Verify & handover</text><text x="900" y="230" class="s">Evidence • aftercare</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Entry-level practical work excludes hazardous climbing, chainsaw tree work and structural arboriculture beyond competence.</text></g></svg>