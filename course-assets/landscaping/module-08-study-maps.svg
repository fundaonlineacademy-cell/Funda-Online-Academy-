<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#24452f}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f4faf5;stroke:#628069;stroke-width:3;rx:18}.accent{fill:#dfeee2;stroke:#628069;stroke-width:3;rx:18}.arrow{stroke:#58715e;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58715e"/></marker></defs><g id="lesson-01"><rect width="1200" height="675" fill="#eef7f0"/><text x="60" y="70" class="t">8.1 Annual Maintenance Cycle</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Baseline</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Season</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Schedule</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Review</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A maintenance calendar must follow site condition, climate, plant needs and contract scope.</text></g><g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">8.2 Site Audit: Observe → Rank → Act → Verify</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Observe</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="395" y="195" class="b">Evidence</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="665" y="195" class="b">Priority</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="930" y="195" class="b">Action</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Professional audits separate facts from assumptions and rank safety, plant health and scope priorities.</text></g><g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#eef6f2"/><text x="60" y="70" class="t">8.3 Capstone Design Integration</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Site facts</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Planting</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="665" y="195" class="b">Cost</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Maintainability</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A capstone succeeds when design, cost, maintenance, safety and implementation all agree.</text></g><g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f5f3ee"/><text x="60" y="70" class="t">8.4 Business & Tender Readiness</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Services</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Capacity</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Documents</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Bid / No Bid</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Tendering starts with eligibility, capacity, evidence and realistic pricing—not with chasing every opportunity.</text></g><g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#edf6fa"/><text x="60" y="70" class="t">8.5 Portfolio & Client Onboarding</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Proof</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Scope</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="660" y="195" class="b">Consent</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Onboard</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Professional evidence must be truthful, permission-based and clearly distinguish real from simulated work.</text></g><g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f7f4eb"/><text x="60" y="70" class="t">8.6 Team & Client Service Cycle</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Brief</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Allocate</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="665" y="195" class="b">Check</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Communicate</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Strong client service combines clear scope, respectful supervision, quality checks and transparent reporting.</text></g><g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f3f7ed"/><text x="60" y="70" class="t">8.7 Water-Wise Conversion</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Baseline</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Hydrozone</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="660" y="195" class="b">Improve</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Measure</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Water-wise design reduces avoidable demand without starving plants or making unsupported savings claims.</text></g><g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f2ef"/><text x="60" y="70" class="t">8.8 Final Capstone Handover</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Plan</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Deliver</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Verify</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Handover</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Final competence is shown through traceable decisions, safe work, quality evidence and client-ready handover.</text></g></svg>