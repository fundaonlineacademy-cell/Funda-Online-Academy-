<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#1f3c2d}.t{font-size:34px;font-weight:700}.s{font-size:21px}.b{font-size:20px;font-weight:700}.box{fill:#f5faf6;stroke:#668372;stroke-width:3;rx:18}.accent{fill:#e3efe7;stroke:#668372;stroke-width:3;rx:18}.arrow{stroke:#58715e;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58715e"/></marker></defs>
<g id="lesson-01" transform="translate(0 0)"><rect width="1200" height="675" fill="#eef7f0"/><text x="60" y="70" class="t">6.1 Hand Tool Selection & Inspection</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Match task</text><text x="90" y="230" class="s">Dig • cut • rake</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="380" y="195" class="b">Inspect</text><text x="360" y="230" class="s">Handle • edge • joint</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Use safely</text><text x="630" y="230" class="s">Grip • stance • reach</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Clean & store</text><text x="900" y="230" class="s">Dry • secure • record</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">The correct tool reduces force and damage. Loose handles, cracked shafts, blunt edges and poor fit are defect signals—not normal wear to ignore.</text></g>
<g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f5f4ee"/><text x="60" y="70" class="t">6.2 Powered Equipment Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Pre-start</text><text x="92" y="230" class="s">Guard • controls • fuel</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="380" y="195" class="b">Work zone</text><text x="365" y="230" class="s">Debris • people • pets</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Operate</text><text x="630" y="230" class="s">Manual • stance • speed</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Shutdown</text><text x="895" y="230" class="s">Stop • isolate • inspect</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Model-specific instructions control operation. A missing guard, unknown control or unsafe exclusion zone is a stop-work condition.</text></g>
<g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#f0f6f4"/><text x="60" y="70" class="t">6.3 Maintenance: Clean → Inspect → Service → Record</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="115" y="195" class="b">Clean</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="380" y="195" class="b">Inspect</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="645" y="195" class="b">Sharpen/service</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Record fault</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Preventive maintenance protects both performance and safety. Defects must be isolated, tagged and referred when they exceed routine maintenance competence.</text></g>
<g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f7f2ed"/><text x="60" y="70" class="t">6.4 PPE & Hierarchy of Controls</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Identify hazard</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="365" y="195" class="b">Higher controls</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Select PPE</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Fit & inspect</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">PPE is the final layer, not a substitute for guards, exclusion zones, ventilation, safer methods or reduced exposure.</text></g>
<g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#eef4f9"/><text x="60" y="70" class="t">6.5 Fuel & Battery Care</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Identify model</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="380" y="195" class="b">Verify spec</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Store safely</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Stop on fault</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Never guess fuel ratios, charger compatibility or battery condition. Manufacturer information and visible condition determine the safe response.</text></g>
<g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f5f2ef"/><text x="60" y="70" class="t">6.6 Site Risk Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Scan site</text><text x="92" y="230" class="s">Leads • stones • slope</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="380" y="195" class="b">Control zone</text><text x="360" y="230" class="s">People • traffic • pets</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Handle load</text><text x="630" y="230" class="s">Weight • route • team</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Stop & reassess</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Electrical hazards, flying debris, vibration, noise and manual handling should be controlled before the machine starts—not managed after exposure.</text></g>
<g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f2f7ee"/><text x="60" y="70" class="t">6.7 Asset Register & Cost Control</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Identify asset</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="380" y="195" class="b">Track use</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Record service</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Repair or replace</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Asset control connects ownership, defects, service history and operating cost. Unresolved safety faults override utilisation targets.</text></g>
<g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f6f1ef"/><text x="60" y="70" class="t">6.8 Chemical Safety: Label → SDS → Control → Record</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Verify product</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Read label</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="665" y="195" class="b">Read SDS</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Authorise use</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">An SDS explains hazards and emergency controls; the registered label governs the agricultural-remedy use. Commercial application must also meet applicable Act 36 operator requirements.</text></g></svg>