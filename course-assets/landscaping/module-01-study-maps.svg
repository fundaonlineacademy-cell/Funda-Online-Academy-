<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#17351f}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f5faf5;stroke:#5c8265;stroke-width:3;rx:18}.arrow{stroke:#4f7158;stroke-width:4;marker-end:url(#a)}.accent{fill:#dcecdf;stroke:#5c8265;stroke-width:3;rx:18}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f7158"/></marker></defs>
<g id="lesson-01" transform="translate(0 0)"><rect width="1200" height="675" fill="#eef6ef"/><text x="60" y="70" class="t">1.1 Professional Landscaping Service Map</text><rect x="70" y="150" width="220" height="110" class="box"/><text x="100" y="195" class="b">Client & Site</text><text x="95" y="230" class="s">Need • access • risk</text><rect x="365" y="150" width="220" height="110" class="box"/><text x="410" y="195" class="b">Scope</text><text x="390" y="230" class="s">Install • maintain • exclude</text><rect x="660" y="150" width="220" height="110" class="box"/><text x="710" y="195" class="b">Resources</text><text x="685" y="230" class="s">People • tools • plants</text><rect x="955" y="150" width="180" height="110" class="accent"/><text x="985" y="195" class="b">Evidence</text><text x="975" y="230" class="s">Check • report</text><line x1="290" y1="205" x2="365" y2="205" class="arrow"/><line x1="585" y1="205" x2="660" y2="205" class="arrow"/><line x1="880" y1="205" x2="955" y2="205" class="arrow"/><text x="90" y="360" class="s">Professional rule: promise only work that matches competence, capacity, site conditions and the agreed service boundary.</text><text x="90" y="420" class="s">Recurring maintenance and once-off installation require different labour, scheduling, handover and quality controls.</text></g>
<g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f8f5ec"/><text x="60" y="70" class="t">1.2 Design Principles: Function Before Decoration</text><rect x="85" y="155" width="210" height="110" class="box"/><text x="125" y="198" class="b">Function</text><text x="105" y="235" class="s">Use • movement • access</text><rect x="365" y="155" width="210" height="110" class="box"/><text x="407" y="198" class="b">Structure</text><text x="385" y="235" class="s">Proportion • balance</text><rect x="645" y="155" width="210" height="110" class="box"/><text x="690" y="198" class="b">Unity</text><text x="665" y="235" class="s">Repetition • rhythm</text><rect x="925" y="155" width="210" height="110" class="accent"/><text x="955" y="198" class="b">Hierarchy</text><text x="945" y="235" class="s">Focal points • emphasis</text><line x1="295" y1="210" x2="365" y2="210" class="arrow"/><line x1="575" y1="210" x2="645" y2="210" class="arrow"/><line x1="855" y1="210" x2="925" y2="210" class="arrow"/><text x="90" y="365" class="s">A good garden is not symmetrical by default. Visual balance can be achieved with different forms that carry similar visual weight.</text><text x="90" y="425" class="s">Check circulation, drainage, mature plant size and maintenance access before approving the visual arrangement.</text></g>
<g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#eef4f7"/><text x="60" y="70" class="t">1.3 Climate & Microclimate Decision Map</text><rect x="80" y="150" width="230" height="115" class="box"/><text x="130" y="195" class="b">Regional Climate</text><text x="105" y="232" class="s">Rainfall • frost • heat</text><rect x="365" y="150" width="230" height="115" class="box"/><text x="420" y="195" class="b">Microclimate</text><text x="390" y="232" class="s">Sun • wind • shelter</text><rect x="650" y="150" width="230" height="115" class="box"/><text x="705" y="195" class="b">Plant Fit</text><text x="675" y="232" class="s">Hardiness • exposure</text><rect x="935" y="150" width="200" height="115" class="accent"/><text x="980" y="195" class="b">Care Plan</text><text x="955" y="232" class="s">Water • mulch • monitor</text><line x1="310" y1="207" x2="365" y2="207" class="arrow"/><line x1="595" y1="207" x2="650" y2="207" class="arrow"/><line x1="880" y1="207" x2="935" y2="207" class="arrow"/><text x="90" y="365" class="s">Regional labels are only a starting point. A frost pocket, reflected heat, wind tunnel or shaded wall can change plant performance inside one property.</text><text x="90" y="425" class="s">Map actual exposure before selecting plants or deciding irrigation frequency.</text></g>
<g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f2f7ef"/><text x="60" y="70" class="t">1.4 Plant Choice & Water-Wise Decision Filter</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Site Fit</text><text x="90" y="232" class="s">Climate • soil • light</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Plant Traits</text><text x="360" y="232" class="s">Size • roots • water</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Legal Check</text><text x="630" y="232" class="s">Invasive status • permit</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Maintenance Fit</text><text x="900" y="232" class="s">Pruning • irrigation • budget</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Indigenous does not automatically mean suitable for every site; exotic does not automatically mean invasive.</text><text x="90" y="425" class="s">Water-wise design combines suitable plants, soil care, mulch, zoning and efficient irrigation—not a label alone.</text></g>
<g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#f7f1ed"/><text x="60" y="70" class="t">1.5 Professional Client-Control Loop</text><rect x="80" y="155" width="215" height="110" class="box"/><text x="125" y="198" class="b">Brief</text><text x="100" y="235" class="s">Needs • priorities • limits</text><rect x="355" y="155" width="215" height="110" class="box"/><text x="400" y="198" class="b">Scope</text><text x="375" y="235" class="s">Included • excluded</text><rect x="630" y="155" width="215" height="110" class="box"/><text x="665" y="198" class="b">Approval</text><text x="650" y="235" class="s">Owner • price • change</text><rect x="905" y="155" width="215" height="110" class="accent"/><text x="945" y="198" class="b">Handover</text><text x="925" y="235" class="s">Evidence • open actions</text><line x1="295" y1="210" x2="355" y2="210" class="arrow"/><line x1="570" y1="210" x2="630" y2="210" class="arrow"/><line x1="845" y1="210" x2="905" y2="210" class="arrow"/><text x="90" y="365" class="s">Professionalism means accurate promises, respectful conduct, property protection, documented changes and honest reporting.</text><text x="90" y="425" class="s">A verbal request that changes cost, risk or scope should be confirmed through the agreed approval route.</text></g>
<g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#edf6f5"/><text x="60" y="70" class="t">1.6 Site Assessment: Observe → Measure → Map → Decide</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Observe</text><text x="90" y="232" class="s">Sun • wind • vegetation</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Measure</text><text x="360" y="232" class="s">Slope • size • access</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Map</text><text x="630" y="232" class="s">Drainage • hazards • zones</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="930" y="195" class="b">Decide</text><text x="900" y="232" class="s">Design • method • referral</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Record observations separately from assumptions. Water collecting at a low point is evidence; assuming the soil is “bad” is not.</text><text x="90" y="425" class="s">Site analysis should identify conditions that change plant choice, work sequence, drainage response or safety controls.</text></g>
<g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f4f8ef"/><text x="60" y="70" class="t">1.7 Sustainable Landscape Priority Ladder</text><rect x="80" y="145" width="210" height="120" class="accent"/><text x="112" y="190" class="b">1 Prevent</text><text x="98" y="230" class="s">Avoid waste & damage</text><rect x="355" y="145" width="210" height="120" class="box"/><text x="390" y="190" class="b">2 Reduce</text><text x="375" y="230" class="s">Water • inputs • soil loss</text><rect x="630" y="145" width="210" height="120" class="box"/><text x="668" y="190" class="b">3 Reuse</text><text x="650" y="230" class="s">Plants • mulch • materials</text><rect x="905" y="145" width="210" height="120" class="box"/><text x="940" y="190" class="b">4 Verify</text><text x="925" y="230" class="s">Measure real benefit</text><line x1="290" y1="205" x2="355" y2="205" class="arrow"/><line x1="565" y1="205" x2="630" y2="205" class="arrow"/><line x1="840" y1="205" x2="905" y2="205" class="arrow"/><text x="90" y="365" class="s">Sustainability is not a decorative claim. It should reduce unnecessary water, waste, soil disturbance and avoidable inputs while preserving function and plant health.</text><text x="90" y="425" class="s">Prioritise actions by measurable benefit, cost, feasibility and long-term maintenance.</text></g>
<g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f6f4ef"/><text x="60" y="70" class="t">1.8 Landscape Quality Dashboard</text><rect x="75" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Plant Health</text><text x="95" y="232" class="s">Survival • establishment</text><rect x="345" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Work Quality</text><text x="365" y="232" class="s">Audit • rework • defects</text><rect x="615" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Delivery</text><text x="635" y="232" class="s">Schedule • response</text><rect x="885" y="150" width="245" height="115" class="accent"/><text x="925" y="195" class="b">Client Evidence</text><text x="905" y="232" class="s">Feedback • actions • trends</text><line x1="285" y1="207" x2="345" y2="207" class="arrow"/><line x1="555" y1="207" x2="615" y2="207" class="arrow"/><line x1="825" y1="207" x2="885" y2="207" class="arrow"/><text x="90" y="365" class="s">A KPI is useful only when its formula, period, data source and response to poor performance are defined.</text><text x="90" y="425" class="s">Appearance alone cannot prove a healthy landscape. Combine plant survival, workmanship, rework and client-service evidence.</text></g></svg>