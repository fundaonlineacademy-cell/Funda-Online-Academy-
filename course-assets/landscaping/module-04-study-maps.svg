<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#24452f}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f4faf5;stroke:#628069;stroke-width:3;rx:18}.accent{fill:#dfeee2;stroke:#628069;stroke-width:3;rx:18}.arrow{stroke:#58715e;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58715e"/></marker></defs>
<g id="lesson-01" transform="translate(0 0)"><rect width="1200" height="675" fill="#eef7f0"/><text x="60" y="70" class="t">4.1 Lawn Selection: Site → Species → Maintenance Fit</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Site light</text><text x="90" y="230" class="s">Sun • shade • heat</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Use &amp; traffic</text><text x="360" y="230" class="s">Wear • recovery</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Water fit</text><text x="630" y="230" class="s">Demand • access</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Species choice</text><text x="900" y="230" class="s">Climate • upkeep</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Do not select turf from popularity alone. Match light, traffic, climate, irrigation capacity and maintenance expectations.</text></g>
<g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">4.2 Lawn Establishment: Prepare → Install → Establish → Verify</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Prepare soil</text><text x="90" y="230" class="s">Grade • amend • firm</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Install turf</text><text x="360" y="230" class="s">Seed • sod • plugs</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Water in</text><text x="630" y="230" class="s">Uniform moisture</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Check rooting</text><text x="900" y="230" class="s">Coverage • gaps • weeds</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Fast installation is not the same as successful establishment. Soil preparation, contact, moisture and aftercare control the result.</text></g>
<g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#eef6f2"/><text x="60" y="70" class="t">4.3 Mowing Cycle: Inspect → Set Height → Cut → Review</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Inspect lawn</text><text x="90" y="230" class="s">Wetness • debris • stress</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Set mower</text><text x="360" y="230" class="s">Height • blade • guards</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Mow safely</text><text x="630" y="230" class="s">Pattern • overlap</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Verify finish</text><text x="900" y="230" class="s">No scalping • clean edge</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Mowing height and frequency follow species, growth and stress. Never remove excessive leaf area simply to reduce future visits.</text></g>
<g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f5f3ee"/><text x="60" y="70" class="t">4.4 Lawn Nutrition: Diagnose → Label → Measure → Monitor</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Diagnose need</text><text x="90" y="230" class="s">Growth • colour • soil</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Read label</text><text x="360" y="230" class="s">Rate • timing • safety</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Measure area</text><text x="630" y="230" class="s">Calculate quantity</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Monitor turf</text><text x="900" y="230" class="s">Response • scorch • runoff</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Fertiliser is not a colour-correction shortcut. Apply only when justified, at the registered label rate, and record the treatment.</text></g>
<g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#edf6fa"/><text x="60" y="70" class="t">4.5 Irrigation Audit: Coverage → Schedule → Root Zone → Adjust</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Coverage</text><text x="90" y="230" class="s">Dry spots • overspray</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Schedule</text><text x="360" y="230" class="s">Weather • season • soil</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="645" y="195" class="b">Root-zone check</text><text x="630" y="230" class="s">Depth • runoff • pooling</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Adjust &amp; record</text><text x="900" y="230" class="s">Time • interval • repair</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Automation does not guarantee correct watering. Verify distribution and root-zone moisture, then adjust for site conditions.</text></g>
<g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f7f4eb"/><text x="60" y="70" class="t">4.6 Weed Control: Identify → Prevent → Least-Risk Control → Follow Up</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Identify</text><text x="90" y="230" class="s">Species • life stage</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="380" y="195" class="b">Prevent</text><text x="360" y="230" class="s">Dense turf • mulch • hygiene</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="640" y="195" class="b">Control</text><text x="630" y="230" class="s">Manual • cultural • label</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Follow up</text><text x="900" y="230" class="s">Regrowth • drift • record</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Never spray an unidentified weed. Chemical control must follow the current registered product label and protect people, plants and water.</text></g>
<g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f3f7ed"/><text x="60" y="70" class="t">4.7 Turf Problems: Symptom → Evidence → Cause → Response</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Observe</text><text x="90" y="230" class="s">Patch • colour • pattern</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Check culture</text><text x="360" y="230" class="s">Water • mow • soil</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Check pests</text><text x="630" y="230" class="s">Evidence • damage</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Correct &amp; monitor</text><text x="900" y="230" class="s">Least-risk response</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Brown turf is a symptom, not a diagnosis. Rule out irrigation, mowing, compaction and nutrition problems before pesticide use.</text></g>
<g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f2ef"/><text x="60" y="70" class="t">4.8 Ground Maintenance: Edge → Surface → Drain → Handover</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Edge cleanly</text><text x="90" y="230" class="s">Beds • lawn • paving</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="375" y="195" class="b">Manage weeds</text><text x="360" y="230" class="s">Manual • preventive</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Protect drains</text><text x="630" y="230" class="s">No debris • no runoff</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Inspect finish</text><text x="900" y="230" class="s">Safe • neat • documented</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Professional ground maintenance protects desirable plants, paving, drainage routes and nearby users while leaving a clean, verifiable finish.</text></g></svg>