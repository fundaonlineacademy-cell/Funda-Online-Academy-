<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#314321}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f7fbf3;stroke:#71875d;stroke-width:3;rx:18}.accent{fill:#e1edd6;stroke:#71875d;stroke-width:3;rx:18}.arrow{stroke:#65794f;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65794f"/></marker></defs><g id="lesson-01" transform="translate(0 0)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">2.1 Soil Science: Read the Soil Before You Change It</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Texture</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Structure</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="640" y="195" class="b">pH / biology</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Site decision</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Texture, structure, drainage, pH and organic matter each tell a different part of the story. Avoid one-test decisions.</text><text x="90" y="425" class="s">Professional rule: observe, measure where useful, control risks, document the decision, and verify the finished condition.</text></g><g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">2.2 Soil Types & Improvement: Match Treatment to Behaviour</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Sandy</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Clay-dominant</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="640" y="195" class="b">Loam-like</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Targeted response</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Do not prescribe the same amendment or irrigation pattern to every soil. Improvement should respond to observed limitations.</text><text x="90" y="425" class="s">Professional rule: observe, measure where useful, control risks, document the decision, and verify the finished condition.</text></g><g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">2.3 Site Clearing: Protect, Separate, Remove, Verify</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Retain</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Separate waste</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="640" y="195" class="b">Control hazards</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Clear safely</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Clearing is controlled removal, not indiscriminate stripping. Protect retained plants, services, neighbours and lawful waste routes.</text><text x="90" y="425" class="s">Professional rule: observe, measure where useful, control risks, document the decision, and verify the finished condition.</text></g><g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">2.4 Soil Testing: Measure → Interpret → Act</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Sample</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Measure</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="640" y="195" class="b">Interpret</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Recommend</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A soil report is evidence, not an instruction to add products automatically. Recommendations must match the plant and site.</text><text x="90" y="425" class="s">Professional rule: observe, measure where useful, control risks, document the decision, and verify the finished condition.</text></g><g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">2.5 Compost & Organic Matter: Quality, Quantity, Integration</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Check quality</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Calculate need</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="640" y="195" class="b">Apply correctly</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Monitor</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Compost should be mature, suitable and clean enough for the task. More organic matter is not automatically better.</text><text x="90" y="425" class="s">Professional rule: observe, measure where useful, control risks, document the decision, and verify the finished condition.</text></g><g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">2.6 Drainage: Source → Path → Outlet → Verify</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Find source</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Confirm fall</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="640" y="195" class="b">Choose outlet</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Prevent transfer</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Drainage work needs a safe destination for water. Never solve ponding by creating erosion, nuisance or building risk elsewhere.</text><text x="90" y="425" class="s">Professional rule: observe, measure where useful, control risks, document the decision, and verify the finished condition.</text></g><g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">2.7 Levelling & Grading: Levels → Fall → Stability → Check</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Survey levels</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Set grade</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="640" y="195" class="b">Move soil safely</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Verify drainage</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Finished levels must coordinate with doors, paving, access and runoff. Minor earthworks can create major water problems.</text><text x="90" y="425" class="s">Professional rule: observe, measure where useful, control risks, document the decision, and verify the finished condition.</text></g><g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">2.8 Bed Preparation: Clear → Assess → Amend → Form → Approve</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Clear bed</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="370" y="195" class="b">Correct soil</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="640" y="195" class="b">Set level</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Pre-plant sign-off</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A planting bed is ready only when compaction, debris, drainage, amendment, depth and final level have been checked.</text><text x="90" y="425" class="s">Professional rule: observe, measure where useful, control risks, document the decision, and verify the finished condition.</text></g></svg>