<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5400" viewBox="0 0 1200 5400"><style>text{font-family:Arial,sans-serif;fill:#24452f}.t{font-size:34px;font-weight:700}.s{font-size:22px}.b{font-size:20px;font-weight:700}.box{fill:#f4faf5;stroke:#628069;stroke-width:3;rx:18}.accent{fill:#dfeee2;stroke:#628069;stroke-width:3;rx:18}.arrow{stroke:#58715e;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58715e"/></marker></defs><g id="lesson-01" transform="translate(0 0)"><rect width="1200" height="675" fill="#eef7f0"/><text x="60" y="70" class="t">7.1 Brief → Site → Concept → Plan → Delivery</text><rect x="70" y="150" width="200" height="115" class="box"/><text x="120" y="195" class="b">Brief</text><rect x="330" y="150" width="200" height="115" class="box"/><text x="375" y="195" class="b">Site facts</text><rect x="590" y="150" width="200" height="115" class="box"/><text x="635" y="195" class="b">Concept</text><rect x="850" y="150" width="280" height="115" class="accent"/><text x="910" y="195" class="b">Approved plan</text><line x1="270" y1="207" x2="330" y2="207" class="arrow"/><line x1="530" y1="207" x2="590" y2="207" class="arrow"/><line x1="790" y1="207" x2="850" y2="207" class="arrow"/><text x="90" y="365" class="s">Design starts with verified client priorities and site evidence, not with decorative ideas.</text></g><g id="lesson-02" transform="translate(0 675)"><rect width="1200" height="675" fill="#f4f7ef"/><text x="60" y="70" class="t">7.2 Design Elements Working Together</text><rect x="70" y="150" width="190" height="115" class="box"/><text x="120" y="195" class="b">Line</text><rect x="300" y="150" width="190" height="115" class="box"/><text x="345" y="195" class="b">Form</text><rect x="530" y="150" width="190" height="115" class="box"/><text x="575" y="195" class="b">Texture</text><rect x="760" y="150" width="370" height="115" class="accent"/><text x="845" y="195" class="b">Colour + Scale</text><line x1="260" y1="207" x2="300" y2="207" class="arrow"/><line x1="490" y1="207" x2="530" y2="207" class="arrow"/><line x1="720" y1="207" x2="760" y2="207" class="arrow"/><text x="90" y="365" class="s">Visual choices must still protect movement, visibility, mature plant size and maintenance access.</text></g><g id="lesson-03" transform="translate(0 1350)"><rect width="1200" height="675" fill="#eef6f2"/><text x="60" y="70" class="t">7.3 Plan Quality: Measure → Scale → Label → Check</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Measure</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="390" y="195" class="b">Scale</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Legend</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="925" y="195" class="b">Set-out check</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A beautiful drawing is not buildable unless dimensions, scale and references can be verified on site.</text></g><g id="lesson-04" transform="translate(0 2025)"><rect width="1200" height="675" fill="#f5f3ee"/><text x="60" y="70" class="t">7.4 Hardscape Decision Path</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="110" y="195" class="b">Levels</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="390" y="195" class="b">Drainage</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Materials</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Refer structure</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Simple landscape detailing stops where structural, retaining, drainage or approval requirements begin.</text></g><g id="lesson-05" transform="translate(0 2700)"><rect width="1200" height="675" fill="#edf6fa"/><text x="60" y="70" class="t">7.5 Focal Feature Filter</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Sight line</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="390" y="195" class="b">Scale</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Safety</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="915" y="195" class="b">Maintenance</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Water, rock and feature elements must be maintainable, safe and proportionate to the site.</text></g><g id="lesson-06" transform="translate(0 3375)"><rect width="1200" height="675" fill="#f7f4eb"/><text x="60" y="70" class="t">7.6 Lighting Concept: Need → Position → Glare → Referral</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Task</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Pathway</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="650" y="195" class="b">Accent</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Electrical referral</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Landscapers may plan lighting intent, but electrical installation work belongs with legally registered competent persons.</text></g><g id="lesson-07" transform="translate(0 4050)"><rect width="1200" height="675" fill="#f3f7ed"/><text x="60" y="70" class="t">7.7 Cost Build-Up: Quantity → Rate → Labour → Risk</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="105" y="195" class="b">Quantity</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="390" y="195" class="b">Unit rate</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Labour</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="920" y="195" class="b">Total + exclusions</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">A defendable quote separates measured work, assumptions, wastage, labour, overheads, risk and exclusions.</text></g><g id="lesson-08" transform="translate(0 4725)"><rect width="1200" height="675" fill="#f7f2ef"/><text x="60" y="70" class="t">7.8 Client Approval: Explain → Compare → Record → Sign Off</text><rect x="70" y="150" width="210" height="115" class="box"/><text x="100" y="195" class="b">Explain</text><rect x="340" y="150" width="210" height="115" class="box"/><text x="385" y="195" class="b">Options</text><rect x="610" y="150" width="210" height="115" class="box"/><text x="655" y="195" class="b">Decisions</text><rect x="880" y="150" width="250" height="115" class="accent"/><text x="910" y="195" class="b">Approval record</text><line x1="280" y1="207" x2="340" y2="207" class="arrow"/><line x1="550" y1="207" x2="610" y2="207" class="arrow"/><line x1="820" y1="207" x2="880" y2="207" class="arrow"/><text x="90" y="365" class="s">Visuals support understanding; they must never imply dimensions, materials or features outside the approved scope.</text></g></svg>