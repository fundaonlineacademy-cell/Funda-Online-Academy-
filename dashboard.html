<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard | Funda Online Academy</title>

<link rel="stylesheet" href="styles.css">

<style>

/* =========================================================
   FUNDA STUDENT DASHBOARD - ISOLATED LAYOUT
   ========================================================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f9f7;
  color:#10251c;
  font-family:Arial,Helvetica,sans-serif;
}

.student-dashboard-page{
  width:100%;
  min-height:100vh;
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
}

.student-container{
  width:100%;
  max-width:1200px;
  margin:0 auto;
  padding:35px 20px 70px;
}

/* =========================================================
   HEADER
   ========================================================= */

.student-header{
  background:#ffffff;
  border-bottom:1px solid #e1e7e3;
}

.student-header-inner{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.student-brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.student-brand img{
  width:110px;
  height:110px;
  object-fit:contain;
  flex-shrink:0;
}

.student-brand-text{
  min-width:0;
}

.student-brand-name{
  font-size:28px;
  font-weight:800;
  color:#247d1b;
  line-height:1.05;
}

.student-brand-subtitle{
  margin-top:8px;
  font-size:20px;
  font-weight:700;
  color:#17619a;
}

/* =========================================================
   LOGOUT
   ========================================================= */

.student-logout{
  border:2px solid #2f8f20;
  background:#ffffff;
  color:#28761d;
  border-radius:40px;
  padding:15px 30px;
  font-size:18px;
  cursor:pointer;
  white-space:nowrap;
}

.student-logout:hover{
  background:#2f8f20;
  color:#ffffff;
}

/* =========================================================
   WELCOME
   ========================================================= */

.student-welcome{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:30px;
  margin-bottom:45px;
}

.student-badge{
  display:inline-block;
  background:#e5f4df;
  color:#28761d;
  border-radius:30px;
  padding:10px 22px;
  font-weight:700;
  font-size:16px;
}

.student-welcome h1{
  margin:22px 0 10px;
  font-size:48px;
  line-height:1.05;
}

.student-name{
  color:#2d9720;
}

.student-welcome p{
  margin:0;
  color:#53625b;
  font-size:20px;
  line-height:1.5;
}

.student-browse{
  display:inline-block;
  text-decoration:none;
  background:#2f981f;
  color:#ffffff;
  border-radius:45px;
  padding:18px 28px;
  font-size:19px;
  font-weight:600;
  text-align:center;
}

/* =========================================================
   MESSAGE
   ========================================================= */

.student-message{
  width:100%;
  padding:15px 18px;
  margin-bottom:30px;
  border-radius:12px;
  display:none;
}

.student-message.show{
  display:block;
}

.student-message.success{
  background:#e5f5e1;
  color:#226e1b;
}

.student-message.error{
  background:#fde8e8;
  color:#9d2020;
}

/* =========================================================
   SECTION
   ========================================================= */

.student-section{
  width:100%;
  margin-bottom:45px;
}

.student-section-title{
  font-size:34px;
  margin:0 0 20px;
}

/* =========================================================
   PAYMENT / ENROLMENT / COURSE GRID
   ========================================================= */

.student-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
  width:100%;
}

/* =========================================================
   CARD
   ========================================================= */

.student-card{
  width:100%;
  background:#ffffff;
  border:1px solid #e1e7e3;
  border-radius:25px;
  padding:28px;
  box-shadow:0 5px 20px rgba(0,0,0,0.04);
}

.student-card h3{
  margin:0 0 15px;
  font-size:28px;
}

.student-card p{
  color:#65716c;
  font-size:18px;
  line-height:1.55;
}

.student-info{
  margin:12px 0;
}

.student-info strong{
  color:#425049;
}

/* =========================================================
   STATUS
   ========================================================= */

.student-status{
  display:inline-block;
  padding:10px 18px;
  border-radius:30px;
  font-weight:700;
  margin-bottom:18px;
  text-transform:capitalize;
}

.student-status.pending{
  background:#e8f6e2;
  color:#28751f;
}

.student-status.approved,
.student-status.active,
.student-status.paid{
  background:#dff4dc;
  color:#197019;
}

.student-status.rejected,
.student-status.failed{
  background:#fde7e7;
  color:#a51e1e;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.student-button{
  display:inline-block;
  border:0;
  border-radius:35px;
  background:#2f981f;
  color:#ffffff;
  padding:14px 24px;
  font-size:17px;
  cursor:pointer;
  text-decoration:none;
}

.student-button:hover{
  background:#237515;
}

.student-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* =========================================================
   PAYMENT CARD
   ========================================================= */

.payment-list{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.payment-card{
  border:1px solid #e2e7e4;
  border-radius:20px;
  padding:24px;
  background:#ffffff;
}

.payment-card h3{
  margin-top:0;
}

/* =========================================================
   LOADING
   ========================================================= */

.student-loading{
  padding:25px;
  text-align:center;
  color:#68746e;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

  .student-header-inner{
    padding:12px 16px;
  }

  .student-brand{
    gap:10px;
  }

  .student-brand img{
    width:90px;
    height:90px;
  }

  .student-brand-name{
    font-size:22px;
  }

  .student-brand-subtitle{
    font-size:16px;
  }

  .student-logout{
    padding:12px 20px;
    font-size:16px;
  }

  .student-container{
    padding:28px 20px 60px;
  }

  .student-welcome{
    display:block;
    margin-bottom:40px;
  }

  .student-welcome h1{
    font-size:42px;
  }

  .student-welcome p{
    font-size:18px;
  }

  .student-browse{
    margin-top:22px;
    width:100%;
  }

  .student-section{
    margin-bottom:38px;
  }

  .student-section-title{
    font-size:31px;
  }

  .student-card{
    padding:25px;
    border-radius:22px;
  }

  .student-card h3{
    font-size:26px;
  }

  .student-button{
    width:100%;
    text-align:center;
  }
}

</style>
</head>

<body>

<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="student-header">

  <div class="student-header-inner">

    <div class="student-brand">

      <img
        src="logo.png"
        alt="Funda Online Academy"
      >

      <div class="student-brand-text">

        <div class="student-brand-name">
          Funda Online Academy Pty Ltd
        </div>

        <div class="student-brand-subtitle">
          Student Dashboard
        </div>

      </div>

    </div>

    <button
      id="logout"
      class="student-logout"
      type="button"
    >
      Logout
    </button>

  </div>

</header>


<!-- =========================================================
     STUDENT DASHBOARD
     ========================================================= -->

<main
  class="student-dashboard-page"
  id="student-dashboard-page"
>

  <div class="student-container">


    <!-- =====================================================
         WELCOME
         ===================================================== -->

    <section class="student-welcome">

      <div>

        <span class="student-badge">
          STUDENT AREA
        </span>

        <h1>
          Welcome,
          <span
            id="user-name"
            class="student-name"
          >
            Student
          </span>
        </h1>

        <p>
          Manage your profile,
          payments and course enrolments.
        </p>

        <p
          id="user-email"
          style="margin-top:8px;"
        ></p>

      </div>

      <a
        class="student-browse"
        href="index.html#courses"
      >
        Browse Courses
      </a>

    </section>


    <!-- =====================================================
         MESSAGE
         ===================================================== -->

    <div
      id="message"
      class="student-message"
    ></div>


    <!-- =====================================================
         PAYMENTS
         ===================================================== -->

    <section class="student-section">

      <h2 class="student-section-title">
        Payments
      </h2>

      <div
        id="payment-list"
        class="payment-list"
      >

        <div class="student-card">

          <h3>
            Payment History
          </h3>

          <div class="student-loading">
            Loading payment history…
          </div>

        </div>

      </div>

    </section>


    <!-- =====================================================
         MY ENROLMENTS
         ===================================================== -->

    <section class="student-section">

      <h2 class="student-section-title">
        My Enrolments
      </h2>

      <div
        id="enrolments"
        class="student-grid"
      >

        <div class="student-card">

          <div class="student-loading">
            Loading enrolments…
          </div>

        </div>

      </div>

    </section>


    <!-- =====================================================
         AVAILABLE COURSES
         ===================================================== -->

    <section class="student-section">

      <h2 class="student-section-title">
        Available Courses
      </h2>

      <div
        id="available-courses"
        class="student-grid"
      >

        <div class="student-card">

          <div class="student-loading">
            Loading courses…
          </div>

        </div>

      </div>

    </section>


  </div>

</main>


<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js?v=20260816"></script>

<script src="dashboard.js?v=20260816-6"></script>

</body>
      </html>
