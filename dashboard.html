<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard | Funda Online Academy</title>
<link rel="stylesheet" href="styles.css">
<style>
html,body{overflow-x:hidden}
.dashboard{min-height:calc(100vh - 78px)}
.dashboard .wrap{max-width:1140px;margin:auto}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:28px}
.dashboard-section{margin-bottom:30px}
.dashboard section{margin-bottom:30px}
.dashboard section h2{margin-bottom:14px}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.dashboard-grid .card{min-width:0;width:100%;margin:0}
.funda-card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.funda-status{display:inline-block;padding:7px 13px;border-radius:999px;font-weight:700;text-transform:capitalize;margin-bottom:10px;background:#fff1c7;color:#8a6500}
.funda-status.approved,.funda-status.active,.funda-status.paid{background:#dff4dc;color:#197019}
.funda-status.rejected,.funda-status.failed,.funda-status.cancelled{background:#fde8e8;color:#a51d1d}
.funda-info{margin:7px 0}
.payment-card{border:1px solid #e4ece3;border-radius:12px;padding:18px;background:#fff}
@media(max-width:900px){.dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.dash-head{display:block}.dash-head .btn{display:inline-block;margin-top:14px}.dashboard-grid{grid-template-columns:1fr}.dashboard .wrap{width:92%;}.funda-card-actions{flex-direction:column}.funda-card-actions .btn{width:100%}}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="logo" href="index.html">
      <img src="logo.png" alt="Funda Online Academy logo">
      <span>Funda Online Academy Pty Ltd<small>Student Dashboard</small></span>
    </a>
    <div class="nav-actions">
      <span id="user-email" class="user-email"></span>
      <button id="logout" class="btn ghost" type="button">Logout</button>
    </div>
  </div>
</header>

<main class="dashboard">
<div class="wrap">

  <div class="dash-head">
    <div>
      <span class="badge">STUDENT AREA</span>
      <h1>Welcome, <span id="user-name">Student</span></h1>
      <p>Manage your courses, enrolments and payments.</p>
    </div>
    <a class="btn green" href="index.html#courses">Browse Courses</a>
  </div>

  <div id="message" class="message hidden"></div>

  <section class="dashboard-section" id="payments">
    <h2>Payments</h2>
    <div id="payment-list">
      <div class="card"><p class="loading">Loading payment history…</p></div>
    </div>
  </section>

  <section>
    <h2>My Enrolments</h2>
    <div id="enrolments" class="dashboard-grid">
      <p class="loading">Loading enrolments…</p>
    </div>
  </section>

  <section>
    <h2>Available Courses</h2>
    <div id="available-courses" class="dashboard-grid">
      <p class="loading">Loading courses…</p>
    </div>
  </section>

</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260816-1"></script>
<script src="dashboard.js?v=20260816-2"></script>
</body>
</html>
