<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Study Course | Funda Online Academy
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <style>

    /* ========================================================
       FUNDA COURSE STUDY PAGE
       ======================================================== */

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
    }

    .study-page {
      width: 100%;
      min-height: 100vh;
      background: #f5f8f5;
    }

    .study-wrap {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 35px 20px 60px;
      box-sizing: border-box;
    }

    /* ========================================================
       HEADER
       ======================================================== */

    .study-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .back-btn {
      text-decoration: none;
    }

    /* ========================================================
       COURSE HEADER
       ======================================================== */

    .course-hero {
      background: white;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
      margin-bottom: 25px;
    }

    .course-badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e2f4df;
      color: #23751b;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .course-hero h1 {
      margin: 0 0 12px;
      font-size: 34px;
    }

    .course-description {
      color: #666;
      line-height: 1.7;
      font-size: 17px;
    }

    .course-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .meta-item {
      background: #f1f4f1;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* ========================================================
       PROGRESS
       ======================================================== */

    .progress-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.05);
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background: #e5e8e5;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #2d9f22;
      transition: width .3s ease;
    }

    /* ========================================================
       MAIN GRID
       ======================================================== */

    .study-grid {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 25px;
      align-items: start;
    }

    /* ========================================================
       MODULES
       ======================================================== */

    .modules-card,
    .lesson-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.05);
    }

    .modules-card {
      padding: 20px;
      position: sticky;
      top: 20px;
    }

    .modules-card h2 {
      margin-top: 0;
    }

    .module-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .module-btn {
      width: 100%;
      text-align: left;
      border: 0;
      background: #f3f6f3;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .module-btn:hover {
      background: #e6f3e4;
    }

    .module-btn.active {
      background: #2d9f22;
      color: white;
    }

    /* ========================================================
       LESSON
       ======================================================== */

    .lesson-card {
      padding: 30px;
      min-height: 400px;
    }

    .lesson-number {
      color: #2d9f22;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .lesson-card h2 {
      margin-top: 0;
      font-size: 30px;
    }

    .lesson-content {
      color: #555;
      line-height: 1.8;
      font-size: 17px;
      white-space: pre-line;
    }

    /* ========================================================
       LEARNING OUTCOMES
       ======================================================== */

    .outcomes {
      background: #f3f9f2;
      border-left: 5px solid #2d9f22;
      padding: 20px;
      border-radius: 10px;
      margin: 25px 0;
    }

    .outcomes h3 {
      margin-top: 0;
    }

    .outcomes ul {
      margin-bottom: 0;
      padding-left: 20px;
    }

    .outcomes li {
      margin-bottom: 8px;
    }

    /* ========================================================
       ACTIONS
       ======================================================== */

    .lesson-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e5e5e5;
    }

    .lesson-actions button {
      min-width: 140px;
    }

    /* ========================================================
       MESSAGE
       ======================================================== */

    .study-message {
      padding: 18px;
      border-radius: 12px;
      background: white;
      margin-bottom: 20px;
      display: none;
    }

    .study-message.show {
      display: block;
    }

    .study-message.error {
      background: #fde8e8;
      color: #8b1d1d;
    }

    .study-message.success {
      background: #e4f6e1;
      color: #216b1c;
    }

    /* ========================================================
       LOADING
       ======================================================== */

    .loading {
      padding: 30px;
      text-align: center;
      color: #666;
    }

    /* ========================================================
       MOBILE
       ======================================================== */

    @media (max-width: 800px) {

      .study-wrap {
        padding:
          20px
          15px
          45px;
      }

      .study-top {
        flex-direction: column;
        align-items: stretch;
      }

      .course-hero {
        padding: 22px;
      }

      .course-hero h1 {
        font-size: 28px;
      }

      .study-grid {
        grid-template-columns: 1fr;
      }

      .modules-card {
        position: static;
      }

      .lesson-card {
        padding: 22px;
      }

      .lesson-card h2 {
        font-size: 25px;
      }

      .lesson-actions {
        flex-direction: column;
      }

      .lesson-actions button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<!-- ========================================================
     HEADER
     ======================================================== -->

<header>

  <div class="wrap nav">

    <a
      class="logo"
      href="index.html"
    >

      <img
        src="logo.png"
        alt="Funda Online Academy logo"
      >

      <span>

        Funda Online Academy Pty Ltd

        <small>
          Online Learning
        </small>

      </span>

    </a>

  </div>

</header>


<!-- ========================================================
     STUDY PAGE
     ======================================================== -->

<main class="study-page">

  <div class="study-wrap">


    <!-- ====================================================
         TOP
         ==================================================== -->

    <div class="study-top">

      <a
        href="dashboard.html"
        class="btn ghost back-btn"
      >
        ← Back to Dashboard
      </a>

      <a
        href="index.html"
        class="btn green"
      >
        Browse Courses
      </a>

    </div>


    <!-- ====================================================
         MESSAGE
         ==================================================== -->

    <div
      id="study-message"
      class="study-message"
    ></div>


    <!-- ====================================================
         COURSE HERO
         ==================================================== -->

    <section
      class="course-hero"
      id="course-hero"
    >

      <span class="course-badge">
        ONLINE COURSE
      </span>

      <h1 id="course-title">
        Loading course…
      </h1>

      <p
        id="course-description"
        class="course-description"
      >
        Loading course information…
      </p>

      <div
        id="course-meta"
        class="course-meta"
      ></div>

    </section>


    <!-- ====================================================
         PROGRESS
         ==================================================== -->

    <section class="progress-card">

      <div class="progress-head">

        <strong>
          Course Progress
        </strong>

        <strong id="progress-text">
          0%
        </strong>

      </div>

      <div class="progress-bar">

        <div
          id="progress-fill"
          class="progress-fill"
        ></div>

      </div>

    </section>


    <!-- ====================================================
         STUDY GRID
         ==================================================== -->

    <div class="study-grid">


      <!-- ==================================================
           MODULES
           ================================================== -->

      <aside class="modules-card">

        <h2>
          Course Modules
        </h2>

        <div
          id="module-list"
          class="module-list"
        >

          <p class="loading">
            Loading modules…
          </p>

        </div>

      </aside>


      <!-- ==================================================
           LESSON
           ================================================== -->

      <section
        id="lesson-card"
        class="lesson-card"
      >

        <div
          id="lesson-content"
        >

          <p class="loading">
            Loading learning material…
          </p>

        </div>

      </section>

    </div>


  </div>

</main>


<!-- ========================================================
     SUPABASE
     ======================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- ========================================================
     CONFIG
     ======================================================== -->

<script
  src="supabase-config.js?v=20260816"
></script>


<!-- ========================================================
     COURSE STUDY JAVASCRIPT
     ======================================================== -->

<script
  src="course-study.js?v=20260816-1"
></script>


</body>

</html>
