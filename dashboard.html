<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Student Dashboard | Funda Online Academy
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <style>

    /* =========================================================
       FUNDA ONLINE ACADEMY
       STUDENT DASHBOARD
       MOBILE + DESKTOP LAYOUT
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow-x: hidden;
    }

    .dashboard {
      padding: 40px 0 70px;
      width: 100%;
    }

    .dashboard .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .dash-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      margin-bottom: 30px;
    }

    .dash-head h1 {
      margin: 10px 0;
    }

    .dash-head p {
      margin: 0;
      color: #66736c;
    }

    .user-email {
      margin-right: 12px;
      font-size: 14px;
      color: #555;
    }

    /* =========================================================
       SECTIONS
       ========================================================= */

    .dashboard-section,
    .dashboard > .wrap > section {
      width: 100%;
      margin-top: 35px;
    }

    .dashboard-section h2,
    .dashboard > .wrap > section h2 {
      margin-bottom: 20px;
    }

    /* =========================================================
       IMPORTANT:
       FORCE THE COURSE / ENROLMENT GRID TO USE FULL WIDTH
       ========================================================= */

    .grid3 {
      width: 100% !important;
      max-width: 100% !important;

      display: grid !important;

      grid-template-columns:
        repeat(3, minmax(0, 1fr)) !important;

      gap: 24px !important;

      align-items: stretch !important;
    }

    .grid3 > * {
      width: 100% !important;
      max-width: none !important;
      min-width: 0 !important;
    }

    /* =========================================================
       CARDS
       ========================================================= */

    .card {
      width: 100%;
      max-width: none;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .course-card {
      width: 100%;
      height: 100%;
    }

    /* =========================================================
       PROFILE
       ========================================================= */

    .student-info-card {
      width: 100%;
      margin-bottom: 30px;
    }

    .student-info-grid {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px, 1fr)
        );

      gap: 15px;
      margin-top: 15px;
    }

    .student-info-item {
      padding: 14px;
      background: #f7f9f8;
      border-radius: 10px;
      min-width: 0;
    }

    .student-info-item small {
      display: block;
      color: #68756e;
      margin-bottom: 5px;
    }

    .student-info-item strong {
      display: block;
      overflow-wrap: anywhere;
    }

    /* =========================================================
       COURSE INFORMATION
       ========================================================= */

    .course-description {
      line-height: 1.6;
    }

    .course-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .course-meta span {
      padding: 6px 10px;
      border-radius: 999px;
      background: #f0f3f1;
      font-size: 13px;
    }

    .course-price {
      font-size: 20px;
      font-weight: 800;
      margin: 15px 0;
    }

    .course-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .course-image-placeholder {
      width: 100%;
      height: 150px;
      border-radius: 12px;
      margin-bottom: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eef5f0;
      color: #4f6257;
      font-weight: 700;
    }

    /* =========================================================
       STATUS
       ========================================================= */

    .status-badge {
      display: inline-block;

      padding: 7px 14px;

      border-radius: 999px;

      font-size: 13px;
      font-weight: 700;

      text-transform: capitalize;
    }

    .status-pending {
      background: #fff3cd;
      color: #856404;
    }

    .status-approved,
    .status-active,
    .status-paid,
    .status-completed {
      background: #dff5e7;
      color: #176b3a;
    }

    .status-rejected,
    .status-cancelled,
    .status-failed {
      background: #fde2e2;
      color: #a12626;
    }

    /* =========================================================
       PAYMENT TABLE
       ========================================================= */

    .payment-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .payment-table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
    }

    .payment-table th,
    .payment-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e8ece9;
    }

    .payment-table th {
      font-weight: 700;
    }

    /* =========================================================
       MESSAGES
       ========================================================= */

    .message {
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      margin: 20px 0;
    }

    .message.hidden {
      display: none;
    }

    .message.success {
      background: #e5f7eb;
      color: #176b3a;
    }

    .message.error {
      background: #fde8e8;
      color: #a12626;
    }

    .loading {
      color: #66736c;
    }

    /* =========================================================
       ACTIONS
       ========================================================= */

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================================================
       EMPTY CARD
       ========================================================= */

    .empty-card {
      width: 100%;
      padding: 25px;
      text-align: center;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 800px) {

      .dashboard {
        padding-top: 25px;
      }

      .dashboard .wrap {
        width: 100%;
        padding-left: 16px;
        padding-right: 16px;
      }

      .dash-head {
        flex-direction: column;
        align-items: flex-start;
      }

      /*
        THIS IS THE IMPORTANT FIX.

        On phones every card gets the entire width.
      */

      .grid3 {
        width: 100% !important;

        grid-template-columns:
          minmax(0, 1fr) !important;

        gap: 18px !important;
      }

      .grid3 > * {
        width: 100% !important;
        max-width: 100% !important;
      }

      .card {
        width: 100% !important;
        max-width: 100% !important;
      }

      .student-info-grid {
        grid-template-columns:
          1fr;
      }

    }

    /* =========================================================
       SMALL PHONES
       ========================================================= */

    @media (max-width: 480px) {

      .dashboard .wrap {
        padding-left: 14px;
        padding-right: 14px;
      }

      .dashboard-section,
      .dashboard > .wrap > section {
        margin-top: 28px;
      }

      .grid3 {
        width: 100% !important;
        grid-template-columns: 1fr !important;
      }

      .grid3 > .card {
        width: 100% !important;
        min-width: 0 !important;
      }

      .user-email {
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

    }

  </style>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header>

  <div class="wrap nav">

    <a
      class="logo"
      href="index.html"
    >

      <img
        src="logo.png"
        alt="Funda Online Academy logo"
      >

      <span>

        Funda Online Academy Pty Ltd

        <small>
          Student Dashboard
        </small>

      </span>

    </a>


    <div class="nav-actions">

      <span
        id="user-email"
        class="user-email"
      ></span>


      <button
        id="logout"
        class="btn ghost"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

</header>



<!-- =========================================================
     MAIN DASHBOARD
     ========================================================= -->

<main class="dashboard">

  <div class="wrap">


    <!-- =======================================================
         WELCOME
         ======================================================= -->

    <div class="dash-head">

      <div>

        <span class="badge">
          STUDENT AREA
        </span>


        <h1>

          Welcome,
          <span id="user-name">
            Student
          </span>

        </h1>


        <p>
          Manage your profile, enrolments,
          courses and payments.
        </p>

      </div>


      <a
        class="btn green"
        href="index.html#courses"
      >
        Browse Courses
      </a>

    </div>



    <!-- =======================================================
         MESSAGE
         ======================================================= -->

    <div
      id="message"
      class="message hidden"
    ></div>



    <!-- =======================================================
         PROFILE
         ======================================================= -->

    <section
      class="dashboard-section"
      id="student-profile"
    >

      <h2>
        My Profile
      </h2>


      <div
        id="student-profile-content"
        class="card student-info-card"
      >

        <p class="loading">
          Loading profile…
        </p>

      </div>

    </section>



    <!-- =======================================================
         PAYMENTS
         ======================================================= -->

    <section
      class="dashboard-section"
      id="payments"
    >

      <h2>
        Payments
      </h2>


      <div id="payment-list">

        <div class="card">

          <h3>
            Course Payments
          </h3>


          <p class="loading">
            Loading payments…
          </p>

        </div>

      </div>

    </section>



    <!-- =======================================================
         MY ENROLMENTS
         ======================================================= -->

    <section
      class="dashboard-section"
      id="my-enrolments"
    >

      <h2>
        My Enrolments
      </h2>


      <div
        id="enrolments"
        class="grid3"
      >

        <p class="loading">
          Loading enrolments…
        </p>

      </div>

    </section>



    <!-- =======================================================
         AVAILABLE COURSES
         ======================================================= -->

    <section
      class="dashboard-section"
      id="available-courses-section"
    >

      <h2>
        Available Courses
      </h2>


      <div
        id="available-courses"
        class="grid3"
      >

        <p class="loading">
          Loading courses…
        </p>

      </div>

    </section>


  </div>

</main>
