<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Student Dashboard | Funda Online Academy
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <style>

    /* ========================================================
       FUNDA STUDENT DASHBOARD
       FINAL MOBILE SPACING FIX
       ======================================================== */

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    .dashboard {
      width: 100%;
      max-width: 100%;
    }

    .dashboard .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
      box-sizing: border-box;
    }


    /* ========================================================
       ALL DASHBOARD SECTIONS
       REMOVE UNWANTED LARGE SPACING
       ======================================================== */

    .dashboard section,
    .dashboard-section {

      width: 100%;
      max-width: 100%;

      box-sizing: border-box;

      margin-top: 0 !important;
      margin-bottom: 25px !important;

      padding-top: 0 !important;
      padding-bottom: 0 !important;

      min-height: 0 !important;
      height: auto !important;

    }


    /* ========================================================
       PAYMENTS SECTION
       ======================================================== */

    #payments {

      width: 100%;
      max-width: 100%;

      margin-top: 0 !important;
      margin-bottom: 15px !important;

      padding-top: 0 !important;
      padding-bottom: 0 !important;

      min-height: 0 !important;
      height: auto !important;

    }


    /* ========================================================
       PAYMENT LIST
       ======================================================== */

    #payment-list {

      width: 100%;
      max-width: 100%;

      margin: 0 !important;

      padding: 0 !important;

      box-sizing: border-box;

    }


    #payment-list .card {

      width: 100%;
      max-width: 100%;

      margin-bottom: 0 !important;

      box-sizing: border-box;

    }


    /* ========================================================
       PAYMENT HEADING
       ======================================================== */

    #payments h2 {

      margin-top: 0 !important;
      margin-bottom: 20px !important;

    }


    /* ========================================================
       MY ENROLMENTS
       FORCE IT CLOSE TO PAYMENTS
       ======================================================== */

    #payments + section {

      width: 100%;
      max-width: 100%;

      margin-top: 0 !important;
      margin-bottom: 25px !important;

      padding-top: 0 !important;
      padding-bottom: 0 !important;

      min-height: 0 !important;
      height: auto !important;

    }


    #payments + section h2 {

      margin-top: 0 !important;
      margin-bottom: 20px !important;

    }


    /* ========================================================
       AVAILABLE COURSES
       ======================================================== */

    #payments + section + section {

      margin-top: 25px !important;

    }


    /* ========================================================
       ENROLMENTS
       ======================================================== */

    #enrolments.grid3 {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr);

      width: 100%;
      max-width: 100%;

      gap: 20px;

      margin: 0 !important;
      padding: 0 !important;

      box-sizing: border-box;

    }


    /* ========================================================
       AVAILABLE COURSES
       ======================================================== */

    #available-courses.grid3 {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr);

      width: 100%;
      max-width: 100%;

      gap: 20px;

      margin: 0 !important;
      padding: 0 !important;

      box-sizing: border-box;

    }


    /* ========================================================
       ENROLMENT CARDS
       ======================================================== */

    #enrolments .card,
    #available-courses .card {

      width: 100%;
      max-width: 100%;

      min-width: 0;

      margin: 0;

      box-sizing: border-box;

    }


    /* ========================================================
       TABLE
       ======================================================== */

    #payment-list table {

      width: 100%;
      min-width: 600px;

    }


    /* ========================================================
       MESSAGE
       ======================================================== */

    #message {

      width: 100%;

      box-sizing: border-box;

      margin-bottom: 25px;

    }


    /* ========================================================
       BUTTONS
       ======================================================== */

    .study-btn,
    .enrol-btn {

      max-width: 100%;

    }


    /* ========================================================
       MOBILE
       ======================================================== */

    @media (max-width: 700px) {

      .dashboard .wrap {

        width: 100%;

        padding-left: 16px;
        padding-right: 16px;

        box-sizing: border-box;

      }


      /* ----------------------------------------
         PAYMENTS
         ---------------------------------------- */

      #payments {

        margin-top: 0 !important;
        margin-bottom: 10px !important;

        padding-top: 0 !important;
        padding-bottom: 0 !important;

        min-height: 0 !important;
        height: auto !important;

      }


      /* ----------------------------------------
         PAYMENT CARD
         ---------------------------------------- */

      #payment-list .card {

        margin-bottom: 0 !important;

      }


      /* ----------------------------------------
         MY ENROLMENTS
         ---------------------------------------- */

      #payments + section {

        margin-top: 0 !important;
        margin-bottom: 25px !important;

        padding-top: 0 !important;
        padding-bottom: 0 !important;

        min-height: 0 !important;
        height: auto !important;

      }


      #payments + section h2 {

        margin-top: 0 !important;
        margin-bottom: 20px !important;

      }


      /* ----------------------------------------
         AVAILABLE COURSES
         ---------------------------------------- */

      #payments + section + section {

        margin-top: 25px !important;

      }


      /* ----------------------------------------
         GRIDS
         ---------------------------------------- */

      #enrolments.grid3,
      #available-courses.grid3 {

        grid-template-columns:
          minmax(0, 1fr);

        width: 100%;

        gap: 20px;

        margin: 0 !important;
        padding: 0 !important;

      }


      /* ----------------------------------------
         CARDS
         ---------------------------------------- */

      #enrolments .card,
      #available-courses .card {

        width: 100%;

        min-width: 0;

        box-sizing: border-box;

      }


      .dashboard-section,
      .dashboard section {

        width: 100%;

      }


      .dash-head {

        width: 100%;

      }

    }


    /* ========================================================
       TABLET
       ======================================================== */

    @media (min-width: 701px) {

      #enrolments.grid3,
      #available-courses.grid3 {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

      }

    }


    /* ========================================================
       DESKTOP
       ======================================================== */

    @media (min-width: 1000px) {

      #enrolments.grid3,
      #available-courses.grid3 {

        grid-template-columns:
          repeat(3, minmax(0, 1fr));

      }

    }

  </style>

</head>


<body>
