<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Student Dashboard | Funda Online Academy</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
    }

    .dashboard {
      width: 100%;
      max-width: 100%;
    }

    .dashboard .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .dashboard-section,
    .dashboard section {
      width: 100%;
      margin: 0 0 35px 0;
    }

    .dash-head {
      width: 100%;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    #enrolments,
    #available-courses {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      box-sizing: border-box;
    }

    #enrolments .card,
    #available-courses .card {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    #payment-list {
      width: 100%;
      box-sizing: border-box;
    }

    #payment-list .card {
      width: 100%;
      box-sizing: border-box;
    }

    .funda-status {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      text-transform: capitalize;
      margin-bottom: 12px;
    }

    .funda-status.pending {
      background: #fff3cd;
      color: #856404;
    }

    .funda-status.approved,
    .funda-status.active,
    .funda-status.paid {
      background: #d4edda;
      color: #155724;
    }

    .funda-status.rejected,
    .funda-status.failed {
      background: #f8d7da;
      color: #721c24;
    }

    .funda-info {
      margin: 10px 0;
      line-height: 1.5;
    }

    .funda-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    #message {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 25px;
    }

    .funda-error-box {
      background: #fff3f3;
      border: 1px solid #e5bcbc;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .funda-loading {
      padding: 20px;
    }

    @media (max-width: 900px) {
      #enrolments,
      #available-courses {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .dashboard .wrap {
        padding: 16px;
      }

      .dash-head {
        display: block;
      }

      .dash-head .btn {
        display: inline-block;
        margin-top: 15px;
      }

      #enrolments,
      #available-courses {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      #enrolments .card,
      #available-courses .card {
        width: 100%;
      }

      .funda-actions {
        flex-direction: column;
      }

      .funda-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="wrap nav">

    <a class="logo" href="index.html">

      <img
        src="logo.png"
        alt="Funda Online Academy logo"
      >

      <span>
        Funda Online Academy Pty Ltd

        <small>
          Student Dashboard
        </small>
      </span>

    </a>

    <div class="nav-actions">

      <span
        id="user-email"
        class="user-email"
      ></span>

      <button
        id="logout"
        class="btn ghost"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>
</header>

<main class="dashboard">

  <div class="wrap">

    <div class="dash-head">

      <div>

        <span class="badge">
          STUDENT AREA
        </span>

        <h1>
          Welcome,
          <span id="user-name">
            Student
          </span>
        </h1>

        <p>
          Manage your profile, courses,
          enrolments and payments.
        </p>

      </div>

      <a
        class="btn green"
        href="index.html#courses"
      >
        Browse Courses
      </a>

    </div>

    <div
      id="message"
      class="message hidden"
    ></div>

    <!-- PAYMENTS -->

    <section
      class="dashboard-section"
      id="payments"
    >

      <h2>
        Payments
      </h2>

      <div id="payment-list">

        <div class="card">
          <h3>
            Payment History
          </h3>

          <p>
            Loading payment information...
          </p>
        </div>

      </div>

    </section>

    <!-- ENROLMENTS -->

    <section>

      <h2>
        My Enrolments
      </h2>

      <div id="enrolments">

        <div class="card funda-loading">
          Loading enrolments...
        </div>

      </div>

    </section>

    <!-- COURSES -->

    <section>

      <h2>
        Available Courses
      </h2>

      <div id="available-courses">

        <div class="card funda-loading">
          Loading courses...
        </div>

      </div>

    </section>

  </div>

</main>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
  src="supabase-config.js?v=20260816-1"
></script>

<script
  src="dashboard.js?v=20260816-1"
></script>

</body>
</html>
