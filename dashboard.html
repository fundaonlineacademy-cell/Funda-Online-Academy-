<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Student Dashboard | Funda Online Academy
  </title>

  <link
    rel="stylesheet"
    href="styles.css?v=4"
  >

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header>

  <div class="wrap nav">

    <a
      class="logo"
      href="index.html"
    >

      <img
        src="logo.png"
        alt="Funda Online Academy logo"
      >

      <span>

        Funda Online Academy Pty Ltd

        <small>
          Student Dashboard
        </small>

      </span>

    </a>


    <div class="nav-actions">

      <span
        id="user-email"
        class="user-email"
      ></span>


      <button
        id="logout"
        class="btn ghost"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

</header>



<!-- ==========================================
     DASHBOARD
========================================== -->

<main class="dashboard">

  <div class="wrap">


    <!-- ======================================
         DASHBOARD HEADER
    ======================================= -->

    <div class="dash-head">

      <div>

        <span class="badge">
          STUDENT AREA
        </span>


        <h1>

          Welcome,

          <span id="user-name">
            Student
          </span>

        </h1>


        <p>
          Manage your profile and course
          enrolments.
        </p>

      </div>


      <a
        class="btn green"
        href="index.html#courses"
      >
        Browse Courses
      </a>

    </div>



    <!-- ======================================
         MESSAGE
    ======================================= -->

    <div
      id="message"
      class="message hidden"
    ></div>



    <!-- ======================================
         PAYMENTS
    ======================================= -->

    <section
      class="dashboard-section"
      id="payments"
    >

      <h2>
        Payments
      </h2>


      <div id="payment-list">

        <div class="card">

          <h3>
            Course Payments
          </h3>


          <p>
            Your payment information will
            appear here after you enrol in
            a course.
          </p>

        </div>

      </div>

    </section>



    <!-- ======================================
         MY ENROLMENTS
    ======================================= -->

    <section>

      <h2>
        My Enrolments
      </h2>


      <div
        id="enrolments"
        class="grid3"
      >

        <p class="loading">
          Loading…
        </p>

      </div>

    </section>



    <!-- ======================================
         AVAILABLE COURSES
    ======================================= -->

    <section>

      <h2>
        Available Courses
      </h2>


      <div
        id="available-courses"
        class="grid3"
      >

        <p class="loading">
          Loading…
        </p>

      </div>

    </section>


  </div>

</main>



<!-- ==========================================
     SUPABASE
========================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- ==========================================
     SUPABASE CONFIG
========================================== -->

<script
  src="supabase-config.js?v=4"
></script>


<!-- ==========================================
     DASHBOARD JAVASCRIPT

     VERSION NUMBER FORCES THE BROWSER
     TO LOAD THE NEW FILE.
========================================== -->

<script
  src="dashboard.js?v=4"
></script>


</body>

</html>
