<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Funda Online Academy - Online Learning</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Your existing Supabase configuration -->
<script src="config.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f4f8f5;
  color:#10251d;
}

a{
  text-decoration:none;
}

.topbar{
  background:white;
  border-bottom:1px solid #ddd;
  padding:18px 30px;
}

.topbar-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  width:110px;
  height:80px;
  object-fit:contain;
}

.brand h1{
  color:#21821c;
  font-size:28px;
  line-height:1.1;
}

.brand p{
  color:#1670a5;
  font-size:20px;
  font-weight:700;
  margin-top:5px;
}

.container{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

.actions{
  display:flex;
  gap:15px;
  margin-bottom:35px;
}

.btn{
  border:none;
  cursor:pointer;
  border-radius:35px;
  padding:18px 28px;
  font-size:18px;
  font-weight:600;
  text-align:center;
}

.btn-green{
  background:#2f9e1f;
  color:white;
}

.btn-outline{
  background:white;
  color:#267b23;
  border:2px solid #d7e4d9;
}

.course-card,
.progress-card,
.modules-card,
.module-content-card{
  background:white;
  border-radius:30px;
  padding:35px;
  margin-bottom:28px;
  box-shadow:0 5px 25px rgba(0,0,0,.05);
}

.badge{
  display:inline-block;
  background:#e4f5df;
  color:#287b24;
  padding:12px 25px;
  border-radius:30px;
  font-size:18px;
  font-weight:700;
  margin-bottom:25px;
}

.course-title{
  font-size:48px;
  margin-bottom:18px;
  color:#071a13;
}

.course-description{
  font-size:20px;
  color:#68746f;
  line-height:1.7;
}

.course-fee{
  margin-top:20px;
  font-size:20px;
  color:#52625b;
}

.progress-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.progress-header h2{
  font-size:25px;
}

.progress-percent{
  font-size:25px;
  font-weight:700;
}

.progress-bar{
  width:100%;
  height:18px;
  background:#e5e8e6;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#2f9e1f;
  transition:width .3s ease;
}

.modules-card h2{
  font-size:34px;
  margin-bottom:25px;
}

.module{
  border:1px solid #e1e7e3;
  border-radius:20px;
  margin-bottom:15px;
  overflow:hidden;
}

.module-header{
  width:100%;
  border:none;
  background:#f7faf7;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  text-align:left;
}

.module-title{
  font-size:20px;
  font-weight:700;
  color:#173027;
}

.module-status{
  color:#777;
  font-size:14px;
}

.module-body{
  display:none;
  padding:25px;
  border-top:1px solid #e5e5e5;
}

.module-body.open{
  display:block;
}

.module-body h3{
  font-size:25px;
  margin-bottom:15px;
}

.module-body p{
  font-size:18px;
  line-height:1.7;
  color:#5c6863;
  white-space:pre-line;
}

.module-actions{
  margin-top:25px;
}

.loading{
  text-align:center;
  padding:40px 10px;
  color:#6d7772;
  font-size:20px;
}

.error-box{
  background:#fff0f0;
  border:1px solid #efcaca;
  color:#9b2020;
  border-radius:20px;
  padding:25px;
  line-height:1.6;
}

.success-box{
  background:#eaf8e6;
  border:1px solid #c9e8c1;
  color:#24721d;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
}

.empty-box{
  background:#f8faf8;
  border-radius:20px;
  padding:30px;
  text-align:center;
  color:#69746f;
}

.hidden{
  display:none !important;
}

@media(max-width:700px){

  .topbar{
    padding:12px 15px;
  }

  .topbar-inner{
    gap:12px;
  }

  .logo{
    width:105px;
    height:65px;
  }

  .brand h1{
    font-size:20px;
  }

  .brand p{
    font-size:17px;
  }

  .container{
    padding:20px 15px 45px;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

  .course-card,
  .progress-card,
  .modules-card,
  .module-content-card{
    padding:25px 20px;
    border-radius:25px;
  }

  .course-title{
    font-size:36px;
  }

  .course-description{
    font-size:18px;
  }

  .modules-card h2{
    font-size:30px;
  }

  .module-title{
    font-size:18px;
  }

  .module-header{
    padding:18px;
  }

}

</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <img
      src="logo.png"
      alt="Funda Online Academy"
      class="logo"
    >

    <div class="brand">

      <h1>
        Funda Online Academy Pty Ltd
      </h1>

      <p>
        Online Learning
      </p>

    </div>

  </div>

</header>


<main class="container">

  <div class="actions">

    <a
      href="student-dashboard.html"
      class="btn btn-outline"
    >
      ← Back to Dashboard
    </a>

    <a
      href="index.html#courses"
      class="btn btn-green"
    >
      Browse Courses
    </a>

  </div>


  <!-- COURSE -->

  <section
    id="course-card"
    class="course-card"
  >

    <span class="badge">
      ONLINE COURSE
    </span>

    <h1
      id="course-title"
      class="course-title"
    >
      Loading course...
    </h1>

    <p
      id="course-description"
      class="course-description"
    >
      Loading course information...
    </p>

    <p
      id="course-fee"
      class="course-fee"
    ></p>

  </section>


  <!-- PROGRESS -->

  <section class="progress-card">

    <div class="progress-header">

      <h2>
        Course Progress
      </h2>

      <span
        id="progress-percent"
        class="progress-percent"
      >
        0%
      </span>

    </div>

    <div class="progress-bar">

      <div
        id="progress-fill"
        class="progress-fill"
      ></div>

    </div>

  </section>


  <!-- MESSAGE -->

  <div
    id="message"
    class="hidden"
  ></div>


  <!-- MODULES -->

  <section class="modules-card">

    <h2>
      Course Modules
    </h2>

    <div
      id="modules"
    >

      <div class="loading">
        Loading modules...
      </div>

    </div>

  </section>


  <!-- MODULE CONTENT -->

  <section
    id="module-content-card"
    class="module-content-card hidden"
  >

    <h2 id="selected-module-title">
      Module
    </h2>

    <div
      id="selected-module-content"
      style="margin-top:20px;"
    ></div>

  </section>

</main>


<script>

"use strict";

// ============================================================
// SUPABASE
// ============================================================

const { createClient } = supabase;

const db = createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY
);


// ============================================================
// ELEMENTS
// ============================================================

const courseTitle =
  document.getElementById("course-title");

const courseDescription =
  document.getElementById("course-description");

const courseFee =
  document.getElementById("course-fee");

const modulesEl =
  document.getElementById("modules");

const messageEl =
  document.getElementById("message");

const progressPercent =
  document.getElementById("progress-percent");

const progressFill =
  document.getElementById("progress-fill");

const moduleContentCard =
  document.getElementById(
    "module-content-card"
  );

const selectedModuleTitle =
  document.getElementById(
    "selected-module-title"
  );

const selectedModuleContent =
  document.getElementById(
    "selected-module-content"
  );


// ============================================================
// HELPERS
// ============================================================

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatMoney(value){

  const number =
    Number(value);

  if(
    Number.isNaN(number)
  ){
    return "";
  }

  return "Course fee: R" +
    number.toLocaleString(
      "en-ZA",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}


function normaliseStatus(status){

  return String(
    status || ""
  )
  .trim()
  .toLowerCase();
}


function showError(text){

  if(!messageEl){
    return;
  }

  messageEl.className =
    "error-box";

  messageEl.textContent =
    text;
}


// ============================================================
// GET COURSE ID
// ============================================================

function getCourseId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("id") ||
    params.get("course_id") ||
    params.get("courseId") ||
    params.get("course")
  );
}


// ============================================================
// CURRENT USER
// ============================================================

async function getCurrentUser(){

  const {
    data,
    error
  } =
    await db.auth.getUser();

  if(error){
    throw error;
  }

  return data?.user || null;
}


// ============================================================
// GET STUDENT
// ============================================================

async function getStudent(userId){

  const {
    data,
    error
  } =
    await db
      .from("students")
      .select("*")
      .eq(
        "user_id",
        userId
      )
      .maybeSingle();

  if(error){
    throw error;
  }

  return data;
}


// ============================================================
// GET COURSE
// ============================================================

async function getCourse(courseId){

  const {
    data,
    error
  } =
    await db
      .from("courses")
      .select("*")
      .eq(
        "id",
        courseId
      )
      .maybeSingle();

  if(error){
    throw error;
  }

  return data;
}


// ============================================================
// CHECK ENROLMENT
// ============================================================

async function checkEnrolment(
  studentId,
  courseId
){

  const {
    data,
    error
  } =
    await db
      .from("enrollments")
      .select(
        "id,course_id,enrollment_status"
      )
      .eq(
        "student_id",
        studentId
      )
      .eq(
        "course_id",
        courseId
      )
      .maybeSingle();

  if(error){
    throw error;
  }

  return data;
}


// ============================================================
// LOAD COURSE INFORMATION
// ============================================================

function displayCourse(course){

  const title =
    course?.title ||
    course?.name ||
    "Online Course";

  const description =
    course?.description ||
    "Welcome to your online course.";

  courseTitle.textContent =
    title;

  courseDescription.textContent =
    description;

  if(
    course?.price !== null &&
    course?.price !== undefined
  ){

    courseFee.textContent =
      formatMoney(
        course.price
      );

  }else{

    courseFee.textContent =
      "";

  }
}


// ============================================================
// NORMALISE MODULE
// ============================================================

function normaliseModule(
  item,
  index
){

  if(
    typeof item === "string"
  ){

    return {
      id:
        "module-" +
        index,

      title:
        "Module " +
        (index + 1),

      content:
        item
    };

  }

  const title =
    item?.title ||
    item?.name ||
    item?.module_title ||
    item?.module_name ||
    "Module " +
    (index + 1);

  const content =
    item?.content ||
    item?.description ||
    item?.body ||
    item?.lesson ||
    item?.text ||
    "";

  return {

    id:
      item?.id ||
      "module-" +
      index,

    title:
      title,

    content:
      content

  };
}


// ============================================================
// GET MODULES FROM COURSE
// ============================================================

function getModulesFromCourse(
  course
){

  if(!course){
    return [];
  }

  let raw =
    course.modules;

  if(!raw){
    return [];
  }

  if(
    typeof raw === "string"
  ){

    try{

      raw =
        JSON.parse(raw);

    }catch(error){

      return [
        {
          id:"module-0",
          title:"Course Content",
          content:raw
        }
      ];

    }

  }

  if(
    Array.isArray(raw)
  ){

    return raw.map(
      normaliseModule
    );

  }

  return [];
}


// ============================================================
// LOAD MODULES FROM DATABASE
// ============================================================

async function getDatabaseModules(
  courseId
){

  try{

    const {
      data,
      error
    } =
      await db
        .from("course_modules")
        .select("*")
        .eq(
          "course_id",
          courseId
        )
        .order(
          "module_number",
          {
            ascending:true
          }
        );

    if(error){

      console.warn(
        "course_modules lookup failed:",
        error.message
      );

      return [];
    }

    if(
      !data ||
      data.length === 0
    ){

      return [];
    }

    return data.map(
      normaliseModule
    );

  }catch(error){

    console.warn(
      "Could not load course_modules:",
      error
    );

    return [];
  }
}


// ============================================================
// DISPLAY MODULES
// ============================================================

function displayModules(
  modules
){

  if(
    !modules ||
    modules.length === 0
  ){

    modulesEl.innerHTML = `

      <div class="empty-box">

        <h3>
          Course content is being prepared
        </h3>

        <p style="margin-top:10px;">
          The course has been approved,
          but learning modules have not
          been added yet.
        </p>

      </div>

    `;

    return;
  }


  modulesEl.innerHTML =
    modules
      .map(
        (module,index) => {

          return `

            <div
              class="module"
            >

              <button
                type="button"
                class="module-header"
                data-module-index="${index}"
              >

                <span
                  class="module-title"
                >
                  ${escapeHTML(
                    module.title
                  )}
                </span>

                <span
                  class="module-status"
                >
                  Open
                </span>

              </button>

              <div
                class="module-body"
                id="module-body-${index}"
              >

                <h3>
                  ${escapeHTML(
                    module.title
                  )}
                </h3>

                <p>
                  ${
                    escapeHTML(
                      module.content ||
                      "Learning content will appear here."
                    )
                  }
                </p>

                <div
                  class="module-actions"
                >

                  <button
                    type="button"
                    class="btn btn-green complete-module"
                    data-module-index="${index}"
                  >
                    ✓ Mark Module Complete
                  </button>

                </div>

              </div>

            </div>

          `;
        }
      )
      .join("");


  // ==========================================================
  // OPEN MODULES
  // ==========================================================

  document
    .querySelectorAll(
      ".module-header"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const index =
              button.dataset.moduleIndex;

            const body =
              document.getElementById(
                "module-body-" +
                index
              );

            if(!body){
              return;
            }

            body.classList.toggle(
              "open"
            );

          }
        );

      }
    );


  // ==========================================================
  // COMPLETE MODULE
  // ==========================================================

  document
    .querySelectorAll(
      ".complete-module"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const index =
              Number(
                button.dataset.moduleIndex
              );

            completeModule(
              index,
              modules.length
            );

          }
        );

      }
    );
}


// ============================================================
// PROGRESS
// ============================================================

let completedModules =
  new Set();


function updateProgress(
  total
){

  if(
    !total ||
    total <= 0
  ){

    progressPercent.textContent =
      "0%";

    progressFill.style.width =
      "0%";

    return;
  }

  const percentage =
    Math.round(
      (
        completedModules.size /
        total
      ) * 100
    );

  progressPercent.textContent =
    percentage + "%";

  progressFill.style.width =
    percentage + "%";
}


// ============================================================
// COMPLETE MODULE
// ============================================================

function completeModule(
  index,
  total
){

  completedModules.add(
    index
  );

  updateProgress(
    total
  );

  const button =
    document.querySelector(
      `.complete-module[data-module-index="${index}"]`
    );

  if(button){

    button.textContent =
      "✓ Completed";

    button.disabled =
      true;

    button.style.opacity =
      "0.7";

  }

  if(
    completedModules.size ===
    total
  ){

    messageEl.className =
      "success-box";

    messageEl.textContent =
      "🎉 Congratulations! You have completed all course modules.";

  }

}


// ============================================================
// INITIALISE
// ============================================================

async function init(){

  try{

    // --------------------------------------------------------
    // COURSE ID
    // --------------------------------------------------------

    const courseId =
      getCourseId();

    if(!courseId){

      courseTitle.textContent =
        "Course not found";

      courseDescription.textContent =
        "No course was selected.";

      modulesEl.innerHTML = `

        <div class="error-box">

          No course ID was provided.

          <br><br>

          Please return to your dashboard
          and select an approved course.

        </div>

      `;

      return;
    }


    // --------------------------------------------------------
    // USER
    // --------------------------------------------------------

    const user =
      await getCurrentUser();

    if(!user){

      window.location.href =
        "login.html";

      return;
    }


    // --------------------------------------------------------
    // STUDENT
    // --------------------------------------------------------

    const student =
      await getStudent(
        user.id
      );

    if(!student){

      throw new Error(
        "Student profile not found."
      );

    }


    // --------------------------------------------------------
    // COURSE
    // --------------------------------------------------------

    const course =
      await getCourse(
        courseId
      );

    if(!course){

      courseTitle.textContent =
        "Course not found";

      courseDescription.textContent =
        "This course could not be found.";

      modulesEl.innerHTML = `

        <div class="error-box">

          The selected course could not
          be found in the system.

        </div>

      `;

      return;
    }


    // --------------------------------------------------------
    // DISPLAY COURSE
    // --------------------------------------------------------

    displayCourse(
      course
    );


    // --------------------------------------------------------
    // ENROLMENT
    // --------------------------------------------------------

    const enrolment =
      await checkEnrolment(
        student.id,
        courseId
      );

    if(!enrolment){

      modulesEl.innerHTML = `

        <div class="error-box">

          You are not enrolled in this
          course.

          <br><br>

          Please return to your dashboard
          and enrol first.

        </div>

      `;

      return;
    }


    const status =
      normaliseStatus(
        enrolment.enrollment_status
      );


    // --------------------------------------------------------
    // ONLY APPROVED / ACTIVE STUDENTS
    // --------------------------------------------------------

    if(
      status !== "approved" &&
      status !== "active"
    ){

      modulesEl.innerHTML = `

        <div class="error-box">

          Your enrolment is currently

          <strong>
            ${escapeHTML(status)}
          </strong>.

          <br><br>

          Your course content will become
          available after your enrolment
          has been approved.

        </div>

      `;

      return;
    }


    // --------------------------------------------------------
    // FIRST TRY course_modules TABLE
    // --------------------------------------------------------

    let modules =
      await getDatabaseModules(
        courseId
      );


    // --------------------------------------------------------
    // FALLBACK TO courses.modules
    // --------------------------------------------------------

    if(
      modules.length === 0
    ){

      modules =
        getModulesFromCourse(
          course
        );

    }


    // --------------------------------------------------------
    // DISPLAY
    // --------------------------------------------------------

    displayModules(
      modules
    );

    updateProgress(
      modules.length
    );


  }catch(error){

    console.error(
      "COURSE STUDY ERROR:",
      error
    );

    courseTitle.textContent =
      "Unable to load course";

    courseDescription.textContent =
      "Something went wrong while loading your course.";

    modulesEl.innerHTML = `

      <div class="error-box">

        <strong>
          Course loading error
        </strong>

        <br><br>

        The learning page could not
        load the course information.

        <br><br>

        Please return to the dashboard
        and try opening the course again.

      </div>

    `;

  }

}


// ============================================================
// START
// ============================================================

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    init
  );

}else{

  init();

}

</script>

</body>
  </html>
