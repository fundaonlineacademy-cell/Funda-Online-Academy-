<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Apply to become a Funda Online Academy Creator Partner or Ambassador.">
<title>Creator Partner Application | Funda Online Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260916-ambassador-application"></script>
<style>
:root{--deep:#21384d;--gold:#c99a2e;--ink:#243750;--cream:#fff4dc}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fbfaf6,#eef1f0 64%,#fff4dc);min-height:100vh}h1,h2,h3,.brand,nav{font-family:Montserrat,sans-serif}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.btnPrimary{background:#21384d;color:#fff}.cpbox{background:#fff;border:1px solid #d8d0bd;border-radius:22px;padding:24px;box-shadow:0 12px 30px rgba(33,56,77,.08)}.cpgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.cpf{display:grid;gap:7px}.cpf span,.cplabel{font-size:14px;font-weight:800;color:#21384d}.cpf input,.cpf select,.cpf textarea{width:100%;border:1px solid #cfc8b9;border-radius:13px;padding:13px 14px;background:#fff;color:#111827;outline:none;font-size:15px}.cpf input:focus,.cpf select:focus,.cpf textarea:focus{border-color:#c99a2e;box-shadow:0 0 0 3px rgba(201,154,46,.14)}.cpwide{grid-column:1/-1}.cpnote{font-size:14px;line-height:1.7;color:#111827}.cpstatus{display:none;border-radius:12px;padding:13px;font-size:14px;line-height:1.55}.cpstatus.ok{display:block;background:#eaf6ef;color:#12543b;border:1px solid #b8dec9}.cpstatus.err{display:block;background:#fff0f0;color:#8b1f1f;border:1px solid #e9c2c2}.cpconsent{display:flex;align-items:flex-start;gap:10px;border:1px solid #e0d7c3;background:#fffdf7;border-radius:13px;padding:14px;color:#111827;font-size:13px;line-height:1.55}.cpconsent input{margin-top:3px;flex:0 0 auto}.cpactions{display:flex;gap:10px;flex-wrap:wrap}.cpsecondary{display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid #cfc8b9;color:#21384d;text-decoration:none}.cpplatforms{display:grid;gap:12px}.cpplatform{border:1px solid #e0d7c3;background:#fffdf7;border-radius:16px;padding:14px}.cpplatformHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;color:#21384d;font-size:14px}.cpremove{border:0;background:transparent;color:#9b2525;font-weight:800;cursor:pointer;padding:4px 0}.cpadd{border:1px solid #cfc8b9;background:#fff;color:#21384d}
@media(max-width:700px){.cpgrid{grid-template-columns:1fr}.cpwide{grid-column:auto}.cpbox{padding:20px}.cpplatform .cpwide{grid-column:auto}}
</style>
</head>
<body>
<header class="sticky top-0 z-50 bg-[#fffdf7]/95 backdrop-blur border-b border-[#ded7c7]">
  <nav class="max-w-5xl mx-auto px-4 sm:px-6 h-[74px] flex items-center justify-between gap-3">
    <a href="index.html" class="flex items-center gap-3 min-w-0"><img src="logo.png" alt="Funda Online Academy" class="w-11 h-11 object-contain rounded-xl"><div class="brand leading-none"><div class="font-extrabold text-[15px] sm:text-[17px] text-[#21384d]">FUNDA <span class="font-semibold">ONLINE</span></div><div class="mt-1 text-[8px] sm:text-[9px] tracking-[.25em] font-bold text-[#b58216]">ACADEMY</div></div></a>
    <a href="ambassadors.html" class="rounded-xl border border-[#21384d] text-[#21384d] px-3 sm:px-4 py-2.5 text-xs font-bold whitespace-nowrap">Back to Programme</a>
  </nav>
</header>
<main class="max-w-5xl mx-auto px-5 sm:px-6 py-10 sm:py-12">
  <section class="max-w-3xl mx-auto" aria-labelledby="applicationHeading">
    <div class="mb-6">
      <div class="text-[10px] font-extrabold tracking-[.18em] text-[#a87818]">CREATOR PARTNER APPLICATION</div>
      <h1 id="applicationHeading" class="mt-2 text-3xl sm:text-4xl font-extrabold text-[#21384d]">Tell us the essentials.</h1>
      <p class="mt-3 cpnote">Create your login details and add the social profiles you want us to review.</p>
    </div>
    <form id="cpForm" class="cpbox cpgrid">
      <label class="cpf"><span>Full name *</span><input id="cpName" required autocomplete="name"></label>
      <label class="cpf"><span>Email address *</span><input id="cpEmail" type="email" required autocomplete="email"></label>
      <label class="cpf cpwide"><span>Mobile / WhatsApp *</span><input id="cpPhone" type="tel" required autocomplete="tel"></label>
      <label class="cpf"><span>Create password *</span><input id="cpPassword" type="password" required minlength="8" autocomplete="new-password"></label>
      <label class="cpf"><span>Confirm password *</span><input id="cpPassword2" type="password" required minlength="8" autocomplete="new-password"></label>
      <div class="cpwide">
        <div class="cplabel mb-2">Social platforms *</div>
        <div id="cpPlatforms" class="cpplatforms"></div>
        <button id="cpAddPlatform" type="button" class="btn cpadd mt-3">+ Add another platform</button>
      </div>
      <label class="cpf cpwide"><span>Content niche / topic *</span><input id="cpNiche" required placeholder="e.g. Careers, business, lifestyle"></label>
      <label class="cpf cpwide"><span>Briefly describe your audience *</span><textarea id="cpAudience" required rows="3" placeholder="Who follows you and what are they interested in?"></textarea></label>
      <label class="cpconsent cpwide"><input id="cpConsent" type="checkbox" required><span>I consent to Funda Online Academy using these details to assess and respond to my Creator Partner application. I understand that submitting an application does not guarantee approval.</span></label>
      <div class="cpactions cpwide"><button id="cpSubmit" type="submit" class="btn btnPrimary">Submit Application</button><a href="ambassadors.html" class="btn cpsecondary">Back to Programme</a></div>
      <div id="cpStatus" class="cpstatus cpwide" aria-live="polite"></div>
    </form>
  </section>
</main>
<footer class="bg-[#172b3d] text-white mt-10"><div class="max-w-5xl mx-auto px-5 sm:px-6 py-7 flex flex-col sm:flex-row justify-between gap-4"><div><b>FUNDA ONLINE ACADEMY</b><div class="text-[9px] tracking-[.18em] text-[#efd78e] mt-1">LEARN · GROW · BUILD YOUR FUTURE</div></div><div class="flex gap-5 text-xs text-blue-100"><a href="ambassadors.html">Programme</a><a href="ambassador-login.html">Ambassador Portal</a></div></div></footer>
<script src="ambassador-application.js?v=20260916-dedicated-page-v1"></script>
</body>
</html>
