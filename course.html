<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>My Course | Funda Online Academy</title>

<link rel="stylesheet" href="styles.css">

<style>

html,
body{
  overflow-x:hidden;
}

.course-page{
  min-height:calc(100vh - 78px);
  padding:35px 0 70px;
}

.course-page .wrap{
  max-width:1100px;
  width:92%;
  margin:auto;
}

.course-header{
  background:#10251c;
  color:#fff;
  border-radius:22px;
  padding:30px;
  margin-bottom:25px;
}

.course-header h1{
  margin:12px 0;
  line-height:1.3;
}

.course-header p{
  line-height:1.7;
  opacity:.9;
}

.back-button{
  display:inline-block;
  text-decoration:none;
  color:#10251c;
  background:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-weight:700;
  margin-bottom:20px;
}

.course-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.course-meta span{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  padding:9px 13px;
  border-radius:999px;
  font-size:14px;
  font-weight:700;
}

.course-card{
  background:#fff;
  border:1px solid #dfe8e2;
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 6px 25px rgba(16,37,28,.05);
}

.course-card h2{
  margin-bottom:15px;
  color:#10251c;
}

.module-card{
  border:1px solid #dfe8e2;
  border-radius:17px;
  margin-bottom:14px;
  overflow:hidden;
}

.module-header{
  width:100%;
  border:0;
  background:#f1f7f3;
  padding:18px;
  text-align:left;
  cursor:pointer;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;

  font-size:16px;
  font-weight:700;
  color:#10251c;
}

.module-header:hover{
  background:#e8f4ed;
}

.module-left{
  display:flex;
  align-items:flex-start;
  gap:12px;
}

.module-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  width:34px;
  height:34px;
  min-width:34px;

  border-radius:50%;
  background:#0c8f55;
  color:#fff;
}

.module-name{
  padding-top:7px;
  line-height:1.4;
}

.module-icon{
  font-size:22px;
}

.module-content{
  display:none;
  padding:20px;
  background:#fff;
}

.module-content.open{
  display:block;
}

.module-description{
  color:#53625b;
  line-height:1.6;
  margin-bottom:18px;
}

.outcomes{
  background:#f1faf5;
  border:1px solid #d8e9df;
  border-radius:14px;
  padding:16px;
  margin-bottom:18px;
}

.outcomes h3{
  margin-bottom:10px;
}

.outcomes ul{
  padding-left:20px;
}

.outcomes li{
  margin-bottom:7px;
  line-height:1.5;
}

.lesson-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.lesson-card{
  border:1px solid #e1e9e4;
  border-radius:14px;
  padding:17px;
}

.lesson-top{
  display:flex;
  gap:12px;
}

.lesson-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  width:32px;
  height:32px;
  min-width:32px;

  border-radius:50%;
  background:#e8f5ee;
  color:#0c8f55;
  font-weight:800;
}

.lesson-main{
  flex:1;
}

.lesson-title{
  font-weight:700;
  color:#10251c;
  margin-bottom:6px;
}

.lesson-objective{
  color:#68766f;
  font-size:14px;
  line-height:1.5;
}

.lesson-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.lesson-button{
  border:1px solid #0c8f55;
  background:#fff;
  color:#0c8f55;
  border-radius:9px;
  padding:9px 13px;
  font-weight:700;
  cursor:pointer;
}

.lesson-button:hover{
  background:#f1faf5;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

.info-box{
  background:#f7faf8;
  border:1px solid #dfe8e2;
  border-radius:15px;
  padding:18px;
}

.info-box h3{
  margin-bottom:8px;
}

.info-box p{
  color:#53625b;
  line-height:1.6;
}

.empty{
  text-align:center;
  padding:35px 20px;
  background:#f8faf9;
  border:1px dashed #cddbd3;
  border-radius:17px;
}

.error{
  padding:20px;
  background:#fff4f4;
  border:1px solid #efc7c7;
  color:#8e2222;
  border-radius:15px;
  line-height:1.6;
}

/* ============================================================
   LESSON VIEWER
   ============================================================ */

.lesson-viewer{
  display:none;

  position:fixed;
  inset:0;

  z-index:9999;

  background:rgba(0,0,0,.65);

  overflow-y:auto;

  padding:15px;
}

.lesson-viewer.show{
  display:block;
}

.lesson-box{
  max-width:900px;
  margin:30px auto;

  background:#fff;

  border-radius:22px;

  overflow:hidden;

  box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.lesson-header{
  background:#10251c;
  color:#fff;

  padding:20px;

  display:flex;
  justify-content:space-between;
  gap:20px;
}

.lesson-header h2{
  margin:0;
  line-height:1.4;
}

.close-lesson{
  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:#fff;
  color:#10251c;

  font-size:23px;

  cursor:pointer;
}

.lesson-body{
  padding:25px;
}

.lesson-content{
  color:#26362e;
  line-height:1.8;
  font-size:16px;
}

.lesson-content h1,
.lesson-content h2,
.lesson-content h3{
  color:#10251c;
  margin-top:22px;
  margin-bottom:10px;
}

.lesson-content p{
  margin-bottom:15px;
}

.lesson-content ul,
.lesson-content ol{
  margin:0 0 18px 25px;
}

.lesson-content li{
  margin-bottom:8px;
}

.lesson-content img{
  max-width:100%;
  height:auto;
  border-radius:14px;
  margin:15px 0;
}

.lesson-content iframe{
  width:100%;
  min-height:450px;
  border:0;
  border-radius:14px;
}

.lesson-resource{
  margin-top:20px;
  padding-top:20px;
  border-top:1px solid #e1e9e4;
}

.lesson-resource a{
  color:#0c8f55;
  font-weight:700;
}

@media(max-width:700px){

  .course-header{
    padding:22px;
  }

  .course-card{
    padding:18px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .lesson-body{
    padding:18px;
  }

  .lesson-content{
    font-size:15px;
  }

  .lesson-content iframe{
    min-height:250px;
  }

}

<script>

(function(){

"use strict";


let db = null;

let currentUser = null;

let currentStudent = null;

let currentCourse = null;

let currentModules = [];

let currentLessons = [];


const courseHeader =
  document.getElementById(
    "course-header"
  );

const courseContent =
  document.getElementById(
    "course-content"
  );

const userEmail =
  document.getElementById(
    "user-email"
  );

const logoutButton =
  document.getElementById(
    "logout"
  );

const lessonViewer =
  document.getElementById(
    "lesson-viewer"
  );

const lessonTitle =
  document.getElementById(
    "lesson-title"
  );

const lessonModule =
  document.getElementById(
    "lesson-module"
  );

const lessonContent =
  document.getElementById(
    "lesson-content"
  );

const lessonResource =
  document.getElementById(
    "lesson-resource"
  );

const closeLessonButton =
  document.getElementById(
    "close-lesson"
  );


/* ============================================================
   HELPERS
   ============================================================ */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function withTimeout(
  promise,
  seconds,
  label
){

  return Promise.race([

    promise,

    new Promise(
      (resolve,reject) => {

        setTimeout(
          () => {

            reject(
              new Error(
                label +
                " timed out."
              )
            );

          },
          seconds * 1000
        );

      }
    )

  ]);

}


function money(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "—";

  }

  const number =
    Number(value);

  if(Number.isNaN(number)){

    return escapeHtml(value);

  }

  return "R " +
    number.toLocaleString(
      "en-ZA",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


function getCourseId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get(
    "course_id"
  );

}


/* ============================================================
   DATABASE
   ============================================================ */

function createDatabase(){

  if(
    window.supabaseClient &&
    typeof window.supabaseClient.from === "function"
  ){

    return window.supabaseClient;

  }

  if(
    window.db &&
    typeof window.db.from === "function"
  ){

    return window.db;

  }

  if(
    !window.supabase ||
    !window.SUPABASE_URL ||
    !window.SUPABASE_ANON_KEY
  ){

    throw new Error(
      "Supabase configuration could not be loaded."
    );

  }

  return window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
  );

}


/* ============================================================
   AUTHENTICATION
   ============================================================ */

async function getUser(){

  const result =
    await withTimeout(
      db.auth.getUser(),
      15,
      "Checking student login"
    );

  if(result.error){

    throw result.error;

  }

  if(
    !result.data ||
    !result.data.user
  ){

    window.location.href =
      "login.html";

    return null;

  }

  return result.data.user;

}


/* ============================================================
   STUDENT
   ============================================================ */

async function getStudent(
  userId
){

  const result =
    await withTimeout(

      db
        .from("students")
        .select("*")
        .eq(
          "user_id",
          userId
        )
        .limit(1),

      15,

      "Loading student profile"

    );

  if(result.error){

    throw result.error;

  }

  if(
    !result.data ||
    result.data.length === 0
  ){

    throw new Error(
      "Your student profile could not be found."
    );

  }

  return result.data[0];

}


/* ============================================================
   APPROVED ENROLMENT CHECK
   ============================================================ */

async function verifyApprovedEnrolment(
  studentId,
  courseId
){

  let result =
    await withTimeout(

      db
        .from("enrollments")
        .select(`
          id,
          student_id,
          course_id,
          enrollment_status
        `)
        .eq(
          "student_id",
          studentId
        )
        .eq(
          "course_id",
          courseId
        )
        .eq(
          "enrollment_status",
          "approved"
        )
        .limit(1),

      15,

      "Checking course enrolment"

    );


  /*
   * Fallback for installations using
   * British spelling.
   */

  if(
    result.error &&
    (
      result.error.code === "42P01" ||
      String(
        result.error.message || ""
      )
      .toLowerCase()
      .includes("does not exist")
    )
  ){

    result =
      await withTimeout(

        db
          .from("enrolments")
          .select(`
            id,
            student_id,
            course_id,
            enrollment_status
          `)
          .eq(
            "student_id",
            studentId
          )
          .eq(
            "course_id",
            courseId
          )
          .eq(
            "enrollment_status",
            "approved"
          )
          .limit(1),

        15,

        "Checking course enrolment"

      );

  }


  if(result.error){

    throw result.error;

  }


  if(
    !result.data ||
    result.data.length === 0
  ){

    return false;

  }


  return true;

}


/* ============================================================
   COURSE
   ============================================================ */

async function getCourse(
  courseId
){

  const result =
    await withTimeout(

      db
        .from("courses")
        .select(`
          id,
          title,
          slug,
          description,
          duration,
          price,
          image_url,
          modules,
          active,
          learning_outcomes,
          assessment_info,
          certificate_info
        `)
        .eq(
          "id",
          courseId
        )
        .limit(1),

      15,

      "Loading course"

    );

  if(result.error){

    throw result.error;

  }

  if(
    !result.data ||
    result.data.length === 0
  ){

    throw new Error(
      "The course could not be found."
    );

  }

  return result.data[0];

}


/* ============================================================
   MODULES
   ============================================================ */

async function getModules(
  courseId
){

  const result =
    await withTimeout(

      db
        .from("course_modules")
        .select(`
          id,
          course_id,
          module_number,
          module_name,
          description,
          learning_outcomes
        `)
        .eq(
          "course_id",
          courseId
        )
        .order(
          "module_number",
          {
            ascending:true
          }
        ),

      15,

      "Loading course modules"

    );

  if(result.error){

    throw result.error;

  }

  return result.data || [];

}


/* ============================================================
   LESSONS
   ============================================================ */

async function getLessons(
  moduleIds
){

  if(
    !moduleIds ||
    moduleIds.length === 0
  ){

    return [];

  }

  const result =
    await withTimeout(

      db
        .from("lessons")
        .select(`
          id,
          module_id,
          lesson_number,
          title,
          content,
          video_url,
          document_url,
          learning_objectives,
          key_terms,
          practical_activity,
          knowledge_check
        `)
        .in(
          "module_id",
          moduleIds
        )
        .order(
          "lesson_number",
          {
            ascending:true
          }
        ),

      15,

      "Loading course lessons"

    );

  if(result.error){

    throw result.error;

  }

  return result.data || [];

}


/* ============================================================
   RENDER HEADER
   ============================================================ */

function renderCourseHeader(){

  const course =
    currentCourse;

  courseHeader.innerHTML = `

    <h1>
      ${escapeHtml(
        course.title
      )}
    </h1>

    <p>

      ${escapeHtml(
        course.description ||
        "Funda Online Academy course."
      )}

    </p>


    <div class="course-meta">

      <span>
        💰 ${money(course.price)}
      </span>

      <span>
        ⏱️ ${escapeHtml(
          course.duration || "—"
        )}
      </span>

      <span>
        📚 ${currentModules.length}
        ${
          currentModules.length === 1
            ? "module"
            : "modules"
        }
      </span>

      <span>
        📖 ${currentLessons.length}
        ${
          currentLessons.length === 1
            ? "lesson"
            : "lessons"
        }
      </span>

      <span>
        ✓ Approved
      </span>

    </div>

  `;

}


/* ============================================================
   COURSE INFORMATION
   ============================================================ */

function renderCourseInformation(){

  const outcomes =
    currentCourse.learning_outcomes || [];

  const outcomeArray =
    Array.isArray(outcomes)
      ? outcomes
      : [outcomes];


  const outcomesHtml =
    outcomeArray
      .filter(
        item =>
          item !== null &&
          item !== undefined &&
          String(item).trim() !== ""
      )
      .map(
        item => `
          <li>
            ${escapeHtml(item)}
          </li>
        `
      )
      .join("");


  courseContent.innerHTML = `

    <div class="course-card">

      <h2>
        🎯 Learning Outcomes
      </h2>

      ${
        outcomesHtml
          ? `
            <div class="outcomes">

              <ul>
                ${outcomesHtml}
              </ul>

            </div>
          `
          : `
            <p>
              Learning outcomes will appear here.
            </p>
          `
      }

    </div>


    <div class="course-card">

      <h2>
        📖 Course Modules
      </h2>

      <div id="modules-list">
      </div>

    </div>


    <div class="course-card">

      <h2>
        📝 Assessment
      </h2>

      <p style="line-height:1.7">

        ${
          escapeHtml(
            currentCourse.assessment_info ||
            "Assessment information will be provided by Funda Online Academy."
          )
        }

      </p>

    </div>


    <div class="course-card">

      <h2>
        🎓 Certificate
      </h2>

      <p style="line-height:1.7">

        ${
          escapeHtml(
            currentCourse.certificate_info ||
            "Certificate information will be provided by Funda Online Academy."
          )
        }

      </p>

    </div>

  `;


  renderModules();

}


/* ============================================================
   RENDER MODULES
   ============================================================ */

function renderModules(){

  const container =
    document.getElementById(
      "modules-list"
    );

  if(!container){
    return;
  }


  if(
    currentModules.length === 0
  ){

    container.innerHTML = `

      <div class="empty">

        <div style="font-size:42px">
          📚
        </div>

        <h3>
          Course modules are being prepared
        </h3>

        <p style="margin-top:8px">

          Learning modules will appear here
          when they are published.

        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    currentModules
      .map(
        (module,index) => {

          const lessons =
            currentLessons.filter(
              lesson =>
                String(
                  lesson.module_id
                ) ===
                String(
                  module.id
                )
            );


          const outcomes =
            Array.isArray(
              module.learning_outcomes
            )
              ? module.learning_outcomes
              : [];


          const outcomesHtml =
            outcomes
              .map(
                item => `
                  <li>
                    ${escapeHtml(item)}
                  </li>
                `
              )
              .join("");


          const lessonsHtml =
            lessons.length
              ? lessons
                  .map(
                    lesson => `

                      <div class="lesson-card">

                        <div class="lesson-top">

                          <span class="lesson-number">

                            ${escapeHtml(
                              lesson.lesson_number
                            )}

                          </span>


                          <div class="lesson-main">

                            <div class="lesson-title">

                              ${escapeHtml(
                                lesson.title ||
                                "Lesson"
                              )}

                            </div>


                            ${
                              lesson.learning_objectives
                                ? `
                                  <div class="lesson-objective">

                                    ${escapeHtml(
                                      lesson.learning_objectives
                                    )}

                                  </div>
                                `
                                : ""
                            }


                            <div class="lesson-actions">

                              <button
                                type="button"
                                class="lesson-button"
                                data-lesson-id="${escapeHtml(
                                  lesson.id
                                )}"
                                data-module-name="${escapeHtml(
                                  module.module_name
                                )}">

                                📖 Open Lesson

                              </button>

                            </div>

                          </div>

                        </div>

                      </div>

                    `
                  )
                  .join("")
              : `

                  <div class="empty">

                    Lessons are being prepared
                    for this module.

                  </div>

                `;


          return `

            <div class="module-card">

              <button
                type="button"
                class="module-header"
                data-module-index="${index}">

                <span class="module-left">

                  <span class="module-number">

                    ${escapeHtml(
                      module.module_number
                    )}

                  </span>


                  <span class="module-name">

                    ${escapeHtml(
                      module.module_name ||
                      "Module"
                    )}

                  </span>

                </span>


                <span class="module-icon">
                  +
                </span>

              </button>


              <div
                class="module-content"
                data-module-content="${index}">

                <p class="module-description">

                  ${escapeHtml(
                    module.description ||
                    "Learning material for this module."
                  )}

                </p>


                ${
                  outcomesHtml
                    ? `
                      <div class="outcomes">

                        <h3>
                          🎯 Learning Outcomes
                        </h3>

                        <ul>
                          ${outcomesHtml}
                        </ul>

                      </div>
                    `
                    : ""
                }


                <p
                  style="
                    margin-bottom:14px;
                    font-weight:700;
                    color:#53625b;
                  ">

                  📖
                  ${lessons.length}
                  ${
                    lessons.length === 1
                      ? "lesson"
                      : "lessons"
                  }

                </p>


                <div class="lesson-list">

                  ${lessonsHtml}

                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");


  setupModuleButtons();

  setupLessonButtons();

}


/* ============================================================
   MODULE BUTTONS
   ============================================================ */

function setupModuleButtons(){

  document
    .querySelectorAll(
      ".module-header"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const index =
              button.getAttribute(
                "data-module-index"
              );


            const content =
              document.querySelector(
                `[data-module-content="${index}"]`
              );


            if(!content){
              return;
            }


            const icon =
              button.querySelector(
                ".module-icon"
              );


            const open =
              content.classList.contains(
                "open"
              );


            if(open){

              content.classList.remove(
                "open"
              );

              if(icon){
                icon.textContent = "+";
              }

            }else{

              content.classList.add(
                "open"
              );

              if(icon){
                icon.textContent = "−";
              }

            }

          }
        );

      }
    );

}


/* ============================================================
   LESSON BUTTONS
   ============================================================ */

function setupLessonButtons(){

  document
    .querySelectorAll(
      ".lesson-button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            openLesson(
              button.getAttribute(
                "data-lesson-id"
              ),
              button.getAttribute(
                "data-module-name"
              )
            );

          }
        );

      }
    );

}


/* ============================================================
   OPEN LESSON
   ============================================================ */

function openLesson(
  lessonId,
  moduleName
){

  const lesson =
    currentLessons.find(
      item =>
        String(item.id) ===
        String(lessonId)
    );


  if(!lesson){

    alert(
      "Lesson could not be found."
    );

    return;

  }


  lessonTitle.textContent =
    lesson.title ||
    "Lesson";


  lessonModule.textContent =
    moduleName ||
    "Course Lesson";


  let html = "";


  if(
    lesson.content &&
    String(
      lesson.content
    ).trim() !== ""
  ){

    const content =
      String(
        lesson.content
      );


    if(
      /<[a-z][\s\S]*>/i.test(
        content
      )
    ){

      html =
        content;

    }else{

      html =
        content
          .split(/\n\s*\n/)
          .map(
            paragraph => `
              <p>
                ${escapeHtml(
                  paragraph
                ).replace(
                  /\n/g,
                  "<br>"
                )}
              </p>
            `
          )
          .join("");

    }

  }else{

    html = `

      <div class="empty">

        <div style="font-size:42px">
          📖
        </div>

        <h3>
          Learning content is being prepared
        </h3>

        <p style="margin-top:8px">

          This lesson has been created,
          but its learning material has not
          yet been added.

        </p>

      </div>

    `;

  }


  if(lesson.learning_objectives){

    html += `

      <div class="outcomes">

        <h3>
          🎯 Learning Objectives
        </h3>

        <p style="line-height:1.6">

          ${escapeHtml(
            lesson.learning_objectives
          )}

        </p>

      </div>

    `;

  }


  if(lesson.key_terms){

    html += `

      <div class="outcomes">

        <h3>
          🔑 Key Terms
        </h3>

        <p style="line-height:1.6">

          ${escapeHtml(
            lesson.key_terms
          )}

        </p>

      </div>

    `;

  }


  if(lesson.practical_activity){

    html += `

      <div class="outcomes">

        <h3>
          🛠️ Practical Activity
        </h3>

        <p style="line-height:1.6">

          ${escapeHtml(
            lesson.practical_activity
          )}

        </p>

      </div>

    `;

  }


  if(lesson.knowledge_check){

    html += `

      <div class="outcomes">

        <h3>
          ✅ Knowledge Check
        </h3>

        <p style="line-height:1.6">

          ${escapeHtml(
            lesson.knowledge_check
          )}

        </p>

      </div>

    `;

  }


  lessonContent.innerHTML =
    html;


  lessonResource.innerHTML =
    "";


  if(lesson.video_url){

    lessonResource.innerHTML += `

      <p>

        <a
          href="${escapeHtml(
            lesson.video_url
          )}"
          target="_blank"
          rel="noopener noreferrer">

          🎥 Open Lesson Video

        </a>

      </p>

    `;

  }


  if(lesson.document_url){

    lessonResource.innerHTML += `

      <p style="margin-top:10px">

        <a
          href="${escapeHtml(
            lesson.document_url
          )}"
          target="_blank"
          rel="noopener noreferrer">

          📄 Open Lesson Document

        </a>

      </p>

    `;

  }


  lessonViewer.classList.add(
    "show"
  );


  document.body.style.overflow =
    "hidden";

}


/* ============================================================
   CLOSE LESSON
   ============================================================ */

function closeLesson(){

  lessonViewer.classList.remove(
    "show"
  );

  document.body.style.overflow =
    "";

}


if(closeLessonButton){

  closeLessonButton.addEventListener(
    "click",
    closeLesson
  );

}


if(lessonViewer){

  lessonViewer.addEventListener(
    "click",
    event => {

      if(
        event.target ===
        lessonViewer
      ){

        closeLesson();

      }

    }
  );

}


document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      closeLesson();

    }

  }
);
