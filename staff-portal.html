<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funda Staff Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=staff-portal"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#17233b}.top{background:linear-gradient(135deg,#03101f,#0b315c);color:#fff;padding:20px}.top b{color:#d6b45c;font-size:11px;letter-spacing:.12em}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1dac9;border-radius:14px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric strong{display:block;font-size:20px}.metric span,.meta{font-size:11px;color:#718096}.btn{border:0;border-radius:8px;padding:9px 12px;background:#071b31;color:#efd78e;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:#071b31;border:1px solid #d9d1bf}.input,textarea{width:100%;padding:10px;border:1px solid #d9d1bf;border-radius:8px;box-sizing:border-box;margin:5px 0}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf2f7;font-size:10px;font-weight:800}.accepted,.approved,.completed{background:#e5f6ef;color:#176b50}.issued,.pending{background:#fff2d2;color:#8a5a05}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><b>FUNDA ONLINE ACADEMY</b><h2>Staff Workspace</h2><div id="who">Secure staff access</div></div><div class="wrap"><div id="app" class="card">Loading…</div></div><script>const e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let db,u,p,contracts=[],leave=[],training=[],reviews=[],access=[];async function load(){db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let g=await db.auth.getUser();u=g.data.user;if(!u){document.getElementById('app').innerHTML='<h3>Sign in required</h3><p class="meta">Use the email address that received your staff invitation.</p><input class="input" id="em" placeholder="Email"><input class="input" id="pw" type="password" placeholder="Password"><button class="btn" onclick="login()">Sign in</button>';return}let pr=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();p=pr.data;if(!p||p.role!=='staff'){document.getElementById('app').innerHTML='<h3>Staff access not available</h3><p class="meta">This workspace is for authorised staff accounts.</p>';return}document.getElementById('who').textContent=(p.full_name||p.email)+' · '+(p.staff_code||'Staff');let rs=await Promise.all([db.from('hr_contracts').select('*').eq('profile_id',u.id).order('created_at',{ascending:false}),db.from('hr_leave_requests').select('*').eq('profile_id',u.id).order('requested_at',{ascending:false}),db.from('hr_training_records').select('*').eq('profile_id',u.id).order('created_at',{ascending:false}),db.from('hr_performance_reviews').select('*').eq('profile_id',u.id).order('created_at',{ascending:false}),db.from('staff_access_assignments').select('*').eq('profile_id',u.id).eq('active',true)]);[contracts,leave,training,reviews,access]=rs.map(x=>x.data||[]);render()}async function login(){let r=await db.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(r.error)return alert(r.error.message);load()}function render(){app.innerHTML=`<div class="grid"><div class="card metric"><strong>${e(p.department||'—')}</strong><span>Department</span></div><div class="card metric"><strong>${e(p.job_title||'—')}</strong><span>Job title</span></div><div class="card metric"><strong>${contracts.filter(x=>x.status==='issued').length}</strong><span>Contracts awaiting action</span></div><div class="card metric"><strong>${access.length}</strong><span>Active access assignments</span></div></div><div class="card"><h3>My Access</h3>${access.map(a=>`<p><b>${e(a.department)}</b> · ${e(a.access_level)} ${a.can_approve?'· Approval authority':''}</p>`).join('')||'<p class="meta">No active departmental access.</p>'}</div><div class="card"><h3>Employment Contracts & Acknowledgements</h3>${contracts.map(c=>`<div class="card"><b>${e(c.contract_number)} · ${e(c.title)}</b><p class="meta">${e(c.contract_type)} · <span class="pill ${e(c.status)}">${e(c.status.toUpperCase())}</span></p><div style="white-space:pre-wrap;line-height:1.5">${e(c.body)}</div>${c.status==='issued'?`<hr><label><input type="checkbox" id="agree-${c.id}"> I confirm that I have read and accept these terms.</label><input class="input" id="sig-${c.id}" placeholder="Type your full name as digital signature"><button class="btn" onclick="acceptContract('${c.id}')">Accept & Sign</button> <button class="btn alt" onclick="declineContract('${c.id}')">Decline</button>`:c.status==='accepted'?`<p class="meta">Accepted ${e(c.accepted_at||'')} · Signature: ${e(c.typed_signature||'')}</p>`:''}</div>`).join('')||'<p class="meta">No contracts issued to you.</p>'}</div><div class="card"><h3>Leave Requests</h3><select class="input" id="lt"><option>Annual Leave</option><option>Sick Leave</option><option>Family Responsibility</option><option>Unpaid Leave</option></select><input class="input" id="ls" type="date"><input class="input" id="le" type="date"><textarea class="input" id="lr" placeholder="Reason / notes"></textarea><button class="btn" onclick="requestLeave()">Submit Leave Request</button>${leave.map(x=>`<p>${e(x.leave_type)} · ${e(x.start_date)} to ${e(x.end_date)} · <span class="pill ${e(x.status)}">${e(x.status)}</span></p>`).join('')}</div><div class="card"><h3>Training & Performance</h3>${training.map(x=>`<p><b>${e(x.training_name)}</b> · ${e(x.status)} ${x.completed_on?'· '+e(x.completed_on):''}</p>`).join('')||'<p class="meta">No training records yet.</p>'}${reviews.map(x=>`<p><b>Performance review ${e(x.review_period)}</b> · ${e(x.status)} · Rating ${e(x.rating??'—')}</p>`).join('')}</div><button class="btn alt" onclick="logout()">Sign out</button>`}async function acceptContract(id){if(!document.getElementById('agree-'+id).checked)return alert('Please confirm that you accept the contract terms.');let sig=document.getElementById('sig-'+id).value.trim();if(!sig)return alert('Type your full name as your digital signature.');let declaration='I confirm that I have read, understood and accepted this agreement electronically.';let r=await db.from('hr_contracts').update({status:'accepted',typed_signature:sig,acceptance_declaration:declaration,accepted_at:new Date().toISOString()}).eq('id',id).eq('profile_id',u.id).eq('status','issued');if(r.error)return alert(r.error.message);await db.from('hr_audit_log').insert({actor_id:u.id,action:'contract_accepted',entity_type:'hr_contract',entity_id:id,subject_profile_id:u.id,details:{typed_signature:sig,declaration}});load()}async function declineContract(id){let reason=prompt('Reason for declining this contract:');if(!reason)return;let r=await db.from('hr_contracts').update({status:'declined',declined_at:new Date().toISOString(),decline_reason:reason}).eq('id',id).eq('profile_id',u.id).eq('status','issued');if(r.error)return alert(r.error.message);load()}async function requestLeave(){if(!ls.value||!le.value)return alert('Choose the leave dates.');let r=await db.from('hr_leave_requests').insert({profile_id:u.id,leave_type:lt.value,start_date:ls.value,end_date:le.value,reason:lr.value.trim()});if(r.error)return alert(r.error.message);load()}async function logout(){await db.auth.signOut();location.reload()}load();</script></body></html>
