<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funda Certificate Template</title><script src="supabase-config.js?v=20260902-learner-center"></script><style>html,body{margin:0;background:#e8edf3;font-family:Arial,sans-serif}.note{max-width:1000px;margin:18px auto;padding:14px;background:#fff;border-radius:12px;color:#07172f}.cert{position:relative;width:1536px;height:1024px;margin:auto;background:#fff;overflow:hidden}.cert img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.field{position:absolute;text-align:center;color:#071b3e;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}.student{left:325px;top:360px;width:895px;height:66px;font-family:Georgia,'Times New Roman',serif;font-size:48px;letter-spacing:1.4px}.course{left:400px;top:478px;width:740px;height:49px;font-family:Georgia,'Times New Roman',serif;font-size:34px;letter-spacing:.7px}.certno{left:260px;top:745px;width:190px;height:26px;font-size:11.5px}.learnerno{left:493px;top:745px;width:150px;height:26px;font-size:12px}.issue{left:895px;top:745px;width:190px;height:26px;font-size:12px}.duration{left:1142px;top:745px;width:118px;height:26px;font-size:12px}.date2{left:870px;top:870px;width:230px;height:30px;font-family:Georgia,'Times New Roman',serif;font-size:16px}.mask{display:none}@media(max-width:1536px){.cert{transform-origin:top left}}@media print{body{background:#fff}.note{display:none}@page{size:landscape;margin:0}}</style></head><body><div class="note"><b>Funda Certificate Template FOA-CERT-1.0</b> — locked approved artwork. Only student name, course title, certificate number, learner number, issue date and duration may change.</div><div class="cert" id="certificate"><img id="art" alt="Approved Funda certificate artwork"><div class="field student" id="student"></div><div class="field course" id="course"></div><div class="field certno" id="certno"></div><div class="field learnerno" id="learnerno"></div><div class="field issue" id="issue"></div><div class="field duration" id="duration"></div><div class="field date2" id="date2"></div></div><script>const q=new URLSearchParams(location.search),set=(id,v)=>document.getElementById(id).textContent=v||'',course=v=>String(v||'').replace(/\s*[—-]\s*(Advanced\s+)?Professional\s+(Practical\s+Skills\s+|Skills\s+)?Short\s+Course\s*$/i,'').replace(/\s*[—-]\s*Practical\s+Skills\s+Short\s+Course\s*$/i,'').trim();set('student',(q.get('student')||'').toUpperCase());set('course',course(q.get('course')).toUpperCase());set('certno',q.get('certificate'));set('learnerno',q.get('learner'));set('issue',(q.get('date')||'').toUpperCase());set('date2',(q.get('date')||'').toUpperCase());set('duration',(q.get('duration')||'').toUpperCase());function fit(id,min,max){let e=document.getElementById(id),size=max;e.style.fontSize=size+'px';while(e.scrollWidth>e.clientWidth&&size>min){size-=.5;e.style.fontSize=size+'px'}}fit('student',30,48);fit('course',20,34);fit('certno',7.5,11.5);fit('learnerno',7.5,12);fit('issue',8.5,12);fit('duration',8.5,12);fit('date2',11,16);document.getElementById('art').src=`${SUPABASE_URL}/storage/v1/object/public/certificate-assets/approved-master.png?v=20260902-learner-center`;document.getElementById('art').onerror=()=>{document.querySelector('.note').innerHTML='<b>Approved master artwork has not been uploaded yet.</b> Open the Admin Certificate Studio and upload the exact approved certificate image.'};function scale(){let c=document.getElementById('certificate'),w=Math.min(innerWidth,1536);if(innerWidth<1536){let s=w/1536;c.style.transform='scale('+s+')';c.style.marginBottom=-(1024*(1-s))+'px'}else{c.style.transform='none';c.style.marginBottom='0'}}addEventListener('resize',scale);scale();</script></body></html>
