<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funda Certificate Template</title><style>html,body{margin:0;background:#e8edf3;font-family:Arial,sans-serif}.note{max-width:1000px;margin:18px auto;padding:14px;background:#fff;border-radius:12px;color:#07172f}.cert{position:relative;width:1536px;height:1024px;margin:auto;background:#fff;overflow:hidden}.cert img{position:absolute;inset:0;width:100%;height:100%}.field{position:absolute;text-align:center;color:#061a3b;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap}.student{left:325px;top:355px;width:895px;height:74px;font-family:Georgia,serif;font-size:58px;letter-spacing:3px}.course{left:410px;top:475px;width:720px;height:58px;font-family:Georgia,serif;font-size:48px;letter-spacing:2px}.certno{left:255px;top:744px;width:205px;height:30px;font-size:16px}.learnerno{left:480px;top:744px;width:175px;height:30px;font-size:16px}.issue{left:900px;top:744px;width:175px;height:30px;font-size:16px}.duration{left:1150px;top:744px;width:135px;height:30px;font-size:16px}.date2{left:870px;top:866px;width:225px;height:32px;font-family:Georgia,serif;font-size:18px}.mask{position:absolute;background:#fff}.mstudent{left:320px;top:360px;width:910px;height:65px}.mcourse{left:410px;top:480px;width:735px;height:50px}.mcert{left:265px;top:747px;width:190px;height:24px}.mlearner{left:485px;top:747px;width:170px;height:24px}.missue{left:900px;top:747px;width:180px;height:24px}.mduration{left:1150px;top:747px;width:140px;height:24px}.mdate2{left:870px;top:866px;width:225px;height:28px}@media print{body{background:#fff}.note{display:none}.cert{width:100vw;height:66.6667vw;max-height:100vh;max-width:150vh}.cert>*{transform-origin:top left} @page{size:landscape;margin:0}}</style></head><body><div class="note"><b>Funda Certificate Template v1</b> — locked artwork test. Only learner name, course, certificate number, learner number, issue date and duration are variable. Use Print → Save as PDF for this first system test.</div><div class="cert" id="certificate"><img id="art" alt="Approved Funda certificate artwork"><div class="mask mstudent"></div><div class="mask mcourse"></div><div class="mask mcert"></div><div class="mask mlearner"></div><div class="mask missue"></div><div class="mask mduration"></div><div class="mask mdate2"></div><div class="field student" id="student"></div><div class="field course" id="course"></div><div class="field certno" id="certno"></div><div class="field learnerno" id="learnerno"></div><div class="field issue" id="issue"></div><div class="field duration" id="duration"></div><div class="field date2" id="date2"></div></div><script>const q=new URLSearchParams(location.search),set=(id,v)=>document.getElementById(id).textContent=v||'';set('student',q.get('student')||'STUDENT NAME SURNAME');set('course',q.get('course')||'COURSE NAME');set('certno',q.get('certificate')||'CERTIFICATE NUMBER');set('learnerno',q.get('learner')||'LEARNER NUMBER');set('issue',q.get('date')||'DATE OF ISSUE');set('date2',q.get('date')||'DATE OF ISSUE');set('duration',q.get('duration')||'DURATION');function fit(id,min){let e=document.getElementById(id),max=parseFloat(getComputedStyle(e).fontSize);while(e.scrollWidth>e.clientWidth&&max>min){max-=1;e.style.fontSize=max+'px'}}fit('student',34);fit('course',28);/* Approved artwork is intentionally loaded separately so it remains immutable and can be replaced only by an approved master asset. */document.getElementById('art').src='certificate-template-v1.png';</script></body></html>
