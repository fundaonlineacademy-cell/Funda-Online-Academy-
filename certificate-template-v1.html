<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funda Certificate Template</title><script src="supabase-config.js?v=20260902-certificate-template"></script><style>html,body{margin:0;background:#e8edf3;font-family:Arial,sans-serif}.note{max-width:1000px;margin:18px auto;padding:14px;background:#fff;border-radius:12px;color:#07172f}.cert{position:relative;width:1536px;height:1024px;margin:auto;background:#f3f3f3;overflow:hidden}.cert img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.field{position:absolute;text-align:center;color:#071b3e;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap}.student{left:325px;top:361px;width:890px;height:64px;font-family:Georgia,'Times New Roman',serif;font-size:58px;letter-spacing:2.5px}.course{left:410px;top:480px;width:720px;height:48px;font-family:Georgia,'Times New Roman',serif;font-size:48px;letter-spacing:1.4px}.certno{left:260px;top:747px;width:198px;height:23px;font-size:16px}.learnerno{left:480px;top:747px;width:180px;height:23px;font-size:16px}.issue{left:895px;top:747px;width:190px;height:23px;font-size:16px}.duration{left:1145px;top:747px;width:150px;height:23px;font-size:16px}.date2{left:868px;top:871px;width:235px;height:29px;font-family:Georgia,'Times New Roman',serif;font-size:18px}.mask{position:absolute;background:#f3f3f3}.mstudent{left:320px;top:360px;width:910px;height:61px}.mcourse{left:407px;top:480px;width:735px;height:45px}.mcert{left:260px;top:747px;width:198px;height:23px}.mlearner{left:480px;top:747px;width:180px;height:23px}.missue{left:895px;top:747px;width:190px;height:23px}.mduration{left:1145px;top:747px;width:150px;height:23px}.mdate2{left:868px;top:871px;width:235px;height:29px}@media print{body{background:#fff}.note{display:none}@page{size:landscape;margin:0}}</style></head><body><div class="note"><b>Funda Certificate Template FOA-CERT-1.0</b> — locked approved artwork. Only student name, course title, certificate number, learner number, issue date and duration may change.</div><div class="cert" id="certificate"><img id="art" alt="Approved Funda certificate artwork"><div class="mask mstudent"></div><div class="mask mcourse"></div><div class="mask mcert"></div><div class="mask mlearner"></div><div class="mask missue"></div><div class="mask mduration"></div><div class="mask mdate2"></div><div class="field student" id="student"></div><div class="field course" id="course"></div><div class="field certno" id="certno"></div><div class="field learnerno" id="learnerno"></div><div class="field issue" id="issue"></div><div class="field duration" id="duration"></div><div class="field date2" id="date2"></div></div><script>const q=new URLSearchParams(location.search),set=(id,v)=>document.getElementById(id).textContent=v||'',course=v=>String(v||'').replace(/\s*[—-]\s*(Advanced\s+)?Professional\s+(Practical\s+Skills\s+|Skills\s+)?Short\s+Course\s*$/i,'').replace(/\s*[—-]\s*Practical\s+Skills\s+Short\s+Course\s*$/i,'').trim();set('student',(q.get('student')||'').toUpperCase());set('course',course(q.get('course')).toUpperCase());set('certno',q.get('certificate'));set('learnerno',q.get('learner'));set('issue',(q.get('date')||'').toUpperCase());set('date2',(q.get('date')||'').toUpperCase());set('duration',(q.get('duration')||'').toUpperCase());function fit(id,min){let e=document.getElementById(id),size=parseFloat(getComputedStyle(e).fontSize);while(e.scrollWidth>e.clientWidth&&size>min){size-=1;e.style.fontSize=size+'px'}}fit('student',34);fit('course',27);document.getElementById('art').src=`${SUPABASE_URL}/storage/v1/object/public/certificate-assets/approved-master.png`;document.getElementById('art').onerror=()=>{document.querySelector('.note').innerHTML='<b>Approved master artwork has not been uploaded yet.</b> Open the Admin Certificate Studio and upload the exact approved certificate image.'};</script></body></html>
