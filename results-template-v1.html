">▤</span><b>Page</b><span>${p} of ${t}</span></div></div></div>`}function table(gs){return`<div class="card academic"><div class="bar">ACADEMIC RESULTS</div><table class="atable"><thead><tr><th style="width:31%">MODULE</th><th style="width:30%">ASSESSMENT TYPE</th><th style="width:17%">MARK (%)</th><th style="width:22%">OUTCOME</th></tr></thead><tbody>${gs.map(g=>`<tr><td class="module">${g.number?'Module '+esc(g.number)+':':''}<small>${esc(g.name)}</small></td><td class="lines">${g.items.map(x=>`<div>${esc(x.type||x.assessment_type||x.assessment_title||'Assessment')}</div>`).join('')}</td><td class="lines">${g.items.map(x=>`<div>${x.mark==null&&x.percentage==null?'—':Number(x.mark??x.percentage).toFixed(1)+'%'}</div>`).join('')}</td><td class="lines">${g.items.map(x=>`<div>${esc(x.outcome||((x.passed===true)?'Competent':(x.passed===false?'Not Yet Competent':'—')))}</div>`).join('')}</td></tr>`).join('')}</tbody></table></div>`}function award(){return`<svg viewBox="0 0 200 170" aria-hidden="true"><path d="M45 135 C15 105 10 62 30 28 M155 135 C185 105 190 62 170 28" fill="none" stroke="#c89b33" stroke-width="9" stroke-linecap="round"/><g fill="#c89b33"><ellipse cx="35" cy="115" rx="9" ry="18" transform="rotate(-45 35 115)"/><ellipse cx="26" cy="92" rx="9" ry="18" transform="rotate(-35 26 92)"/><ellipse cx="25" cy="67" rx="9" ry="18" transform="rotate(-20 25 67)"/><ellipse cx="35" cy="43" rx="9" ry="18" transform="rotate(-5 35 43)"/><ellipse cx="165" cy="115" rx="9" ry="18" transform="rotate(45 165 115)"/><ellipse cx="174" cy="92" rx="9" ry="18" transform="rotate(35 174 92)"/><ellipse cx="175" cy="67" rx="9" ry="18" transform="rotate(20 175 67)"/><ellipse cx="165" cy="43" rx="9" ry="18" transform="rotate(5 165 43)"/><polygon points="100,108 106,122 121,123 109,132 113,147 100,138 87,147 91,132 79,123 94,122"/></g><g fill="#08305f"><polygon points="100,28 145,48 100,69 55,48"/><path d="M72 59v25c18 12 38 12 56 0V59l-28 13z"/><rect x="142" y="49" width="4" height="34"/><circle cx="144" cy="86" r="5"/></g></svg>`}function final(d){let cpd=d.cpd!==''&&d.cpd!=null,cert=d.certificate_number&&d.certificate_issued;return`<div class="finalbox"><div class="bar">FINAL ACADEMIC OUTCOME</div><div class="finalgrid"><div class="award">${award()}</div><div class="frows"><div class="frow"><span class="fi">▥</span><b>Overall Result</b><span>:</span><strong>${esc(d.overall||'—')}${String(d.overall||'').includes('%')?'':'%'}</strong></div><div class="frow"><span class="fi">◉</span><b>Outcome</b><span>:</span><strong>${esc(d.outcome||'—')}</strong></div><div class="frow"><span class="fi">✓</span><b>Course Status</b><span>:</span><strong>${esc(d.course_status||'COMPLETED')}</strong></div>${cpd?`<div class="frow"><span class="fi">◷</span><b>CPD Hours / Points</b><span>:</span><strong>${esc(d.hours||d.cpd)} Hours / ${esc(d.cpd)} Points</strong></div>`:(d.hours?`<div class="frow"><span class="fi">◷</span><b>Learning Hours</b><span>:</span><strong>${esc(d.hours)} Hours</strong></div>`:'')}${cert?`<div class="frow"><span class="fi">▤</span><b>Certificate No. (Issued)</b><span>:</span><strong>${esc(d.certificate_number)}</strong></div>`:''}</div></div></div>`}function bottom(d){return`<div class="bottom"><div class="authcard"><div class="bar">AUTHENTICATION</div><div class="authbody"><div class="sigline"><img src="${sig()}" alt="Academic Director signature"></div><b>Mr. A. Futhe</b><div>Academic Director<br>Funda Online Academy<br>${esc(d.issued||'')}</div></div></div><div class="officialtext"><div>This Statement of Results is generated from the official academic records of <b>Funda Online Academy.</b></div><div class="seal"><img src="${logo()}" alt=""></div></div><div class="verifycard"><div class="bar">VERIFY THIS RESULT</div><div class="verifybody"><img class="qrimg" src="${QR}" alt="Verification QR code"><p>Scan QR Code<br>or visit</p><div class="verifyurl">${VERIFY_URL}</div><p><b>Enter Results Number</b><br>(as shown on this Statement)</p><div class="numberbox">Enter your Results Number</div></div></div></div>`}function page(d,gs,n,total,first,last){return`<section class="result-page ${first?'':'continuation'}"><div class="curve tl"></div><div class="curve tr"></div><div class="curve bl"></div><div class="curve br"></div>${d.test?'<div class="testmark">TEST / NON-OFFICIAL</div>':''}<div class="inner">${d.test?'<div class="testbanner">CONTROLLED SYSTEM TEST • NOT AN OFFICIAL ACADEMIC RECORD</div>':''}${head(d,n,total,!first)}${first?`<img class="watermark" src="${logo()}" alt=""><div class="section pair"><div class="card"><div class="bar">LEARNER DETAILS</div><div class="rows">${detail('●','Learner Name',d.name)}${detail('▣','Learner Number',d.learner)}${detail('★','ID / Passport No.',d.id_number||'—')}</div></div><div class="card"><div class="bar">COURSE DETAILS</div><div class="rows">${detail('▤','Course Title',d.course)}${detail('◷','Course Duration',d.duration)}${detail('▦','Completion Date',d.completion)}${detail('▰','Mode of Delivery','Fully Online')}</div></div></div>`:''}${table(gs)}${last?final(d)+bottom(d):''}</div><div class="footer">This document is confidential and issued without alteration.<br>Any tampering or alteration will invalidate this Statement of Results.</div></section>`}function paginate(gs){if(gs.length<=6)return[gs];let chunks=[gs.slice(0,6)],rest=gs.slice(6);while(rest.length>6){let take=Math.min(10,rest.length-6);chunks.push(rest.slice(0,take));rest=rest.slice(take)}if(rest.length)chunks.push(rest);return chunks}window.renderFundaResult=function(d={}){let gs=groupAssessments(d.assessments),chunks=paginate(gs),root=document.getElementById('statement');root.innerHTML=chunks.map((g,i)=>page(d,g,i+1,chunks.length,i===0,i===chunks.length-1)).join('')};const p=new URLSearchParams(location.search);if(!p.has('embedded')){let a=[];try{a=JSON.parse(p.get('assessments')||'[]')}catch(e){}window.renderFundaResult({test:p.get('test')==='1',name:p.get('name')||'XXXXX XXXXX',learner:p.get('learner')
