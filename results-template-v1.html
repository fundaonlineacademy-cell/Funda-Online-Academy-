<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Official Statement of Results | Funda Online Academy</title><script src="funda-official-brand-assets.js?v=20260903"></script><script src="funda-official-signature.js?v=20260903"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><style>@page{size:A4;margin:0}*{box-sizing:border-box}html,body{margin:0;background:#e8edf4;font-family:Arial,Helvetica,sans-serif;color:#102747}.statement{padding:8mm 0}.result-page{width:210mm;height:297mm;margin:0 auto 8mm;background:#fff;position:relative;overflow:hidden;box-shadow:0 12px 34px #07172f22;padding:12mm 9mm 13mm}.curve{position:absolute;z-index:0;pointer-events:none}.curve.tl{left:-27mm;top:-38mm;width:95mm;height:65mm;background:#062c59;border-radius:0 0 70% 0;transform:rotate(-8deg);box-shadow:0 3mm 0 #caa23d}.curve.tr{right:-30mm;top:-41mm;width:100mm;height:65mm;background:#caa23d;border-radius:0 0 0 70%;transform:rotate(8deg)}.curve.br{right:-31mm;bottom:-39mm;width:102mm;height:61mm;background:#062c59;border-radius:70% 0 0 0;transform:rotate(-7deg);box-shadow:0 -3mm 0 #caa23d}.curve.bl{left:-31mm;bottom:-41mm;width:100mm;height:61mm;background:#caa23d;border-radius:0 70% 0 0;transform:rotate(7deg)}.inner{position:relative;z-index:2;height:100%}.testbanner{display:none;background:#fff0f0;border:1px solid #e7b8b8;color:#9d2020;text-align:center;font-size:7pt;font-weight:900;letter-spacing:.11em;padding:1.4mm;margin-bottom:2.5mm}.testmark{display:none;position:absolute;z-index:8;top:130mm;left:-18mm;right:-18mm;text-align:center;transform:rotate(-28deg);font-size:34pt;font-weight:900;color:#b32626;opacity:.11;pointer-events:none}.head{display:grid;grid-template-columns:48mm 1fr 57mm;gap:5mm;align-items:center;margin-top:2mm}.brandbox{text-align:center}.brandbox img{width:40mm;height:32mm;object-fit:contain}.title{text-align:center;color:#082d5a}.title h1{font-family:Georgia,'Times New Roman',serif;font-size:17.5pt;line-height:1.08;margin:0;font-weight:800}.title .rule{height:.45mm;width:54mm;margin:3mm auto 2mm;background:linear-gradient(90deg,transparent,#c69b32 20%,#c69b32 80%,transparent);position:relative}.title .rule:after{content:"";position:absolute;width:2mm;height:2mm;border-radius:50%;background:#c69b32;left:26mm;top:-.75mm}.title p{margin:0;color:#153a68;font-size:8pt;font-weight:800;letter-spacing:.06em}.meta{border:.3mm solid #d9c68e;border-radius:2mm;padding:2mm 3mm;background:#fffdf8;font-size:7.2pt}.meta .mrow{display:grid;grid-template-columns:5mm 22mm 1fr;gap:1.5mm;align-items:center;padding:1.5mm 0;border-bottom:.2mm solid #eadfbd}.meta .mrow:last-child{border-bottom:0}.ico{color:#bd8d1e;font-size:10pt;text-align:center}.meta b{color:#193553}.section{margin-top:5mm}.pair{display:grid;grid-template-columns:1fr 1.09fr;gap:7mm}.card{border:.3mm solid #d7c58e;border-radius:1.5mm;overflow:hidden;background:#fff}.bar{background:linear-gradient(90deg,#062b58,#0b3b72);color:#fff;text-align:center;font-size:8.7pt;font-weight:800;letter-spacing:.035em;padding:1.7mm 2mm}.rows{padding:1mm 3mm}.drow{display:grid;grid-template-columns:7mm 31mm 3mm 1fr;align-items:center;min-height:8.2mm;border-bottom:.2mm solid #eadfbd;font-size:7.7pt}.drow:last-child{border-bottom:0}.drow .di{color:#bf8e1d;font-size:10pt;text-align:center}.drow .dl{font-weight:700;color:#263d5b}.drow .sep{font-weight:900}.drow .dv{font-weight:700;color:#102747;line-height:1.25}.watermark{position:absolute;z-index:0;width:92mm;height:80mm;object-fit:contain;opacity:.025;left:59mm;top:112mm}.academic{margin-top:5mm}.academic .bar{text-align:center}.atable{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7pt}.atable th{padding:1.8mm 2mm;background:#fff;color:#183353;border:.2mm solid #d8c78e;text-align:center;font-size:7.2pt}.atable td{padding:1.55mm 2mm;border:.2mm solid #d8c78e;vertical-align:middle;line-height:1.28}.atable td:nth-child(3),.atable td:nth-child(4){text-align:center;font-weight:700}.module{font-weight:800;color:#14345b}.module small{display:block;font-weight:600;color:#263d5b;margin-top:.5mm}.lines div+div{margin-top:1.3mm;padding-top:1.3mm;border-top:.2mm solid #eee4c8}.finalbox{margin-top:5mm;border:.3mm solid #d7c58e;border-radius:1.5mm;overflow:hidden}.finalgrid{display:grid;grid-template-columns:55mm 1fr;min-height:42mm}.award{display:flex;align-items:center;justify-content:center;border-right:.2mm solid #eadfbd}.awardmark{width:33mm;height:33mm;border:1.4mm solid #c69b32;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0a315f;font-size:20pt;position:relative}.awardmark:before,.awardmark:after{content:"";position:absolute;width:10mm;height:18mm;border:1.2mm solid #c69b32;border-top:0;top:9mm}.awardmark:before{left:-7mm;border-right:0;border-radius:0 0 0 10mm;transform:rotate(12deg)}.awardmark:after{right:-7mm;border-left:0;border-radius:0 0 10mm 0;transform:rotate(-12deg)}.frows{padding:1.5mm 4mm}.frow{display:grid;grid-template-columns:8mm 46mm 4mm 1fr;align-items:center;min-height:7.2mm;border-bottom:.2mm solid #eadfbd;font-size:7.8pt}.frow:last-child{border-bottom:0}.frow .fi{color:#bf8e1d;font-size:10pt;text-align:center}.frow b{color:#243b59}.frow strong{font-size:9.5pt;color:#0b2f5d}.bottom{display:grid;grid-template-columns:62mm 1fr 62mm;gap:7mm;align-items:stretch;margin-top:5mm}.authcard,.verifycard{border:.3mm solid #d7c58e;border-radius:1.5mm;overflow:hidden;background:#fff}.authbody{padding:3mm 5mm 2.5mm}.sig{height:17mm;display:flex;align-items:end;border-bottom:.35mm solid #c69b32}.sig img{max-height:16mm;max-width:47mm;object-fit:contain;object-position:left bottom}.authbody b{display:block;margin-top:1.7mm;font-size:8.7pt;color:#14345b}.authbody div{font-size:7.4pt;line-height:1.45;color:#243b59}.officialtext{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2mm;font-size:8pt;line-height:1.45;color:#1c3b65}.officialtext img{width:22mm;height:18mm;object-fit:contain;opacity:.16;margin-top:2mm}.verifybody{padding:2mm 3mm;text-align:center}.qr{width:24mm;height:24mm;margin:0 auto 1.5mm;display:flex;align-items:center;justify-content:center}.qr canvas{max-width:24mm!important;max-height:24mm!important}.verifybody p{font-size:6.8pt;line-height:1.25;margin:1mm 0;color:#27415f}.numberbox{background:#082f5e;color:#fff;border-radius:1.5mm;padding:2mm 1.5mm;font-size:7pt;font-weight:800;word-break:break-word}.footer{position:absolute;z-index:4;left:13mm;right:13mm;bottom:5mm;background:#072e5b;color:#fff;text-align:center;border-radius:8mm 8mm 0 0;padding:2mm 8mm;font-size:6.4pt;line-height:1.3}.pagecount{font-weight:800}.continuation .head{grid-template-columns:45mm 1fr 53mm}.continuation .pair{display:none}.continuation .academic{margin-top:10mm}.continuation .title h1{font-size:15pt}@media print{body{background:#fff}.statement{padding:0}.result-page{margin:0;box-shadow:none;page-break-after:always}.result-page:last-child{page-break-after:auto}}</style></head><body><main id="statement" class="statement"></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const logo=()=>String(window.FUNDA_OFFICIAL_LOGO||'').replace(/\s/g,'');const sig=()=>window.FUNDA_ACADEMIC_DIRECTOR_SIGNATURE||'';function groupAssessments(a){const m=new Map();(Array.isArray(a)?a:[]).forEach((x,i)=>{let k=x.module_id||x.module_number||x.module||('x'+i),g=m.get(k);if(!g){g={number:x.module_number||'',name:x.module||x.module_name||'Assessment',items:[]};m.set(k,g)}g.items.push(x)});return [...m.values()]}function detail(icon,label,value){return `<div class="drow"><span class="di">${icon}</span><span class="dl">${label}</span><span class="sep">:</span><span class="dv">${esc(value||'—')}</span></div>`}function head(d,page,total,cont=false){return `<div class="head"><div class="brandbox"><img src="${logo()}" alt="Funda Online Academy"></div><div class="title"><h1>${cont?'OFFICIAL STATEMENT':'OFFICIAL<br>STATEMENT OF RESULTS'}</h1><div class="rule"></div><p>${cont?'OF RESULTS — CONTINUED':'ACADEMIC RECORD OF ACHIEVEMENT'}</p></div><div class="meta"><div class="mrow"><span class="ico">▣</span><b>Results No.</b><span>${esc(d.result||'—')}</span></div><div class="mrow"><span class="ico">▦</span><b>Issue Date</b><span>${esc(d.issued||'—')}</span></div><div class="mrow"><span class="ico">◉</span><b>Status</b><span>${d.test?'TEST':'FINAL'}</span></div><div class="mrow"><span class="ico">▤</span><b>Page</b><span class="pagecount">${page} of ${total}</span></div></div></div>`}function table(groups){return `<div class="card academic"><div class="bar">ACADEMIC RESULTS</div><table class="atable"><thead><tr><th style="width:31%">MODULE</th><th style="width:30%">ASSESSMENT TYPE</th><th style="width:17%">MARK (%)</th><th style="width:22%">OUTCOME</th></tr></thead><tbody>${groups.map(g=>`<tr><td class="module">${g.number?'Module '+esc(g.number)+':':''}<small>${esc(g.name)}</small></td><td class="lines">${g.items.map(x=>`<div>${esc(x.type||x.assessment_type||x.assessment_title||'Assessment')}</div>`).join('')}</td><td class="lines">${g.items.map(x=>`<div>${x.mark==null&&x.percentage==null?'—':Number(x.mark??x.percentage).toFixed(1)+'%'}</div>`).join('')}</td><td class="lines">${g.items.map(x=>`<div>${esc(x.outcome||((x.passed===true)?'Competent':(x.passed===false?'Not Yet Competent':'—')))}</div>`).join('')}</td></tr>`).join('')}</tbody></table></div>`}function final(d){let cpd=d.cpd!==''&&d.cpd!=null;let cert=d.certificate_number&&d.certificate_issued;return `<div class="finalbox"><div class="bar">FINAL ACADEMIC OUTCOME</div><div class="finalgrid"><div class="award"><div class="awardmark">◆</div></div><div class="frows"><div class="frow"><span class="fi">▥</span><b>Overall Result</b><span>:</span><strong>${esc(d.overall||'—')}${String(d.overall||'').includes('%')?'':'%'}</strong></div><div class="frow"><span class="fi">◉</span><b>Outcome</b><span>:</span><strong>${esc(d.outcome||'—')}</strong></div><div class="frow"><span class="fi">✓</span><b>Course Status</b><span>:</span><strong>${esc(d.course_status||'COMPLETED')}</strong></div>${cpd?`<div class="frow"><span class="fi">◷</span><b>CPD Hours / Points</b><span>:</span><strong>${esc(d.hours||d.cpd)} Hours / ${esc(d.cpd)} Points</strong></div>`:(d.hours?`<div class="frow"><span class="fi">◷</span><b>Learning Hours</b><span>:</span><strong>${esc(d.hours)} Hours</strong></div>`:'')}${cert?`<div class="frow"><span class="fi">▤</span><b>Certificate No. (Issued)</b><span>:</span><strong>${esc(d.certificate_number)}</strong></div>`:''}</div></div></div>`}function bottom(d){return `<div class="bottom"><div class="authcard"><div class="bar">AUTHENTICATION</div><div class="authbody"><div class="sig"><img src="${sig()}" alt="Academic Director signature"></div><b>Mr. A. Futhe</b><div>Academic Director<br>Funda Online Academy<br>${esc(d.issued||'')}</div></div></div><div class="officialtext"><div>This Statement of Results is generated from the official academic records of <b>Funda Online Academy.</b></div><img src="${logo()}" alt=""></div><div class="verifycard"><div class="bar">VERIFY THIS RESULT</div><div class="verifybody"><div class="qr"></div><p>${d.test?'Controlled system test — not publicly valid.':'Scan the QR code or use the Results Number on the Academy verification portal.'}</p><div class="numberbox">${esc(d.result||'—')}</div></div></div></div>`}function page(d,groups,pageNo,total,first,last){return `<section class="result-page ${first?'':'continuation'}"><div class="curve tl"></div><div class="curve tr"></div><div class="curve bl"></div><div class="curve br"></div>${d.test?'<div class="testmark" style="display:block">TEST / NON-OFFICIAL</div>':''}<div class="inner">${d.test?'<div class="testbanner" style="display:block">CONTROLLED SYSTEM TEST • NOT AN OFFICIAL ACADEMIC RECORD</div>':''}${head(d,pageNo,total,!first)}${first?`<img class="watermark" src="${logo()}" alt=""><div class="section pair"><div class="card"><div class="bar">LEARNER DETAILS</div><div class="rows">${detail('●','Learner Name',d.name)}${detail('▣','Learner Number',d.learner)}${detail('◉','ID / Passport No.',d.id_number||'—')}</div></div><div class="card"><div class="bar">COURSE DETAILS</div><div class="rows">${detail('▤','Course Title',d.course)}${detail('◷','Course Duration',d.duration)}${detail('▦','Completion Date',d.completion)}${detail('▰','Mode of Delivery','Fully Online')}</div></div></div>`:''}${table(groups)}${last?final(d)+bottom(d):''}</div><div class="footer">This document is confidential and issued without alteration.<br>Any tampering or alteration will invalidate this Statement of Results.</div></section>`}window.renderFundaResult=function(d={}){let groups=groupAssessments(d.assessments),chunks=[];if(groups.length<=10)chunks=[groups];else{chunks.push(groups.slice(0,9));for(let i=9;i<groups.length;i+=12)chunks.push(groups.slice(i,i+12))}let total=chunks.length,root=document.getElementById('statement');root.innerHTML=chunks.map((g,i)=>page(d,g,i+1,total,i===0,i===total-1)).join('');setTimeout(()=>{document.querySelectorAll('.result-page').forEach(pg=>{let q=pg.querySelector('.qr');if(!q)return;let value=d.test?'https://fundaonlineacademy.co.za/certificate-info.html':`https://fundaonlineacademy.co.za/certificate-info.html?result=${encodeURIComponent(d.result||'')}`;if(window.QRCode)QRCode.toCanvas(value,{width:120,margin:0,errorCorrectionLevel:'M'},(e,c)=>{if(!e){q.innerHTML='';q.appendChild(c)}})})},50)};const p=new URLSearchParams(location.search);if(!p.has('embedded')){let a=[];try{a=JSON.parse(p.get('assessments')||'[]')}catch(e){}window.renderFundaResult({test:p.get('test')==='1',name:p.get('name')||'XXXXX XXXXX',learner:p.get('learner')||'FOA-LN-XXXX',id_number:p.get('id')||'XXXXXXXXXXXXX',course:p.get('course')||'XXXXXXXXXXXXXXXX',duration:p.get('duration')||'X Weeks',completion:p.get('completion')||'XX XXXXX XXXX',result:p.get('result')||'FOA-RES-XXXXXX',issued:p.get('issued')||'XX XXXXX XXXX',overall:p.get('overall')||'XX',outcome:p.get('outcome')||'COMPETENT',hours:p.get('hours')||'',cpd:p.get('cpd')||'',assessments:a})}</script></body></html>
