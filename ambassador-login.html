<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambassador Login | Funda Online Academy</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#21384d,#46677f);min-height:100vh;display:grid;place-items:center;padding:20px;color:#21384d}.box{width:min(460px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 70px #0004}.logo{font-weight:900;font-size:20px}.logo span{color:#c99a2e}h1{margin:22px 0 8px}.muted{color:#667583;font-size:13px;line-height:1.6}.field{width:100%;padding:13px;border:1px solid #d7dce1;border-radius:12px;margin-top:11px}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;background:#21384d;color:#fff;margin-top:14px;cursor:pointer}.gold{background:#c99a2e;color:#21384d}.msg{font-size:12px;margin-top:12px}.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:12px}.links a{color:#21384d;font-weight:700}</style></head><body><main class="box"><div class="logo">FUNDA <span>ONLINE ACADEMY</span></div><h1>Ambassador Login</h1><p class="muted">This secure login is only for approved Funda Brand Ambassadors. Student and staff accounts use their own separate login areas.</p><form id="form"><input id="email" class="field" type="email" required placeholder="Ambassador email"><input id="password" class="field" type="password" required placeholder="Password"><button id="submit" class="btn">Sign in to Ambassador Portal</button><div id="msg" class="msg"></div></form><div class="links"><a href="ambassadors.html#apply">Apply to become an Ambassador</a><a href="index.html">Return to website</a></div></main><script>(()=>{let db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);$('form').onsubmit=async e=>{e.preventDefault();let b=$('submit');b.disabled=true;b.textContent='Signing in…';$('msg').textContent='';let r=await db.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(r.error){$('msg').textContent='Unable to sign in. Check your ambassador email and password.';b.disabled=false;b.textContent='Sign in to Ambassador Portal';return}let a=await db.from('ambassador_programme_applications').select('status,account_status,agreement_status').eq('email',$('email').value.trim().toLowerCase()).maybeSingle();if(a.error||!a.data||a.data.status!=='approved'||a.data.agreement_status!=='accepted'||!['introductory','active'].includes(a.data.account_status)){await db.auth.signOut();$('msg').textContent='Your Ambassador Portal is not active yet. Please complete the agreement and account activation steps first.';b.disabled=false;b.textContent='Sign in to Ambassador Portal';return}location.href='ambassador-portal-v2.html'};})();</script></body></html>
