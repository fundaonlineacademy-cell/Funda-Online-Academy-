<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="5;url=verify.html">
<link rel="canonical" href="verify.html">
<title>Academic Document Verification | Funda Online Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Source Sans 3",sans-serif;background:linear-gradient(145deg,#eef1f0,#fff5df);color:#243750}.card{max-width:620px;width:100%;background:#fff;border:1px solid #e0d6be;border-radius:22px;padding:28px;box-shadow:0 18px 45px #17365d18;text-align:center}.logo{width:64px;height:64px;object-fit:contain}.eyebrow{margin-top:12px;font-size:10px;letter-spacing:.15em;font-weight:800;color:#a87818}h1{margin:8px 0 10px;color:#21384d;font-size:28px}p{line-height:1.65;color:#657383}.btn{display:inline-block;margin-top:8px;border-radius:12px;background:#21384d;color:#fff;text-decoration:none;font-weight:800;padding:12px 18px}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="logo.png" alt="Funda Online Academy">
  <div class="eyebrow">OFFICIAL ACADEMIC VERIFICATION</div>
  <h1>Opening the Academy verification service</h1>
  <p>This legacy verification address now uses Funda Online Academy's single academic document verification service. Your document number will be carried across automatically.</p>
  <a id="continueLink" class="btn" href="verify.html">Continue to Verification</a>
  <noscript><p>JavaScript is disabled. Select the button above and enter the document number on the verification page.</p></noscript>
</main>
<script>
(()=>{
  const query = new URLSearchParams(location.search);
  let type = query.get('type') === 'transcript' || query.get('type') === 'results' ? 'transcript' : 'certificate';
  let code = (query.get('code') || '').trim();

  if(!code && query.get('result')){
    type = 'transcript';
    code = query.get('result').trim();
  }
  if(!code && query.get('certificate')){
    type = 'certificate';
    code = query.get('certificate').trim();
  }
  if(!code && query.get('number')){
    code = query.get('number').trim();
    if(/^FOA-RES-/i.test(code)) type = 'transcript';
  }

  const target = new URL('verify.html',location.href);
  if(code){
    target.searchParams.set('type',type);
    target.searchParams.set('code',code);
  }
  document.getElementById('continueLink').href = target.href;
  location.replace(target.href);
})();
</script>
</body>
</html>
