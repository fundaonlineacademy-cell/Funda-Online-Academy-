<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Funda Online Academy Academic Document</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260831-academic-documents"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root{--navy:#071d49;--navy2:#123b6d;--gold:#c99a2e;--gold2:#e5c56f;--ink:#243750;--muted:#6f7d8e;--paper:#fffdf8;--cream:#fff6e5;--line:#e6dcc2}
    *{box-sizing:border-box}body{margin:0;background:#e9edf2;color:var(--ink);font-family:Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;background:#071d49;color:#fff}.toolbar button,.toolbar a{border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:12px;text-decoration:none;cursor:pointer}.toolbar .primary{background:var(--gold);color:#071d49}.toolbar .secondary{background:#fff;color:#071d49}.stage{padding:24px}.sheet{position:relative;width:min(210mm,100%);min-height:297mm;margin:auto;background:var(--paper);box-shadow:0 16px 50px #0b1b3230;overflow:hidden;border:1px solid #d9c98f}.sheet:before,.sheet:after{content:"";position:absolute;width:230px;height:230px;background:linear-gradient(135deg,var(--navy),var(--gold));transform:rotate(45deg);opacity:.98;z-index:0}.sheet:before{left:-170px;top:-165px}.sheet:after{right:-175px;bottom:-170px}.doc{position:relative;z-index:1;padding:19mm 16mm 14mm}.brandRow{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.brand{display:flex;align-items:center;gap:13px}.brand img{width:76px;height:76px;object-fit:contain}.brandName{font-family:Georgia,serif;color:var(--navy);font-size:23px;line-height:.95;letter-spacing:.03em}.tag{margin-top:8px;font-size:8px;font-weight:800;letter-spacing:.2em;color:#a87812}.docTitle{text-align:right}.docTitle h1{font-family:Georgia,serif;color:var(--navy);font-size:23px;margin:7px 0 4px}.docTitle p{font-size:10px;margin:0;color:#526477;line-height:1.5}.goldRule{width:120px;height:2px;background:var(--gold);margin:7px 0 0 auto}.statusStrip{margin-top:18px;border:1px solid var(--line);background:linear-gradient(90deg,#fffaf0,#fff);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.datum b{display:block;color:var(--navy);font-size:8px;text-transform:uppercase;letter-spacing:.05em}.datum span{display:block;margin-top:4px;font-size:10px;font-weight:700}.courseBand{margin-top:14px;border-radius:13px;background:linear-gradient(135deg,var(--navy),#0b3765);padding:15px 18px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px}.courseBand small{display:block;color:#e7c86f;font-size:8px;font-weight:900;letter-spacing:.13em}.courseBand h2{font-family:Georgia,serif;font-size:19px;margin:4px 0 0}.courseBand .resultBig{text-align:right;min-width:115px;border-left:1px solid #ffffff30;padding-left:16px}.courseBand .resultBig strong{font-size:22px}.courseBand .resultBig span{display:block;color:#e8edf5;font-size:8px;margin-top:3px;text-transform:uppercase}.sectionTitle{margin:17px 0 7px;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.tableWrap{border:1px solid var(--line);border-radius:11px;overflow:hidden}.results{width:100%;border-collapse:collapse;font-size:9px}.results th{background:#d3a32f;color:#071d49;text-transform:uppercase;font-size:7.5px;letter-spacing:.04em;padding:8px 7px;text-align:left}.results td{padding:8px 7px;border-top:1px solid #eee5d2;vertical-align:top}.results tr:nth-child(even) td{background:#fffaf0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.summaryBox{border:1px solid var(--line);border-radius:11px;overflow:hidden}.summaryBox h3{margin:0;background:var(--navy);color:#fff;text-align:center;font-size:8px;padding:8px;text-transform:uppercase;letter-spacing:.06em}.summaryGrid{padding:10px 12px;display:grid;gap:7px}.sumRow{display:flex;justify-content:space-between;gap:14px;font-size:9px}.sumRow span:first-child{color:#607083}.sumRow b{color:var(--navy)}.note{margin-top:13px;background:var(--cream);border-left:4px solid var(--gold);padding:10px 12px;font-size:8.7px;color:#5c6571;line-height:1.55}.verifyRow{display:grid;grid-template-columns:100px 1fr 1fr;gap:15px;align-items:end;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}#qr{width:90px;height:90px;display:flex;align-items:center;justify-content:center}.verifyText h4,.authBlock h4{margin:0;color:var(--navy);font-size:9px;text-transform:uppercase}.verifyText p,.authBlock p{font-size:8.5px;line-height:1.5;margin:5px 0;color:#596979}.code{font-family:monospace;color:var(--navy);font-weight:800;font-size:9px}.legalFooter{margin-top:13px;padding:10px 12px;background:var(--navy);color:#fff;border-radius:9px;font-size:8px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}.draftMark{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:70px;font-weight:900;color:#8b1b1b0e;white-space:nowrap;pointer-events:none}.certificate .doc{padding-top:23mm}.certificate .brandRow{align-items:center}.certificateHero{text-align:center;padding:25px 5px 15px}.certificateHero .eyebrow{font-size:10px;letter-spacing:.25em;font-weight:900;color:#a87812}.certificateHero h1{font-family:Georgia,serif;font-size:37px;color:var(--navy);margin:9px 0}.certificateHero .presented{font-size:11px;color:#687686}.learnerName{font-family:Georgia,serif;color:#18345a;font-size:34px;margin:13px auto 6px;padding:0 20px 8px;border-bottom:2px solid var(--gold);width:80%;text-align:center}.certificateHero .courseText{font-size:12px;line-height:1.6;color:#46566a;margin:11px auto;max-width:650px}.certCourse{font-family:Georgia,serif;color:#071d49;font-size:22px;font-weight:700}.certMeta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.certMeta .datum{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fffaf0}.certVerify{margin-top:27px;display:grid;grid-template-columns:110px 1fr 1fr;gap:16px;align-items:end}.certificate .legalFooter{margin-top:23px}@media(max-width:720px){.stage{padding:8px}.doc{padding:13mm 8mm}.brand img{width:58px;height:58px}.brandName{font-size:17px}.docTitle h1{font-size:17px}.statusStrip,.certMeta{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:1fr}.verifyRow,.certVerify{grid-template-columns:90px 1fr}.authBlock{grid-column:1/-1}.courseBand h2{font-size:15px}.certificateHero h1{font-size:27px}.learnerName{font-size:25px;width:95%}.certCourse{font-size:18px}}@page{size:A4;margin:0}@media print{body{background:#fff}.toolbar{display:none}.stage{padding:0}.sheet{width:210mm;min-height:297mm;box-shadow:none;border:0;margin:0}.doc{padding:18mm 15mm 13mm}.certificate .doc{padding-top:22mm}}
  </style>
</head>
<body>
  <div class="toolbar"><a class="secondary" href="javascript:history.back()">← Back</a><button class="primary" onclick="window.print()">Print / Save PDF</button></div>
