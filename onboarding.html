<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Complete Enrollment - Funda Online Academy</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .course-card {
      transition: all 0.2s ease;
    }

    .course-card:hover {
      transform: translateY(-2px);
    }

    .course-card.selected {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      transform: translateY(-2px);
    }
  </style>
</head>

<body class="min-h-screen bg-[#07152f]">

  <!-- HEADER -->
  <header class="bg-[#03133d] text-white px-5 py-4 sm:px-8">

    <div class="max-w-6xl mx-auto flex items-center justify-between">

      <a href="login.html" class="flex items-center gap-3">

        <img
          src="logo.png"
          alt="Funda Online Academy"
          class="w-12 h-12 object-contain bg-white rounded-xl p-1"
        >

        <div>
          <div class="font-black text-lg leading-none">
            FUNDA ONLINE
          </div>

          <div
            class="text-[9px] tracking-[0.28em] font-black text-[#f6c453] mt-1"
          >
            ACADEMY
          </div>
        </div>

      </a>

      <button
        onclick="logout()"
        class="text-sm font-bold text-blue-100 hover:text-white"
      >
        Log out
      </button>

    </div>

  </header>


  <!-- MAIN -->
  <main class="max-w-6xl mx-auto px-5 py-8 sm:py-12">

    <!-- INTRO -->
    <div class="max-w-3xl">

      <p
        class="
          text-[#f6c453]
          font-black
          text-sm
          tracking-widest
        "
      >
        COMPLETE YOUR ENROLLMENT
      </p>

      <h1
        class="
          text-3xl
          sm:text-5xl
          font-black
          text-white
          mt-2
        "
      >
        Choose Your Course
      </h1>

      <p
        id="welcome"
        class="
          text-blue-100
          mt-4
          text-base
          sm:text-lg
          leading-7
        "
      >
        Choose the course you would like to study.
      </p>

    </div>


    <!-- MESSAGE -->
    <div
      id="message"
      class="
        hidden
        mt-6
        rounded-2xl
        p-4
        font-semibold
      "
    ></div>


    <!-- LOADING -->
    <section class="mt-8">

      <div
        id="loading"
        class="
          rounded-2xl
          bg-white/10
          border
          border-white/10
          p-8
          text-center
          text-white
        "
      >
        Loading courses...
      </div>


      <!-- COURSES -->
      <div
        id="courses"
        class="
          hidden
          grid
          md:grid-cols-2
          xl:grid-cols-3
          gap-5
        "
      ></div>

    </section>


    <!-- CONTINUE BAR -->
    <div
      id="continueBar"
      class="
        hidden
        sticky
        bottom-4
        mt-8
      "
    >

      <div
        class="
          bg-white
          rounded-2xl
          shadow-2xl
          p-4
          flex
          flex-col
          sm:flex-row
          sm:items-center
          sm:justify-between
          gap-4
        "
      >

        <div>

          <p
            class="
              text-xs
              font-bold
              text-gray-500
              uppercase
            "
          >
            Selected Course
          </p>

          <p
            id="selectedName"
            class="
              font-black
              text-[#03133d]
            "
          ></p>

          <p
            id="selectedPrice"
            class="
              text-sm
              text-gray-500
            "
          ></p>

        </div>


        <button
          id="continueBtn"
          onclick="submitEnrollment()"
          class="
            bg-[#2563eb]
            hover:bg-[#1d4ed8]
            text-white
            px-7
            py-3.5
            rounded-xl
            font-extrabold
          "
        >
          Continue →
        </button>

      </div>

    </div>

  </main>


  <script>

    /* =========================================================
       SUPABASE
    ========================================================== */

    const supabaseClient = supabase.createClient(
      "https://nzwfowwoazmpnwfrednh.supabase.co",
      "YOUR_EXISTING_SUPABASE_ANON_KEY"
    );


    let user = null;
    let selected = null;
    let courses = [];


    /* =========================================================
       FORMAT PRICE
    ========================================================== */

    function money(value) {

      return Number(value || 0).toLocaleString(
        "en-ZA",
        {
          style: "currency",
          currency: "ZAR"
        }
      );

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================== */

    function escapeHtml(value) {

      return String(value ?? "").replace(
        /[&<>"']/g,
        function (character) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[character];

        }
      );

    }


    /* =========================================================
       MESSAGE
    ========================================================== */

    function showMessage(text, success = false) {

      const element =
        document.getElementById("message");

      element.textContent = text;

      element.className =
        "mt-6 rounded-2xl p-4 font-semibold " +
        (
          success
            ? "bg-green-100 text-green-800"
            : "bg-red-100 text-red-800"
        );

      element.classList.remove("hidden");

    }


    /* =========================================================
       DISPLAY COURSES
    ========================================================== */

    function renderCourses() {

      const container =
        document.getElementById("courses");


      container.innerHTML =
        courses.map(function (course) {

          const isSelected =
            selected &&
            selected.id === course.id;


          return `

            <button
              type="button"
              onclick="selectCourse('${course.id}')"
              class="
                course-card
                text-left
                bg-white
                rounded-2xl
                overflow-hidden
                border-2
                border-transparent
                w-full
                ${isSelected ? "selected" : ""}
              "
            >

              <div
                class="
                  h-40
                  bg-slate-100
                "
              >

                ${
                  course.image_url

                    ? `
                      <img
                        src="${escapeHtml(course.image_url)}"
                        class="
                          w-full
                          h-full
                          object-cover
                        "
                        alt=""
                      >
                    `

                    : `
                      <div
                        class="
                          w-full
                          h-full
                          flex
                          items-center
                          justify-center
                          text-5xl
                        "
                      >
                        🎓
                      </div>
                    `
                }

              </div>


              <div class="p-5">

                <h2
                  class="
                    font-black
                    text-xl
                    text-[#03133d]
                  "
                >
                  ${escapeHtml(course.title)}
                </h2>


                <p
                  class="
                    text-sm
                    text-gray-500
                    mt-2
                    line-clamp-3
                  "
                >
                  ${
                    escapeHtml(
                      course.description ||
                      "Practical, career-focused online learning."
                    )
                  }
                </p>


                <div
                  class="
                    flex
                    justify-between
                    gap-3
                    mt-5
                    text-sm
                    font-bold
                  "
                >

                  <span>
                    ⏱
                    ${escapeHtml(course.duration || "Flexible")}
                  </span>

                  <span class="text-blue-600">
                    ${money(course.price)}
                  </span>

                </div>

              </div>

            </button>

          `;

        }).join("");


      container.classList.remove("hidden");

      document
        .getElementById("loading")
        .classList.add("hidden");

    }


    /* =========================================================
       SELECT COURSE
    ========================================================== */

    function selectCourse(courseId) {

      selected =
        courses.find(
          course => course.id === courseId
        );


      if (!selected) {
        return;
      }


      renderCourses();


      document
        .getElementById("continueBar")
        .classList.remove("hidden");


      document
        .getElementById("selectedName")
        .textContent =
        selected.title;


      document
        .getElementById("selectedPrice")
        .textContent =
        money(selected.price);

    }


    /* =========================================================
       LOAD USER + COURSES
    ========================================================== */

    async function loadPage() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getUser();


      if (
        error ||
        !data ||
        !data.user
      ) {

        window.location.href =
          "login.html";

        return;
      }


      user = data.user;


      const fullName =
        user.user_metadata?.full_name ||
        user.email ||
        "Student";


      document
        .getElementById("welcome")
        .textContent =
        `Welcome, ${fullName}. Choose the course you would like to study.`;


      /*
       * First try the public course catalogue RPC.
       * This is already part of your Supabase architecture.
       */

      let result =
        await supabaseClient.rpc(
          "get_public_course_catalog"
        );


      /*
       * Fallback to the courses table.
       */

      if (
        result.error ||
        !result.data
      ) {

        result =
          await supabaseClient
            .from("courses")
            .select(
              `
                id,
                title,
                slug,
                description,
                duration,
                price,
                image_url,
                active
              `
            )
            .eq("active", true)
            .order("title");

      }


      if (result.error) {

        console.error(
          "Course loading error:",
          result.error
        );


        document
          .getElementById("loading")
          .textContent =
          "We could not load the courses. Please refresh and try again.";

        return;
      }


      courses =
        (result.data || [])
          .filter(
            course =>
              course.active !== false
          );


      if (!courses.length) {

        document
          .getElementById("loading")
          .textContent =
          "No courses are currently available for enrollment.";

        return;
      }


      renderCourses();

    }


    /* =========================================================
       SUBMIT ENROLLMENT
    ========================================================== */

    async function submitEnrollment() {

      if (!selected) {

        showMessage(
          "Please select a course first."
        );

        return;
      }


      if (!user) {

        window.location.href =
          "login.html";

        return;
      }


      const button =
        document.getElementById(
          "continueBtn"
        );


      button.disabled = true;

      button.textContent =
        "Submitting...";


      /*
       * Check whether this student already
       * has an enrollment for this course.
       */

      const existing =
        await supabaseClient
          .from("enrollments")
          .select(
            "id,enrollment_status,status"
          )
          .eq(
            "student_id",
            user.id
          )
          .eq(
            "course_id",
            selected.id
          )
          .maybeSingle();


      if (existing.error) {

        console.error(
          existing.error
        );

      }


      if (existing.data) {

        showMessage(
          "You already have an enrollment for this course. Your application is being processed.",
          true
        );


        setTimeout(
          function () {

            window.location.href =
              "login.html";

          },
          1500
        );


        return;
      }


      /*
       * Create the enrollment.
       *
       * IMPORTANT:
       * The correct column is student_id,
       * not user_id.
       */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("enrollments")
          .insert({

            student_id:
              user.id,

            course_id:
              selected.id,

            enrollment_status:
              "pending",

            status:
              "pending",

            amount:
              selected.price

          })
          .select("id")
          .single();


      if (error) {

        console.error(
          "Enrollment insert error:",
          error
        );


        showMessage(
          "We could not complete your enrollment. " +
          error.message
        );


        button.disabled = false;

        button.textContent =
          "Continue →";

        return;
      }


      console.log(
        "Enrollment created:",
        data
      );


      showMessage(
        "Enrollment submitted successfully. Your course application is now pending approval.",
        true
      );


      /*
       * Return to login.
       *
       * Once admin approves the enrollment,
       * the student can log in and access the
       * student dashboard.
       */

      setTimeout(
        function () {

          window.location.href =
            "login.html";

        },
        1800
      );

    }


    /* =========================================================
       LOGOUT
    ========================================================== */

    async function logout() {

      await supabaseClient.auth.signOut();

      window.location.href =
        "login.html";

    }


    /* =========================================================
       START
    ========================================================== */

    loadPage();

  </script>

</body>
        </html>
