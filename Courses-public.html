<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courses - Funda Online Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F1F5FF] min-h-screen">
<nav class="bg-white p-4 shadow flex justify-between">
<div class="font-extrabold text-[#0A2A7A]">Funda Online Academy</div>
<a href="login.html" class="bg-[#0A2A7A] text-white px-5 py-2 rounded-xl text-sm">Login</a>
</nav>

<div class="max-w-6xl mx-auto p-6">
<h1 class="text-3xl font-extrabold text-[#0A2A7A]">Our Courses</h1>
<p class="text-gray-500 mt-1">Choose a course and start learning today</p>

<div id="coursesGrid" class="grid md:grid-cols-3 gap-6 mt-6">
<p class="text-gray-400">Loading courses...</p>
</div>
</div>

<script>
const SUPABASE_URL = "https://nzwfowwoazmpnwfrednh.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56d2Zvd3dvYXptcG53ZnJlZG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NzcwMzIsImV4cCI6MjEwMjE1MzAzMn0.7bY4V_KCPsJMz4Kf7QsErRSKGbKbxwxTY8R4YbVj7rU";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

async function loadCourses(){
 const {data, error} = await client.from('courses').select('*').eq('is_published', true);
 if(error){
  document.getElementById('coursesGrid').innerHTML = `<p class="text-red-500">Error: ${error.message} <br> Run courses table SQL first</p>`;
  return;
 }
 if(!data || data.length===0){
  // Fallback demo courses if table empty
  document.getElementById('coursesGrid').innerHTML = `
   <div class="bg-white rounded-2xl shadow p-5"><h3 class="font-bold">Grade 12 Maths</h3><p class="text-sm text-gray-500 mt-1">Full CAPS syllabus</p><p class="text-xl font-extrabold mt-3">R 450</p><a href="course-view.html?id=maths" class="mt-3 block bg-[#0A2A7A] text-white text-center py-2 rounded-xl">View Course</a></div>
   <div class="bg-white rounded-2xl shadow p-5"><h3 class="font-bold">Grade 12 Physical Science</h3><p class="text-sm text-gray-500 mt-1">Physics + Chemistry</p><p class="text-xl font-extrabold mt-3">R 450</p><a href="course-view.html?id=science" class="mt-3 block bg-[#0A2A7A] text-white text-center py-2 rounded-xl">View Course</a></div>
   <div class="bg-white rounded-2xl shadow p-5"><h3 class="font-bold">Grade 12 English</h3><p class="text-sm text-gray-500 mt-1">Home Language</p><p class="text-xl font-extrabold mt-3">R 350</p><a href="course-view.html?id=english" class="mt-3 block bg-[#0A2A7A] text-white text-center py-2 rounded-xl">View Course</a></div>
  `;
  return;
 }
 document.getElementById('coursesGrid').innerHTML = data.map(c=>`
  <div class="bg-white rounded-2xl shadow p-5">
   <div class="w-full h-32 bg-gradient-to-br from-blue-600 to-[#0A2A7A] rounded-xl"></div>
   <h3 class="font-bold mt-3">${c.title}</h3>
   <p class="text-sm text-gray-500 mt-1 line-clamp-2">${c.description||''}</p>
   <p class="text-xl font-extrabold mt-3">R ${c.price}</p>
   <a href="course-view.html?id=${c.id}" class="mt-3 block bg-[#0A2A7A] text-white text-center py-2 rounded-xl font-bold">View Course</a>
  </div>
 `).join('');
}
loadCourses();
</script>
</body>
</html>
