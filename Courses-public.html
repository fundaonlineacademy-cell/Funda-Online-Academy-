<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses - Funda Online Academy</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script></head>
<body class="bg-[#F1F5FF]">
<nav class="bg-[#0A2A7A] text-white p-4 flex justify-between"><a href="index.html" class="font-bold">Funda Online Academy</a><a href="dashboard.html" class="bg-white text-[#0A2A7A] px-4 py-1 rounded-full text-sm font-bold">My Learning</a></nav>
<div class="max-w-6xl mx-auto p-6"><h1 class="text-3xl font-black text-[#0A2A7A]">Our Courses</h1><p class="text-gray-500 mt-2">Choose a course and start learning today</p><div id="courses" class="grid md:grid-cols-3 gap-6 mt-8"><p class="text-gray-400">Loading courses...</p></div></div>
<script>
const URL="https://nzwfowwoazmpnwfrednh.supabase.co";const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56d2Zvd3dvYXptcG53ZnJlZG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NzcwMzIsImV4cCI6MjEwMjE1MzAzMn0.7bY4V_KCPsJMz4Kf7QsErRSKGbKbxwxTY8R4YbVj7rU";const client=supabase.createClient(URL,KEY);
async function load(){
 const {data,error}=await client.from('courses').select('*').eq('is_published',true);
 if(error){document.getElementById('courses').innerHTML=`<p class=text-red-500>${error.message}</p>`;return;}
 if(!data||data.length===0){document.getElementById('courses').innerHTML='<p class=text-gray-400>No courses yet. Ask admin to publish courses.</p>';return;}
 document.getElementById('courses').innerHTML=data.map(c=>`<div class="bg-white rounded-2xl shadow-lg overflow-hidden"><img src="${c.image_url||'https://via.placeholder.com/400x200?text=Funda+Course'}" class="w-full h-40 object-cover"><div class="p-5"><h3 class="font-bold text-[#0A2A7A]">${c.title}</h3><p class="text-sm text-gray-500 mt-2 line-clamp-2">${c.description||''}</p><div class="flex justify-between items-center mt-4"><span class="font-black text-xl text-green-600">R${c.price||0}</span><a href="course-view.html?id=${c.id}" class="bg-[#0A2A7A] text-white px-4 py-2 rounded-full text-sm font-bold">View Course</a></div></div></div>`).join('');
}
load();
</script></body></html>
