, Security & Platform'],['hr','♙ HR & Team'],['audits','▧ Reports, Compliance & Audit'],['expenses','▤ Expenses & Income Tracker']];function head(t,p,b='LIVE OPERATIONS'){return `<div class="head"><div><h1>${t}</h1><p>${p}</p></div><span class="badge green">${b}</span></div>`}function metrics(a){return `<div class="metrics">${a.map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div>`}function cards(a){return `<div class="grid">${a.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p>${x[2]||''}</div>`).join('')}</div>`}function statusBadge(s){s=String(s||'').toLowerCase();return `<span class="badge ${s.includes('approve')||s.includes('active')||s.includes('publish')||s.includes('paid')?'green':s.includes('reject')||s.includes('fail')||s.includes('closed')?'red':'amber'}">${e(s.toUpperCase()||'—')}</span>`}async function q(t,sel='*',order){let z=db.from(t).select(sel);if(order)z=z.order(order,{ascending:false});let r=await z;return r.error?[]:r.data||[]}async function load(){[EN,CO,PR,PAY,COMM,FAQ,RES,CERT,AT,CASH,TICK,GOV,LEADS,STAFF,AUD]=await Promise.all([q('enrollments','*,student:profiles!enrollments_student_id_fkey(id,full_name,email,phone),course:courses!enrollments_course_id_fkey(id,title,price)','created_at'),q('courses','*','created_at'),q('profiles','*','created_at'),q('payments','*','created_at'),q('communications','*','created_at'),q('faqs','*','display_order'),q('course_results','*','created_at'),q('certificates','*','issued_at'),q('assessment_attempts','*','created_at'),q('admin_cashbook','*','entry_date'),q('support_tickets','*','created_at'),q('admin_governance','*','created_at'),q('marketing_leads','*','created_at'),q('staff_records','*','created_at'),q('admin_audit_log','*','created_at')]);show(current||'dashboard')}let current='dashboard';function show(n){current=n;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===n));$('side').classList.remove('open');({dashboard,management,finance,communication,support,marketing,ambassadors,enrolments,academic,security,hr,audits,expenses}[n]||dashboard)();scrollTo(0,0)}function dashboard(){let pend=EN.filter(x=>st(x)==='pending').length,students=PR.filter(x=>x.role!=='admin').length,rev=EN.filter(x=>st(x)==='approved').reduce((a,x)=>a+Number(x.amount||x.course?.price||0),0);$('view').innerHTML=head('Business Health Overview','Executive view of Academy performance, operations and risks.')+metrics([['Pending approvals',pend],['Students',students],['Courses',CO.length],['Approved revenue',money(rev)]])+`<div class="panel"><h2>Departments</h2><p>All Academy functions are managed from one Command Center.</p><div class="grid">${D.slice(1).map(x=>`<div class="card dept" onclick="show('${x[0]}')"><h3>${x[1]}</h3><p>Open operational workspace, records, controls and reporting.</p><span class="badge green">ACTIVE</span></div>`).join('')}</div></div>`}function management(){$('view').innerHTML=head('Management & Governance','Strategy, KPIs, policy, accountability and governance.')+metrics([['Governance items',GOV.length],['Active items',GOV.filter(x=>x.status==='Active').length],['Students',PR.filter(x=>x.role!=='admin').length],['Courses',CO.length]])+`<div class="panel"><h2>Add governance / KPI item</h2><div class="form"><select id="gtype" class="field"><option>KPI</option><option>Policy</option><option>Strategic Note</option><option>Meeting Minute</option><option>Risk</option></select><input id="gtitle" class="field" placeholder="Title"><input id="gowner" class="field" placeholder="Owner"><textarea id="gdetails" class="field" placeholder="Details / target / decision"></textarea><button class="btn blue" onclick="addGov()">Save Item</button></div></div><div class="panel"><h2>Governance Register</h2><div class="list">${GOV.map(x=>`<div class="row"><div><h3>${e(x.title)}</h3><p>${e(x.item_type)} · Owner: ${e(x.owner||'—')} · ${date(x.target_date)}</p><p>${e(x.details||'')}</p></div>${statusBadge(x.status)}</div>`).join('')||'<div class="empty">No governance items yet.</div>'}</div></div>`}async function addGov(){if(!$('gtitle').value.trim())return alert('Title is required');await db.from('admin_governance').insert({item_type:$('gtype').value,title:$('gtitle').value.trim(),owner:$('gowner').value.trim(),details:$('gdetails').value.trim(),created_by:U.id});await log('Created governance item','Management','governance',$('gtitle').value);await load()}function finance(){let approved=EN.filter(x=>st(x)==='approved'),rev=approved.reduce((a,x)=>a+Number(x.amount||x.course?.price||0),0),verified=PAY.filter(x=>String(x.status).toLowerCase().includes('verified')||String(x.status).toLowerCase()==='paid').reduce((a,x)=>a+Number(x.amount||0),0);$('view').innerHTML=head('Finance & Accounting','Revenue, payment verification, debtors and reconciliation.')+metrics([['Approved tuition',money(rev)],['Verified payments',money(verified)],['Payment records',PAY.length],['Pending payments',PAY.filter(x=>String(x.status).toLowerCase()==='pending').length]])+`<div class="panel"><h2>Student Revenue Ledger</h2><div class="tablewrap"><table class="tbl"><tr><th>Student</th><th>Course</th><th>Amount</th><th>Status</th><th>Date</th></tr>${EN.map(x=>`<tr><td>${e(x.student?.full_name||x.student?.email)}</td><td>${e(x.course?.title)}</td><td>${money(x.amount||x.course?.price)}</td><td>${statusBadge(st(x))}</td><td>${date(x.created_at)}</td></tr>`).join('')}</table></div></div>`+cards([['Income statement','Approved tuition less recorded operating expenses.','<b>'+money(rev-CASH.filter(x=>x.entry_type==='expense').reduce((a,x)=>a+Number(x.amount),0))+' current operating result</b>'],['Reconciliation','Compare enrolment approvals, payment records and cashbook entries.'],['Tax & accountant exports','Reports & Audit provides CSV-ready financial records for formal accounting and SARS preparation.'],['Student debtors','Pending enrolments and unverified payments remain visible until resolved.']])}function lue="">Select student</option>${PR.filter(x=>x.role!=='admin').map(x=>`<option value="${x.id}">${e(x.full_name||x.email)}</option>`)}</select><input id="tq" class="field" placeholder="Subject"><select id="tp" class="field"><option>Normal</option><option>High</option><option>Urgent</option></select><textarea id="tn" class="field" placeholder="Support notes"></textarea><button class="btn blue" onclick="addTicket()">Create Ticket</button></div></div><div class="panel"><h2>Ticket Queue</h2><div class="list">${TICK.map(x=>`<div class="row"><div><h3>${e(x.subject)}</h3><p>${e(x.category)} · ${e(x.priority)} · ${date(x.created_at)}</p><p>${e(x.notes||'')}</p></div><div class="actions">${statusBadge(x.status)}<button class="btn ok" onclick="solveTicket('${x.id}')">Mark Solved</button></div></div>`).join('')||'<div class="empty">No support tickets.</div>'}</div></div>`}async function addTicket(){if(!$('tq').value.trim())return alert('Subject required');await db.from('support_tickets').insert({student_id:$('ts').value||null,subject:$('tq').value.trim(),priority:$('tp').value,notes:$('tn').value.trim()});await load()}async function solveTicket(id){await db.from('support_tickets').update({status:'Solved',updated_at:new Date().toISOString()}).eq('id',id);await load()}function marketing(){$('view').innerHTML=head('Marketing & Admissions','Leads, source tracking, conversion and campaigns.')+metrics([['Leads',LEADS.length],['New leads',LEADS.filter(x=>x.status==='New').length],['Enrolments',EN.length],['Conversion',LEADS.length?Math.round(EN.length/LEADS.length*100)+'%':'—']])+`<div class="panel"><h2>Add Lead</h2><div class="form"><input id="ln" class="field" placeholder="Full name"><input id="le" class="field" placeholder="Email"><input id="lp" class="field" placeholder="Phone"><input id="ls" class="field" placeholder="Source e.g. Facebook"><input id="lc" class="field" placeholder="Course interest"><button class="btn blue" onclick="addLead()">Save Lead</button></div></div><div class="panel"><h2>Lead Tracker</h2><div class="list">${LEADS.map(x=>`<div class="row"><div><h3>${e(x.full_name)}</h3><p>${e(x.email||'')} · ${e(x.phone||'')} · Source: ${e(x.source||'—')}</p><p>Interest: ${e(x.course_interest||'—')}</p></div>${statusBadge(x.status)}</div>`).join('')||'<div class="empty">No leads recorded.</div>'}</div></div>`}function ambassadors(){$('view').innerHTML=head('Ambassador Programme','Applications, approval, activation, referral codes and Ambassador Programme oversight.','SEPARATE APPROVAL WORKFLOW')+metrics([['Ambassador applications','—'],['Approved','—'],['Active / introductory','—'],['Founding intake','25 max']])+`<div class="panel mktStudio"><h2>Ambassador Programme Workspace</h2><p>Ambassador applications and approvals are managed here separately from student enrolments, payment verification and student admissions.</p></div>`} async function addLead(){if(!$('ln').value.trim())return alert('Name required');await db.from('marketing_leads').insert({full_name:$('ln').value.trim(),email:$('le').value.trim(),phone:$('lp').value.trim(),source:$('ls').value.trim(),course_interest:$('lc').value.trim()});await load()}async function viewProof(id){let x=EN.find(y=>y.id===id),p=x?.proof_url;if(!p)return alert('No payment proof stored.');if(/^http/.test(p))return window.open(p,'_blank');let r=await db.storage.from('payment-proofs').createSignedUrl(p,300);if(r.error)return alert(r.error.message);window.open(r.data.signedUrl,'_blank')}function enrolments(){let pend=EN.filter(x=>st(x)==='pending').length;$('view').innerHTML=head('Enrolments & Courses','Applications, payment approvals, pricing and course catalogue.')+metrics([['Pending',pend],['Approved',EN.filter(x=>st(x)==='approved').length],['Rejected',EN.filter(x=>st(x)==='rejected').length],['Courses',CO.length]])+`<div class="panel"><h2>Applications</h2><div class="list">${EN.map(x=>`<div class="row"><div><h3>${e(x.student?.full_name||x.student?.email)}</h3><p>${e(x.course?.title)} · ${money(x.amount||x.course?.price)} · ${date(x.created_at)}</p>${x.rejection_reason?`<p>Reason: ${e(x.rejection_reason)}</p>`:''}</div><div class="actions">${statusBadge(st(x))}${x.proof_url?`<button class="btn blue" onclick="viewProof('${x.id}')">View Proof</button>`:''}${st(x)==='pending'?`<button class="btn ok" onclick="approve('${x.id}')">Approve</button><button class="btn bad" onclick="rejectE('${x.id}')">Reject</button>`:''}</div></div>`).join('')}</div></div><div class="panel"><h2>Course Portfolio & Pricing</h2><div class="grid">${CO.map(c=>`<div class="card"><h3>${e(c.title)}</h3><p>${money(c.price)} · ${e(c.duration||'Flexible')}</p>${statusBadge(c.active===false?'Inactive':'Active')}<div class="actions" style="margin-top:8px"><button class="btn light" onclick="price('${c.id}',${Number(c.price||0)})">Edit Price</button><button class="btn ${c.active===false?'ok':'bad'}" onclick="toggle('${c.id}',${c.active!==false})">${c.active===false?'Activate':'Deactivate'}</button></div></div>`).join('')}</div></div>`}async function approve(id){if(!confirm('Approve enrolment and grant access?'))return;await db.from('enrollments').update({status:'approved',enrollment_status:'approved',reviewed_at:new Date().toISOString(),reviewed_by:U.id,approval_department:'Enrolments'}).eq('id',id);await log('Approved enrolment','Enrolments','enrollment',id);await load()}async function rejectE(id){let r=prompt('Rejection reason:');if(!r)return;await db.from('enrollments').update({status:'rejected',enrollment_status:'rejected',rejection_reason:r,reviewed_at:new Date().toISOString(),reviewed_by:U.id,approval_department:'Enrolments'}).eq('id',id);await log('Rejected enrolment','Enrolments','enrollment',id);await load()}async function price(id,v){let n=Number(prompt('New price:',v));if(!Number.isFinite(n)||n<0)return;await db.from('courses').update({price:n,updated_at:new Date().toISOString()}).eq('id',id);await load()}async function toggle(id,a){if(!confirm((a?'Deactivate':'Activate')+' course?'))ret
