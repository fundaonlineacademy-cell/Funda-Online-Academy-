<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funda</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script></head>
<body class="bg-[#EDF4FF]">
<nav class="bg-white p-4 flex justify-between"><b>FUNDA</b><a href="login.html" class="bg-[#0A2A7A] text-white px-4 py-1 rounded-full text-sm">Login</a></nav>
<h1 class="text-center font-black text-[#0A2A7A] text-2xl mt-6">Master Skills That Get You Hired</h1>
<div id="courses" class="grid grid-cols-2 md:grid-cols-5 gap-3 p-6 max-w-7xl mx-auto">Loading...</div>
<p id="error" class="text-center text-red-500 text-xs mt-4"></p>
<script>
const supa=supabase.createClient("https://nzwfowwoazmpnwfrednh.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56d2Zvd3dvYXptcG53ZnJlZG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NzcwMzIsImV4cCI6MjEwMjE1MzAzMn0.7bY4V_KCPsJMz4Kf7QsErRSKGbKbxwxTY8R4YbVj7rU");
async function load(){
 try{
  let {data,error}=await supa.from('courses').select('*').limit(30);
  if(error) throw error;
  if(!data||data.length==0){document.getElementById('courses').innerHTML='No courses found in database';return;}
  document.getElementById('courses').innerHTML=data.slice(0,10).map(c=>`
    <a href="course-view.html?id=${c.id}" class="bg-white border rounded-xl p-3">
      <div class="bg-blue-50 h-12 rounded flex items-center justify-center text-xs">📚</div>
      <p class="font-bold text-xs mt-2">${c.title}</p>
      <p class="text-xs mt-1">R${c.price} • ${c.duration||'6 weeks'}</p>
      <p class="bg-[#0A2A7A] text-white text-center text-xs py-1 rounded mt-2">Enroll</p>
    </a>`).join('');
 }catch(e){document.getElementById('error').innerText='ERROR: '+e.message; console.log(e);}
}
load();
</script>
</body></html>
