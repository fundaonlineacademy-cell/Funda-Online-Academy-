<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Command Center</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script></head>
<body class="bg-[#F1F5FF] p-6"><h1 class="text-3xl font-extrabold">Admin Command Center</h1>
<div class="grid grid-cols-4 gap-4 mt-6"><div class="bg-white p-5 rounded-2xl shadow"><p>Total Income</p><p class="text-2xl font-bold">R 124,500</p></div><div class="bg-white p-5 rounded-2xl shadow"><p>Pending</p><p class="text-2xl font-bold" id="pendingCount">0</p></div></div>
<div class="bg-white p-6 rounded-2xl shadow mt-6"><h3 class="font-bold">Recent Enrollments - Approve Proof</h3><div id="enrollList" class="mt-4"></div></div>
<script>
const supabaseClient=supabase.createClient("https://nzwfowwoazmpnwfrednh.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56d2Zvd3dvYXptcG53ZnJlZG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NzcwMzIsImV4cCI6MjEwMjE1MzAzMn0.7bY4V_KCPsJMz4Kf7QsErRSKGbKbxwxTY8R4YbVj7rU");
async function loadEnrolls(){const {data}=await supabaseClient.from('enrollments').select('*,profiles(email)').eq('status','pending');document.getElementById('pendingCount').innerText=data.length;document.getElementById('enrollList').innerHTML=data.map(e=>`<div class="border rounded-xl p-3 flex justify-between mb-2"><div><p>${e.profiles?.email}</p><a href="${e.proof_url}" target="_blank" class="text-xs text-blue-600 underline">View Proof</a></div><div class="flex gap-2"><button onclick="approve('${e.id}')" class="bg-green-600 text-white px-3 py-1 rounded">Approve</button><button onclick="reject('${e.id}')" class="bg-red-600 text-white px-3 py-1 rounded">Reject</button></div></div>`).join('');}
async function approve(id){await supabaseClient.from('enrollments').update({status:'approved'}).eq('id',id);loadEnrolls();}async function reject(id){await supabaseClient.from('enrollments').update({status:'rejected'}).eq('id',id);loadEnrolls();}loadEnrolls();
</script></body></html>
