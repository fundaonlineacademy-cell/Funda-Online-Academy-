<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Funda Online Academy</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="wrap nav"><a class="logo" href="index.html"><img src="logo.png" alt="Funda Online Academy logo"><span>Funda Online Academy Pty Ltd<small>Admin Dashboard</small></span></a><div class="nav-actions"><span id="admin-email" class="user-email"></span><button id="logout" class="btn ghost">Logout</button></div></div></header>
<main class="dashboard"><div class="wrap"><div class="dash-head"><div><span class="badge">ADMIN AREA</span><h1>Course Manager</h1><p>Add, edit and remove courses. Changes are stored in the online database.</p></div><button id="new-course" class="btn green">+ Add Course</button></div>
<div id="message" class="message hidden"></div>
<section><div class="admin-grid"><div class="card"><h2>Course editor</h2><form id="course-form"><input type="hidden" id="course-id"><label>Course name</label><input id="course-name" required><label>Price (ZAR)</label><input id="course-price" type="number" min="0" step="1" required><label>Category</label><input id="course-category" required><label>Duration</label><input id="course-duration" placeholder="e.g. 1–2 Weeks"><label>Image URL (optional)</label><input id="course-image" placeholder="https://..."><label>Short description</label><textarea id="course-description"></textarea><label>Modules (one per line)</label><textarea id="course-modules" placeholder="Module 1&#10;Module 2&#10;Module 3"></textarea><div class="actions"><button class="btn green">Save Course</button><button type="button" id="cancel-edit" class="btn ghost">Cancel</button></div></form></div>
<div class="card"><h2>Courses</h2><div id="admin-courses" class="admin-list">Loading…</div></div></div></section>
<section><div class="card"><h2>Student Enrolments</h2><div id="admin-enrolments" class="admin-table-wrap">Loading…</div></div></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
