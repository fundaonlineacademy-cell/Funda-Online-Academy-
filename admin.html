<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Command Center | Funda Online Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#F1F5FF] min-h-screen">
<header class="bg-[#0A1931] text-white p-4 flex justify-between items-center">
<h1 class="font-black">ADMIN COMMAND CENTER</h1>
<div class="flex gap-2">
<a href="index.html" class="bg-white text-[#0A1931] px-4 py-2 rounded-full text-xs font-bold">View Site</a>
<button onclick="logout()" class="bg-red-600 px-4 py-2 rounded-full text-xs font-bold">Logout</button>
</div>
</header>

<div class="max-w-7xl mx-auto p-4 grid md:grid-cols-3 gap-4 mt-4">
<div class="bg-white rounded-2xl p-5 shadow"><p class="text-xs text-gray-500">Pending Payment Approval</p><p id="pendingCount" class="text-2xl font-black text-red-600">0</p></div>
<div class="bg-white rounded-2xl p-5 shadow"><p class="text-xs text-gray-500">Total Enrollments</p><p id="totalCount" class="text-2xl font-black">0</p></div>
<div class="bg-white rounded-2xl p-5 shadow"><p class="text-xs text-gray-500">Total Revenue (Approved)</p><p id="revenue" class="text-2xl font-black text-green-600">R0</p></div>
</div>

<div class="max-w-7xl mx-auto p-4">
<div class="bg-white rounded-2xl p-6 shadow">
<h2 class="font-black text-[#0A2A7A]">Enrollments - Approve Payment Proof</h2>
<div id="loading" class="text-center py-10 text-sm text-gray-500">Loading enrollments...</div>
<div id="enrollmentList" class="mt-6 space-y-4"></div>
<div id="emptyState" class="hidden text-center py-10"><p class="text-sm text-[#0A2A7A] bg-blue-50 p-4 rounded-xl">✅ Ready - No enrollments yet. When student enrolls, they will appear here.</p></div>
</div>

<div class="bg-white rounded-2xl p-6 shadow mt-6">
<h2 class="font-black text-[#0A2A7A]">Course Management - 30 Courses</h2>
<div id="courseList" class="mt-4 grid md:grid-cols-2 gap-3"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://nzwfowwoazmpnwfrednh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFub24iLCJpYXQiOjE3ODY1NzcwMzIsImV4cCI6MjEwMjE1MzAzMn0.7bY4V_KCPsJMz4Kf7QsErRSKGbKbxwxTY8R4YbVj7rU";
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function checkAdmin(){
 const {data:{user}} = await supa.auth.getUser();
 if(!user){location.href='login.html';return;}
 const {data:profile}=await supa.from('profiles').select('role').eq('id',user.id).single();
 if(!profile || profile.role!=='admin'){alert('Not admin');location.href='index.html';}
}
checkAdmin();

async function loadEnrollments(){
 const {data,error} = await supa.from('enrollments').select(`*, profiles(email, full_name), courses(title, price)`).order('created_at',{ascending:false});
 document.getElementById('loading').classList.add('hidden');
 if(error){document.getElementById('loading').textContent='Error: '+error.message; return;}
 if(!data || data.length===0){document.getElementById('emptyState').classList.remove('hidden'); document.getElementById('pendingCount').textContent='0'; document.getElementById('totalCount').textContent='0'; return;}
 
 let pending=0, total=data.length, revenue=0;
 data.forEach(e=>{if(e.status==='pending') pending++; if(e.status==='approved') revenue+=Number(e.courses?.price||0);});
 document.getElementById('pendingCount').textContent=pending;
 document.getElementById('totalCount').textContent=total;
 document.getElementById('revenue').textContent='R'+revenue.toLocaleString();

 document.getElementById('enrollmentList').innerHTML=data.map(en=>`
  <div class="border rounded-xl p-4 ${en.status==='pending'?'bg-yellow-50 border-yellow-200':'bg-green-50 border-green-200'}">
   <div class="flex justify-between">
    <div><p class="font-bold text-sm">${en.profiles?.full_name||en.profiles?.email||'Student'}</p><p class="text-xs text-gray-600">${en.profiles?.email}</p><p class="text-xs mt-1"><b>Course:</b> ${en.courses?.title}</p><p class="text-xs"><b>Fee:</b> R${en.courses?.price} | <b>Status:</b> <span class="font-black uppercase ${en.status==='pending'?'text-orange-600':'text-green-600'}">${en.status}</span></p><p class="text-[10px] text-gray-400">${new Date(en.created_at).toLocaleString()}</p></div>
    <div class="text-right">${en.payment_proof_url?`<a href="${en.payment_proof_url}" target="_blank" class="text-xs bg-blue-600 text-white px-3 py-2 rounded-full">View Proof</a>`:`<span class="text-xs text-gray-400">No proof uploaded</span>`}</div>
   </div>
   ${en.status==='pending'?`<div class="flex gap-2 mt-3"><button onclick="approve('${en.id}')" class="bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold">✅ Approve Payment</button><button onclick="reject('${en.id}')" class="bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold">❌ Reject</button></div>`:''}
  </div>
 `).join('');
}

async function loadCourses(){
 const {data} = await supa.from('courses').select('*').order('title');
 if(!data) return;
 document.getElementById('courseList').innerHTML=data.map(c=>`<div class="border rounded-xl p-3 flex justify-between items-center"><div><p class="font-bold text-xs">${c.title}</p><p class="text-[10px] text-gray-500">R${c.price} - ${c.duration||'Flexible'}</p></div><span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded-full">${c.active!==false?'Active':'Inactive'}</span></div>`).join('');
}

async function approve(id){ if(!confirm('Approve this enrollment? Student will get access.')) return; const {error}=await supa.from('enrollments').update({status:'approved'}).eq('id',id); if(error) alert(error.message); else loadEnrollments(); }
async function reject(id){ if(!confirm('Reject this enrollment?')) return; const {error}=await supa.from('enrollments').update({status:'rejected'}).eq('id',id); if(error) alert(error.message); else loadEnrollments(); }
async function logout(){ await supa.auth.signOut(); location.href='login.html'; }

loadEnrollments(); loadCourses();
</script>
</body>
</html>
