<!DOCTYPE html><html lang="en"><head><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Results | Funda Online Academy</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260903-results"></script><style>body{font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#f7fbff,#fffaf0);color:#183153}.card{background:#fff;border:1px solid #d9e4f2;box-shadow:0 10px 28px rgba(34,72,119,.07)}</style></head><body class="min-h-screen"><header class="bg-[#06152f] text-white"><div class="max-w-5xl mx-auto px-4 h-20 flex items-center justify-between"><a href="dashboard.html" class="flex items-center gap-3"><img src="logo.png" class="w-11 h-11 rounded-xl bg-white p-1 object-contain" alt="Funda Online Academy"><div><div class="font-extrabold">FUNDA ONLINE ACADEMY</div><div class="text-[10px] tracking-[.2em] text-[#e2c56f]">MY RESULTS</div></div></a><a href="dashboard.html" class="text-sm font-bold">← Dashboard</a></div></header><main class="max-w-5xl mx-auto px-4 py-8"><section class="card rounded-3xl p-6 sm:p-8"><p class="text-[11px] tracking-[.16em] font-bold text-[#b58216]">ACADEMIC RECORDS</p><h1 class="mt-1 text-3xl font-extrabold text-[#06152f]">My Statements of Results</h1><p class="mt-3 text-sm text-slate-500">Only finalised official Statements of Results appear here. Draft or in-progress academic results are not downloadable as official documents.</p><div id="state" class="mt-8 text-sm text-slate-500">Loading your results...</div><div id="list" class="mt-6 space-y-4"></div></section></main><script>(async()=>{const state=document.getElementById('state'),list=document.getElementById('list');const db=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html?next=student-results.html';return;}const uid=session.user.id;const q=await db.from('course_results').select('id,result_number,final_percentage,result_status,completed_at,statement_status,statement_issued_at,statement_pdf_path,course_title_snapshot,duration_snapshot,cpd_points_snapshot,statement_version').eq('student_id',uid).in('statement_status',['final','amended']).order('statement_issued_at',{ascending:false});if(q.error){state.textContent='Unable to load your official results right now.';return;}const rows=q.data||[];if(!rows.length){state.innerHTML='<div class="rounded-2xl bg-slate-50 border border-slate-200 p-5"><strong class="text-[#06152f]">No final Statements of Results yet.</strong><div class="mt-1">A document will appear here after your academic result has been formally finalised and issued.</div></div>';return;}state.classList.add('hidden');for(const r of rows){const c=document.createElement('article');c.className='rounded-2xl border border-slate-200 p-5';const issued=r.statement_issued_at?new Date(r.statement_issued_at).toLocaleDateString('en-ZA',{day:'2-digit',month:'long',year:'numeric'}):'—';c.innerHTML=`<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"><div><div class="text-xs font-bold text-[#b58216]">${r.result_number||'Result number pending'}</div><h2 class="mt-1 font-extrabold text-[#06152f]">${r.course_title_snapshot||'Official Statement of Results'}</h2><div class="mt-2 text-xs text-slate-500">Final result: <strong>${r.final_percentage==null?'—':Number(r.final_percentage).toFixed(1)+'%'}</strong> • Status: <strong>${String(r.result_status||'').replaceAll('_',' ')||'—'}</strong> • Issued: ${issued}</div></div><button class="view px-4 py-2.5 rounded-xl bg-[#06152f] text-white text-xs font-bold" ${r.statement_pdf_path?'':'disabled'}>${r.statement_pdf_path?'View / Download PDF':'PDF pending'}</button></div>`;c.querySelector('.view')?.addEventListener('click',async()=>{if(!r.statement_pdf_path)return;const out=await db.functions.invoke('result-download',{body:{result_id:r.id}});if(out.error||out.data?.error||!out.data?.url){alert(out.data?.error||'Unable to open this result right now.');return;}window.open(out.data.url,'_blank','noopener');});list.appendChild(c);}})();</script><script>
window.fundaProtectedPageRecheck=async function(){
  try{
    if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY){location.replace('login.html?next=student-results.html');return}
    const client=window.__fundaSessionGuardClient||(window.__fundaSessionGuardClient=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}));
    const {data}=await client.auth.getSession();
    if(!data?.session?.user)location.replace('login.html?next=student-results.html');
  }catch(_){location.replace('login.html?next=student-results.html')}
};
window.addEventListener('pageshow',function(e){if(e.persisted)window.fundaProtectedPageRecheck()});
</script>
</body></html>
