<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Create your Funda Online Academy student account.">
<title>Create Student Account | Funda Online Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(155deg,#eceeea,#f4eee6 58%,#f4e3e8);color:#243750}
.card{width:min(88vw,430px);padding:34px 28px;border-radius:24px;background:#fff6e4;border:1px solid #dcc67c;box-shadow:0 18px 50px rgba(48,70,88,.13);text-align:center}
.spinner{width:38px;height:38px;border:4px solid #e3d9c7;border-top-color:#2d4b63;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 18px}
@keyframes s{to{transform:rotate(360deg)}}
h1{font-size:22px;margin:0 0 8px;color:#21384d}p{margin:0;color:#566675;line-height:1.65;font-size:14px}
</style>
</head>
<body>
<main class="card" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <h1>Preparing registration</h1>
  <p>Opening your student registration form and keeping your course or referral journey intact.</p>
</main>
<script>
(()=>{
  const target=new URL('auth.html',window.location.href);
  const current=new URLSearchParams(window.location.search);
  current.forEach((value,key)=>{
    if(key!=='new')target.searchParams.append(key,value);
  });
  target.searchParams.set('new','1');

  /* Do not sign out an existing Academy account and do not clear course/referral
     state here. auth.html decides whether the visitor needs a new account or
     should continue with the account that is already signed in. */
  window.location.replace(target.href);
})();
</script>
</body>
</html>
