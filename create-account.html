<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Create Student Account | Funda Online Academy</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260829"></script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;background:linear-gradient(155deg,#eceeea,#f4eee6 58%,#f4e3e8);color:#243750}.card{width:min(88vw,430px);padding:34px 28px;border-radius:24px;background:#fff6e4;border:1px solid #dcc67c;box-shadow:0 18px 50px rgba(48,70,88,.13);text-align:center}.spinner{width:38px;height:38px;border:4px solid #e3d9c7;border-top-color:#2d4b63;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 18px}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px;color:#21384d}p{margin:0;color:#566675;line-height:1.65;font-size:14px}</style>
</head>
<body>
<div class="card"><div class="spinner"></div><h1>Preparing registration</h1><p>Opening a fresh student registration form for you.</p></div>
<script>
(async()=>{
 try{
  if(window.supabase&&window.SUPABASE_URL&&window.SUPABASE_ANON_KEY){
   const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
   await client.auth.signOut({scope:'local'});
  }
 }catch(e){console.warn('Registration session reset:',e)}
 try{localStorage.removeItem('funda_pending_course');localStorage.removeItem('enroll_after_login')}catch(e){}
 location.replace('auth.html?new=1');
})();
</script>
</body>
</html>
