<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Create your Funda Online Academy student account.">
<title>Create Student Account | Funda Online Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260916-create-account-fresh-session-v1"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(155deg,#eceeea,#f4eee6 58%,#f4e3e8);color:#243750}
.card{width:min(88vw,430px);padding:34px 28px;border-radius:24px;background:#fff6e4;border:1px solid #dcc67c;box-shadow:0 18px 50px rgba(48,70,88,.13);text-align:center}
.spinner{width:38px;height:38px;border:4px solid #e3d9c7;border-top-color:#2d4b63;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 18px}
@keyframes s{to{transform:rotate(360deg)}}
h1{font-size:22px;margin:0 0 8px;color:#21384d}p{margin:0;color:#566675;line-height:1.65;font-size:14px}.error{color:#9f1239;margin-top:12px;font-weight:700}
</style>
</head>
<body>
<main class="card" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <h1>Preparing registration</h1>
  <p id="statusText">Opening a fresh student registration form and keeping your course or referral journey intact.</p>
</main>
<script>
(async()=>{
  const status=document.getElementById('statusText');
  const target=new URL('auth.html',window.location.href);
  const current=new URLSearchParams(window.location.search);
  current.forEach((value,key)=>{
    if(key!=='new')target.searchParams.append(key,value);
  });
  target.searchParams.set('new','1');

  try{
    if(window.supabase?.createClient&&window.SUPABASE_URL&&window.SUPABASE_ANON_KEY){
      const client=window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY,
        {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
      );
      /* Create Account is intentionally a fresh-registration action. Clear only
         the active local authentication session. Do not clear the selected
         course, ambassador referral, or other registration journey state. */
      await client.auth.signOut({scope:'local'});
    }
  }catch(error){
    console.warn('Fresh registration session reset warning:',error);
    status.textContent='The current signed-in session could not be closed safely. Please use Sign Out first, then choose Create Account again.';
    status.classList.add('error');
    return;
  }

  window.location.replace(target.href);
})();
</script>
</body>
</html>
