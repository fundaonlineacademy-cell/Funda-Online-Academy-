<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="referrer" content="no-referrer">

  <title>Reset Password - Funda Online Academy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #062b49;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 28px;
      padding: 40px 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      object-fit: cover;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      color: #075985;
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 20px;
      margin-bottom: 30px;
    }

    h2 {
      text-align: center;
      color: #092b45;
      font-size: 28px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 17px;
      color: #222;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 17px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
      margin-bottom: 20px;
      outline: none;
    }

    input:focus {
      border-color: #087f5b;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #062b49;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a12626;
    }

    .message.success {
      display: block;
      background: #eaf8f0;
      color: #087443;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #075985;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .password-note {
      color: #777;
      font-size: 14px;
      margin-top: -12px;
      margin-bottom: 20px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      src="logo.png"
      alt="Funda Online Academy"
      class="logo"
    >

    <h1>Funda Online Academy</h1>

    <div class="subtitle" id="portalSubtitle">
      Student Portal
    </div>

    <h2>Reset Password</h2>

    <div id="message" class="message"></div>

    <form id="resetForm">

      <label for="password">
        New Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your new password"
        autocomplete="new-password"
        required
        minlength="8"
        disabled
      >

      <div class="password-note">
        Password must be at least 8 characters long.
      </div>

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your new password"
        autocomplete="new-password"
        required
        minlength="8"
        disabled
      >

      <button type="submit" id="resetButton" disabled>
        Verifying Reset Link...
      </button>

    </form>

    <a href="login.html" class="back" id="backLink">
      ← Back to Student Login
    </a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const { createClient } = supabase;

    function readCookie(name) {
      const prefix = name + "=";
      return document.cookie.split(";").map(v => v.trim()).find(v => v.startsWith(prefix))?.slice(prefix.length) || "";
    }

    const requestedPortal = String(new URLSearchParams(window.location.search).get("portal") || readCookie("foa_password_reset_portal") || "").toLowerCase();
    const isAmbassadorRecovery = requestedPortal === "ambassador";
    const returnHref = isAmbassadorRecovery ? "ambassador-login.html" : "login.html";
    const returnLabel = isAmbassadorRecovery ? "Ambassador Login" : "Student Login";

    const recoveryMarkerInUrl =
      new URLSearchParams(window.location.search).get("type") === "recovery" ||
      /(?:^|[&#])type=recovery(?:&|$)/i.test(window.location.hash);

    const db = createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY,
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
    );

    const form = document.getElementById("resetForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("message");
    const portalSubtitle = document.getElementById("portalSubtitle");
    const backLink = document.getElementById("backLink");
    let recoveryReady = false;

    if (isAmbassadorRecovery) {
      portalSubtitle.textContent = "Ambassador Portal";
      backLink.href = "ambassador-login.html";
      backLink.textContent = "← Back to Ambassador Login";
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearRecoveryUrl() {
      try {
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (_) {}
    }

    function setRecoveryReady() {
      recoveryReady = true;
      password.disabled = false;
      confirmPassword.disabled = false;
      button.disabled = false;
      button.textContent = "Update Password";
      password.focus();
    }

    function setRecoveryInvalid() {
      recoveryReady = false;
      password.disabled = true;
      confirmPassword.disabled = true;
      button.disabled = true;
      button.textContent = "Reset Link Invalid";
      showMessage(
        "This password reset link is invalid or has expired. Please return to " + returnLabel + " and request a new reset email.",
        "error"
      );
    }

    async function prepareRecovery() {
      const params = new URLSearchParams(window.location.search);
      const tokenHash = (params.get("token_hash") || "").trim();
      const type = (params.get("type") || "").trim().toLowerCase();

      try {
        if (tokenHash) {
          if (type !== "recovery") {
            setRecoveryInvalid();
            return;
          }

          const { error } = await db.auth.verifyOtp({
            token_hash: tokenHash,
            type: "recovery"
          });

          if (error) {
            console.error("Recovery token verification failed:", error);
            setRecoveryInvalid();
            return;
          }

          clearRecoveryUrl();
          setRecoveryReady();
          return;
        }

        if (recoveryMarkerInUrl) {
          await new Promise(resolve => setTimeout(resolve, 250));
          const { data, error } = await db.auth.getSession();
          if (!error && data?.session) {
            clearRecoveryUrl();
            setRecoveryReady();
            return;
          }
        }

        setRecoveryInvalid();
      } catch (error) {
        console.error("Recovery preparation failed:", error);
        setRecoveryInvalid();
      }
    }

    async function checkRecoverySession() {
      if (!recoveryReady) return false;
      const { data, error } = await db.auth.getSession();
      if (error || !data?.session) {
        setRecoveryInvalid();
        return false;
      }
      return true;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const newPassword = password.value.trim();
      const confirm = confirmPassword.value.trim();

      if (newPassword.length < 8) {
        showMessage(
          "Your password must be at least 8 characters long.",
          "error"
        );
        return;
      }

      if (newPassword !== confirm) {
        showMessage(
          "The passwords do not match.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Updating Password...";

      try {
        const validSession = await checkRecoverySession();

        if (!validSession) return;

        const { error } = await db.auth.updateUser({
          password: newPassword
        });

        if (error) {
          showMessage(
            error.message || "Unable to update your password.",
            "error"
          );
          button.disabled = false;
          button.textContent = "Update Password";
          return;
        }

        showMessage(
          "Your password has been successfully updated. You can now log in with your new password.",
          "success"
        );

        form.reset();
        password.disabled = true;
        confirmPassword.disabled = true;

        try {
          await db.auth.signOut();
        } catch (_) {}

        if (isAmbassadorRecovery) {
          document.cookie = "foa_password_reset_portal=; Max-Age=0; Path=/; Secure; SameSite=Lax";
        }

        setTimeout(function() {
          window.location.href = returnHref;
        }, 1800);

      } catch (error) {
        console.error(error);
        showMessage(
          "Something went wrong. Please return to " + returnLabel + " and request a new password reset email.",
          "error"
        );
        button.disabled = false;
        button.textContent = "Update Password";
      }
    });

    prepareRecovery();
  </script>

</body>
</html>
