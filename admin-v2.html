      const r=await fetch('admin-v2-core.html?v=20260922-academic-admin-audit-v1',{cache:'no-store'});
      if(!r.ok)throw new Error('Admin core could not load');
      let h=await r.text();
      h=h.replace(/supabase-config\.js\?v=[^\"']+/,'supabase-config.js?v=20260921-support-crm-audit-v1');
      const oldAuth="let u=await db.auth.getUser();if(!u.data.user)return location.href='login.html';U=u.data.user;let p=await db.from('profiles').select('*').eq('id',U.id).maybeSingle();if(p.data?.role!=='admin'){await db.auth.signOut();return location.href='login.html'}";
      const stableAuth="let u=await db.auth.getUser();if(!u.data.user){const s=await db.auth.getSession();if(s.data?.session?.user){u={data:{user:s.data.session.user},error:null}}else{for(let i=0;i<3&&!u.data.user;i++){await new Promise(r=>setTimeout(r,500*(i+1)));u=await db.auth.getUser()}}}if(!u.data.user)return location.href='login.html';U=u.data.user;let p=null;for(let i=0;i<3;i++){p=await db.from('profiles').select('*').eq('id',U.id).maybeSingle();if(!p.error&&p.data)break;await new Promise(r=>setTimeout(r,500*(i+1)))}if(p?.error||!p?.data){$('notice').style.display='block';$('notice').textContent='Your Admin session is active, but profile verification is temporarily unavailable. Please refresh or try again shortly.';return}if(p.data.role!=='admin'){await db.auth.signOut();return location.href='login.html'}";
      if(h.includes(oldAuth))h=h.replace(oldAuth,stableAuth);
      h=h.replace(
        '</body>',

        '<script src="admin-course-qa-review.js?v=20260922-academic-stable-v3"><\/script>'+ 
        '<script src="admin-course-inspector.js?v=20260922-academic-stable-v3"><\/script>'+
